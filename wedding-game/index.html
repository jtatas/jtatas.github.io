/* ============================================================================
   11. SHARED SCENERY  —  string lights, guests, dance floor
   ========================================================================== */
function drawLights(g, t, y=26){
  g.strokeStyle = "#B79E85"; g.lineWidth = 1.5;
  g.beginPath();
  for (let x=0; x<=W; x+=6){
    const yy = y + Math.sin(x/58) * 12 + 12;
    x===0 ? g.moveTo(x,yy) : g.lineTo(x,yy);
  }
  g.stroke();
  const bulbCols = ["#F5A03C","#FBCB55","#EE7FA0"];
  for (let i=0;i<13;i++){
    const x = 14 + i*27;
    const yy = y + Math.sin(x/58)*12 + 12;
    const glow = 0.65 + 0.35*Math.sin(t*2.2 + i*0.9);
    g.globalAlpha = glow;
    g.fillStyle = bulbCols[i%3];
    g.fillRect(x-2, yy+2, 4, 6);
    g.globalAlpha = glow*0.22;
    g.beginPath(); g.arc(x, yy+5, 10, 0, 6.3); g.fill();
    g.globalAlpha = 1;
  }
}

function drawGuests(g, t, y, count=9){
  g.globalAlpha = .72;
  for (let i=0;i<count;i++){
    const x = 18 + i * (W-36)/(count-1);
    const bob = Math.sin(t*2.4 + i*1.3) * 3;
    const h = 26 + (i%3)*5;
    g.fillStyle = i%2 ? "#BE9E9E" : "#C9A9A0";
    g.fillRect(x-6, y-h+bob, 12, h);          // body
    g.beginPath(); g.arc(x, y-h+bob-4, 5.5, 0, 6.3); g.fill();  // head
  }
  g.globalAlpha = 1;
}

/* A band of foliage dotted with blooms — the greenery arch from the mood board,
   reduced to something a canvas can draw sixty times a second. */
function drawHedge(g, t, y){
  for (let i=0;i<28;i++){
    const x = (i*14) % (W+24) - 12;
    const r = 12 + (i%4)*5;
    g.globalAlpha = .50;
    g.fillStyle = i%2 ? "#7FA36A" : "#5F8752";
    g.beginPath(); g.arc(x, y + Math.sin(t*0.8 + i*0.7)*1.5, r, 0, 6.3); g.fill();
  }
  const blooms = ["#EE7FA0","#F5A03C","#FBCB55","#6E9BD8","#E4568A","#FFFDF4"];
  for (let i=0;i<20;i++){
    const x = (i*97) % W;
    const yy = y - 10 + ((i*53) % 20);
    g.globalAlpha = .88;
    g.fillStyle = blooms[i % blooms.length];
    g.beginPath(); g.arc(x, yy + Math.sin(t*0.9 + i)*1.5, 3.2, 0, 6.3); g.fill();
  }
  g.globalAlpha = 1;
}

function drawFloor(g, y, t=0){
  for (let i=0;i<12;i++){
    for (let j=0;j<3;j++){
      g.fillStyle = ((i+j) % 2) ? "#F0E3D2" : "#E7D8C4";
      g.fillRect(i*30, y + j*30, 30, 30);
    }
  }
  g.fillStyle = "#C9B49C"; g.fillRect(0, y, W, 2);
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================================
   12. GAME ONE  —  AUNT LENA'S SPELL (four-lane rhythm, weather on the line)
   ========================================================================== */
const D_LANES = 4, D_LANE_W = 72, D_X0 = (W - D_LANES*D_LANE_W)/2, D_RECEPTOR = 496;
const D_SPEED = 385;
const D_COLORS = ["#E4568A","#6E9BD8","#7FA36A","#E2683A"];
const D_ROT = [-Math.PI/2, Math.PI, 0, Math.PI/2];   // left, down, up, right
const D_WINDOW = { perfect:0.055, great:0.105, good:0.165 };
const D_SEED = 20250614;   // fixed so every guest plays the identical chart
const D_BPM  = 100;
const D_HORIZON = 250;     // hedge line she stands in front of

/* Lena, wand up. The star on her wand sits at 41% across and 9% down, which is
   where the sparkles come from on a good hit. */
const D_LENA = { aspect: 808/406, wandX: 0.41, wandY: 0.09, h: 176,
                 feet: D_HORIZON - 12 };   // stands just clear of the hedge
const LENA_ART = { img:null, ready:false };
if (typeof Image !== "undefined"){
  const im = new Image();
  im.onload  = ()=>{ LENA_ART.img = im; LENA_ART.ready = true; };
  im.onerror = ()=>{ LENA_ART.ready = false; };
  im.src = "lena.png";
}

/* How much each judgment feeds or drains the spell. Tuned so a clean run turns
   the sky about two thirds through, a scrappy one only manages a let-up, and a
   bad one leaves it raining. Misses cost less than hits earn, or 70% accuracy
   would end in a downpour and feel unfair. */
const D_POWER = { perfect:0.020, great:0.015, good:0.008, miss:-0.030 };

const SKY_WET  = { top:"#CBD6E2", bot:"#E8EDF2" };
const SKY_CLEAR= { top:"#EAF2FB", bot:"#FFFBF4" };

function drawArrow(g, cx, cy, s, dir, fill, outlineOnly){
  g.save();
  g.translate(cx, cy);
  g.rotate(D_ROT[dir]);
  g.beginPath();
  g.moveTo(0, -s);
  g.lineTo(s, 0);
  g.lineTo(s*0.44, 0);
  g.lineTo(s*0.44, s*0.85);
  g.lineTo(-s*0.44, s*0.85);
  g.lineTo(-s*0.44, 0);
  g.lineTo(-s, 0);
  g.closePath();
  if (outlineOnly){ g.strokeStyle = fill; g.lineWidth = 2.5; g.stroke(); }
  else {
    g.fillStyle = fill; g.fill();
    g.strokeStyle = "rgba(90,64,56,.30)"; g.lineWidth = 1.5; g.stroke();
  }
  g.restore();
}

function buildChart(bpm, seed){
  const rnd = mulberry32(seed), beat = 60/bpm, notes = [];
  // ~79 beats ≈ 47s of notes, which lands the whole round just under 50s.
  const sections = [
    { from:0,  to:12, density:0.42, eighth:0.00, jump:0.00 },
    { from:12, to:30, density:0.70, eighth:0.22, jump:0.03 },
    { from:30, to:50, density:0.86, eighth:0.46, jump:0.07 },
    { from:50, to:68, density:0.94, eighth:0.62, jump:0.13 },
    { from:68, to:79, density:0.58, eighth:0.18, jump:0.05 }
  ];
  let last = -1;
  for (const s of sections){
    for (let b = s.from; b < s.to; b++){
      if (rnd() < s.density){
        let lane = Math.floor(rnd()*4);
        if (lane === last && rnd() < 0.65) lane = (lane + 1 + Math.floor(rnd()*3)) % 4;
        notes.push({ t: b*beat, lane, judged:false }); last = lane;
        if (rnd() < s.jump) notes.push({ t: b*beat, lane:(lane + 1 + Math.floor(rnd()*3)) % 4, judged:false });
      }
      if (rnd() < s.eighth){
        let lane = Math.floor(rnd()*4);
        if (lane === last) lane = (lane+1) % 4;
        notes.push({ t: (b+0.5)*beat, lane, judged:false }); last = lane;
      }
    }
  }
  notes.sort((a,b)=> a.t - b.t);
  return notes;
}

function buildMusic(bpm, seed, totalBeats){
  const rnd = mulberry32(seed ^ 0x9e37), beat = 60/bpm, ev = [];
  // vi - IV - I - V: opens unsettled under the rain, resolves bright by the end
  const chords = [
    { root:110.00, tones:[261.63, 329.63, 440.00, 523.25] },
    { root: 87.31, tones:[261.63, 349.23, 440.00, 523.25] },
    { root:130.81, tones:[261.63, 329.63, 392.00, 523.25] },
    { root: 98.00, tones:[246.94, 293.66, 392.00, 493.88] }
  ];
  for (let b=0; b<totalBeats; b++){
    const ch = chords[Math.floor(b/4) % 4];
    if (b % 2 === 0) ev.push({ t:b*beat, type:"bass", freq:ch.root, dur:0.34, vol:0.34 });
    if (b % 4 === 2) ev.push({ t:b*beat, type:"bass", freq:ch.root*1.5, dur:0.2, vol:0.2 });
    ev.push({ t:b*beat, type:"hat" });
    ev.push({ t:(b+0.5)*beat, type:"hat" });
    if (b >= 8){
      const n = ch.tones[Math.floor(rnd()*ch.tones.length)];
      ev.push({ t:b*beat, type:"lead", freq:n, dur:0.16, vol:0.17 });
      if (b >= 40 && rnd() < 0.55)
        ev.push({ t:(b+0.5)*beat, type:"lead", freq:ch.tones[Math.floor(rnd()*4)]*(rnd()<0.3?2:1), dur:0.12, vol:0.13 });
    }
  }
  ev.sort((a,b)=> a.t - b.t);
  return ev;
}

class DanceGame {
  init(){
    this.notes = buildChart(D_BPM, D_SEED);
    this.total = this.notes.length;
    this.endT  = this.notes[this.notes.length-1].t + 2.6;
    this.music = buildMusic(D_BPM, D_SEED, 84);
    this.mi = 0;

    this.score = 0; this.combo = 0; this.maxCombo = 0;
    this.counts = { perfect:0, great:0, good:0, miss:0 };
    this.flash = [0,0,0,0];
    this.judge = null; this.judgeAge = 0;
    this.parts = new Particles();
    this.time = -3;
    this.begun = false;
    this.shake = 0;

    this.power = 0;   // how well the spell is going, 0..1
    this.clear = 0;   // the sky, easing toward power
    this.rain = [];
    for (let i=0;i<110;i++)
      this.rain.push({ x:rand(-40,W+40), y:rand(-H,H), len:rand(9,20), sp:rand(620,880) });

    Sfx.init(); Sfx.resume();

    Input.down = (x,y) => {
      if (!this.begun){ Sfx.blip(); this.roll(); return; }
      this.tap(clamp(Math.floor(x / (W/4)), 0, 3));
    };
    Input.key  = (k) => {
      if (!this.begun){ if (k === " " || k === "Enter") this.roll(); return; }
      const m = { ArrowLeft:0, ArrowDown:1, ArrowUp:2, ArrowRight:3 };
      if (m[k] !== undefined) this.tap(m[k]);
    };
  }

  /* PLAY pressed: 3s lead-in so the first notes fly in and she can wind up */
  roll(){
    this.begun = true;
    this.audioStart = Sfx.ctx ? Sfx.ctx.currentTime + 3 : 0;
  }

  get songTime(){ return Sfx.ctx ? Sfx.ctx.currentTime - this.audioStart : this.time; }
  get wandX(){ return W/2 + (D_LENA.wandX - 0.5) * (D_LENA.h / D_LENA.aspect); }
  get wandY(){ return D_LENA.feet - D_LENA.h + D_LENA.wandY * D_LENA.h; }

  tap(lane){
    if (this.time < -0.2) return;
    this.flash[lane] = 0.16;
    let best = null, bestDt = 1e9;
    for (const n of this.notes){
      if (n.judged || n.lane !== lane) continue;
      const dt = Math.abs(n.t - this.time);
      if (n.t - this.time > 0.4) break;
      if (dt < bestDt){ bestDt = dt; best = n; }
    }
    if (!best || bestDt > D_WINDOW.good){ Sfx.blip(); return; }
    best.judged = true;
    const cx = D_X0 + lane*D_LANE_W + D_LANE_W/2;
    if (bestDt <= D_WINDOW.perfect)      this.award("perfect", 300, "#E2683A", cx, 22);
    else if (bestDt <= D_WINDOW.great)   this.award("great",   200, "#3A6AA8", cx, 14);
    else                                 this.award("good",    100, "#4A6E3C", cx, 8);
  }

  award(key, base, color, cx, pn){
    this.counts[key]++;
    this.combo++;
    this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.score += base + Math.min(this.combo, 60) * 2;
    this.power = clamp(this.power + D_POWER[key], 0, 1);
    this.judge = { label:T(key), color }; this.judgeAge = 0;
    this.parts.burst(cx, D_RECEPTOR, pn, { colors:[color,"#FBCB55"], grav:120, maxSpeed:150, minLife:.3, maxLife:.7, size:3 });
    // a matching flick of sparkle off the tip of her wand
    this.parts.burst(this.wandX, this.wandY, Math.max(3, pn>>1), {
      colors:["#FFFDF4","#D9CBEE","#FBCB55"], grav:-30, maxSpeed:90,
      minLife:.5, maxLife:1.1, size:3
    });
    if (key === "perfect") Sfx.perfect(); else if (key === "great") Sfx.great(); else Sfx.good();
  }

  missNote(){
    this.counts.miss++;
    this.combo = 0;
    this.power = clamp(this.power + D_POWER.miss, 0, 1);
    this.judge = { label:T("miss"), color:"#C33A4E" }; this.judgeAge = 0;
    this.shake = 0.18;
    Sfx.miss();
  }

  tickMusic(){
    if (!Sfx.ctx) return;
    const now = Sfx.ctx.currentTime, horizon = now + 0.28;
    while (this.mi < this.music.length && this.audioStart + this.music[this.mi].t < horizon){
      const e = this.music[this.mi++];
      const when = this.audioStart + e.t;
      if (when < now) continue;
      if (e.type === "hat") Sfx.noise(0.028, 0.045, when);
      else Sfx.tone(e.freq, e.dur, e.type === "bass" ? "triangle" : "square", e.vol, when);
    }
  }

  update(dt){
    this.parts.update(dt);
    // rain keeps falling on the intro screen too, so the problem is obvious
    const drops = Math.round(110 * (1 - this.clear));
    for (let i=0;i<drops;i++){
      const d = this.rain[i];
      d.y += d.sp * dt; d.x += d.sp * 0.18 * dt;
      if (d.y > H + 20){ d.y = rand(-120,-10); d.x = rand(-60, W+20); }
    }
    if (!this.begun) return;

    this.time = this.songTime;
    this.tickMusic();
    this.judgeAge += dt;
    this.shake = Math.max(0, this.shake - dt);
    this.clear += (this.power - this.clear) * Math.min(1, dt*2.2);
    for (let i=0;i<4;i++) this.flash[i] = Math.max(0, this.flash[i] - dt);

    for (const n of this.notes){
      if (!n.judged && n.t < this.time - D_WINDOW.good){ n.judged = true; this.missNote(); }
    }
    if (this.time > this.endT) this.finish();
  }

  get weather(){
    const c = this.clear;
    if (c > 0.85) return { title:T("sunCameOut"), line:T("sunCameOutL") };
    if (c > 0.55) return { title:T("rainEased"),  line:T("rainEasedL")  };
    if (c > 0.25) return { title:T("stillSpit"),  line:T("stillSpitL")  };
    return               { title:T("lenaAlone"),  line:T("lenaAloneL")  };
  }

  finish(){
    const acc = this.total ? (this.counts.perfect + this.counts.great*0.72 + this.counts.good*0.42) / this.total : 0;
    const w = this.weather;
    showResults("spell", this.score, {
      title: w.title,
      lead:  w.line,
      stats: [
        [T("statAccuracy"), Math.round(acc*100) + "%"],
        [T("statCombo"),    this.maxCombo],
        [T("perfect"),      this.counts.perfect],
        [T("great"),        this.counts.great],
        [T("good"),         this.counts.good],
        [T("miss"),         this.counts.miss]
      ],
      meta: { acc: Math.round(acc*100), combo: this.maxCombo, sky: Math.round(this.clear*100) }
    });
  }

  pause(){}
  destroy(){}

  /* ---------- scenery ---------- */
  drawSky(g){
    const c = this.clear;
    // no horizon in this game — open sky top to bottom, nothing to read but the arrows
    const grad = g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, mixHex(SKY_WET.top, SKY_CLEAR.top, c));
    grad.addColorStop(1, mixHex(SKY_WET.bot, SKY_CLEAR.bot, c));
    g.fillStyle = grad; g.fillRect(0,0,W,H);

    // sun burns through as the spell takes hold
    const sun = clamp((c - 0.35)/0.5, 0, 1);
    if (sun > 0){
      g.globalAlpha = sun*0.30; g.fillStyle = "#FBCB55";
      g.beginPath(); g.arc(40, 104, 46, 0, 6.3); g.fill();
      g.globalAlpha = sun*0.75;
      g.beginPath(); g.arc(40, 104, 20, 0, 6.3); g.fill();
      g.globalAlpha = 1;
    }
    // and a rainbow once it's properly clear
    if (c > 0.80){
      const a = (c - 0.80)/0.20;
      const bands = ["#EE7FA0","#E2683A","#FBCB55","#7FA36A","#6E9BD8","#A98BA0"];
      g.lineWidth = 5;
      bands.forEach((col,i)=>{
        g.globalAlpha = a*0.34; g.strokeStyle = col;
        g.beginPath(); g.arc(180, 430, 250 - i*5, Math.PI*1.12, Math.PI*1.88); g.stroke();
      });
      g.globalAlpha = 1;
    }
  }

  drawRain(g){
    const drops = Math.round(110 * (1 - this.clear));
    if (!drops) return;
    // thin, fast and pale so it never competes with the arrows for attention
    g.strokeStyle = "rgba(110,155,216,.34)"; g.lineWidth = 1;
    g.beginPath();
    for (let i=0;i<drops;i++){
      const d = this.rain[i];
      g.moveTo(d.x, d.y); g.lineTo(d.x - d.len*0.18, d.y - d.len);
    }
    g.stroke();
  }

  drawLena(g, t){
    const h = D_LENA.h, w = h / D_LENA.aspect;
    const bob = Math.sin(t*2.2) * 3;
    const x = W/2 - w/2, y = D_LENA.feet - h + bob;
    // one soft shadow so she isn't floating now the scenery is gone
    g.globalAlpha = 0.10; g.fillStyle = "#5A4038";
    g.beginPath(); g.ellipse(W/2, D_LENA.feet + 2, w*0.30, 4, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    // her aura brightens with the spell
    if (this.clear > 0.05){
      g.globalAlpha = this.clear*0.22; g.fillStyle = "#FBCB55";
      g.beginPath(); g.arc(W/2, D_LENA.feet - h*0.55 + bob, h*0.42, 0, 6.3); g.fill();
      g.globalAlpha = 1;
    }
    if (LENA_ART.ready){
      g.drawImage(LENA_ART.img, x, y, w, h);
    } else {
      g.fillStyle = "#8A4B2A"; g.fillRect(W/2-13, y+22, 26, 20);
      g.fillStyle = "#F2D9C4"; g.fillRect(W/2-11, y+38, 22, 20);
      g.fillStyle = "#2F5C60"; g.fillRect(W/2-18, y+58, 36, h-58);
      g.strokeStyle = "#5A4038"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(W/2-14, y+62); g.lineTo(this.wandX, this.wandY); g.stroke();
      g.fillStyle = "#FFFDF4"; g.fillRect(this.wandX-4, this.wandY-4, 8, 8);
    }
  }

  draw(g){
    const t = Math.max(0, this.time);
    g.save();
    if (this.shake > 0) g.translate(rand(-3,3)*this.shake*5, rand(-3,3)*this.shake*5);

    this.drawSky(g);

    // lanes, washed over the scene so the arrows stay readable
    for (let i=0;i<4;i++){
      const x = D_X0 + i*D_LANE_W;
      g.fillStyle = i%2 ? "rgba(255,255,255,.42)" : "rgba(255,255,255,.66)";
      g.fillRect(x, 0, D_LANE_W, H);
      if (this.flash[i] > 0){
        g.globalAlpha = this.flash[i]*3;
        g.fillStyle = D_COLORS[i]; g.fillRect(x, D_RECEPTOR-140, D_LANE_W, 180);
        g.globalAlpha = 1;
      }
    }
    this.drawRain(g);

    g.fillStyle = "rgba(90,64,56,.08)"; g.fillRect(D_X0, D_RECEPTOR-30, D_LANE_W*4, 60);
    g.fillStyle = "rgba(90,64,56,.18)"; g.fillRect(D_X0, D_RECEPTOR-30, D_LANE_W*4, 2);
    g.fillStyle = "rgba(90,64,56,.18)"; g.fillRect(D_X0, D_RECEPTOR+28, D_LANE_W*4, 2);

    for (let i=0;i<4;i++){
      const cx = D_X0 + i*D_LANE_W + D_LANE_W/2;
      const pulse = this.flash[i] > 0 ? 1.18 : 1;
      drawArrow(g, cx, D_RECEPTOR, 21*pulse, i, this.flash[i] > 0 ? D_COLORS[i] : "rgba(90,64,56,.28)", true);
    }

    // after the lane wash so she stays crisp, before the notes so they fall past her
    this.drawLena(g, t);

    for (const n of this.notes){
      if (n.judged) continue;
      const y = D_RECEPTOR - (n.t - this.time) * D_SPEED;
      if (y < -40 || y > H+40) continue;
      const cx = D_X0 + n.lane*D_LANE_W + D_LANE_W/2;
      drawArrow(g, cx, y, 21, n.lane, D_COLORS[n.lane], false);
    }

    this.parts.draw(g);

    // HUD
    g.fillStyle = "rgba(255,251,244,.86)"; g.fillRect(0,0,W,62);
    textShadow(g, fmt(this.score), W/2, 24, 17, "#E2683A");
    if (this.combo >= 3){
      const p = 1 + Math.max(0, 0.25 - this.judgeAge)*1.2;
      textShadow(g, T("combo", { n:this.combo }), W/2, 320, 15*p, "#96203C");
    }
    // song progress on the left, how clear the sky is on the right
    const prog = clamp(this.time / this.endT, 0, 1);
    g.fillStyle = "rgba(90,64,56,.12)"; g.fillRect(24, 46, 140, 5);
    g.fillStyle = "#A18A7B";            g.fillRect(24, 46, 140*prog, 5);
    g.fillStyle = "rgba(90,64,56,.12)"; g.fillRect(W-164, 46, 140, 5);
    g.fillStyle = this.clear > 0.8 ? "#FBCB55" : this.clear > 0.5 ? "#7FA36A" : "#6E9BD8";
    g.fillRect(W-164, 46, 140*this.clear, 5);
    textShadow(g, T("sky"), W-24, 38, 7, "#836B5C", "right");

    if (this.judge && this.judgeAge < 0.55){
      const a = 1 - this.judgeAge/0.55;
      g.globalAlpha = a;
      textShadow(g, this.judge.label, W/2, 386 - (1-a)*16, 18, this.judge.color);
      g.globalAlpha = 1;
    }

    if (!this.begun || this.time < 0){
      g.fillStyle = "rgba(255,251,244,.90)"; g.fillRect(0,0,W,H);
      textShadow(g, T("spellName"), W/2, 118, 15, "#96203C");
      let yy = paragraph(g, T("spellIntro"), W/2, 190, 9, "#5A4038", W-52);
      yy = paragraph(g, T("spellGoal"), W/2, yy + 34, 9, "#96203C", W-52);
      yy = paragraph(g, TK("spellHow","spellHowKeys"), W/2, yy + 34, 9, "#3A6AA8", W-52);
      if (!this.begun){
        playButton(g, yy, t);
      } else {
        const n = Math.ceil(-this.time);
        textShadow(g, n > 0 ? String(n) : T("go"), W/2, 436, 44, "#E2683A");
      }
    }
    g.restore();
  }
}

registerGame({
  id:"spell", icon:"&#10024;",
  nameKey:"spellName", shortKey:"spellShort", blurbKey:"spellBlurb",
  make:()=> new DanceGame()
});

/* ============================================================================
   13. GAME TWO  —  PETALS & RINGS (drag or arrow keys, corks are lava)
   ========================================================================== */
/* Eva (flower girl) and Soraya (ring bearer) hold the basket between them.
   Everything below is measured from maids.png so the mouth you can see is
   exactly the mouth that catches — the basket is 52.5% of the sprite's width
   and sits a shade left of its centre, which naive centring would get wrong. */
const MAIDS = {
  aspect: 384/491,     // sprite h / w
  catchL: 0.1752,      // basket mouth, as fractions of sprite width
  catchR: 0.8106,
  rimY:   0.4948,      // rim, as a fraction of sprite height
  baseY:  0.7135
};
/* Mouth width drives everything else. 58px is what the difficulty was tuned
   against, so changing this changes how hard the game is — the sprite just
   follows. The basket is only half the artwork's width, so the pair end up
   about twice as wide as the mouth. */
const C_CATCH_W = 58;                                        // mouth width, px
const C_MAID_W  = C_CATCH_W / (MAIDS.catchR - MAIDS.catchL); // ~129
const C_MAID_H  = C_MAID_W * MAIDS.aspect;                   // ~94
const C_CATCH_H = (MAIDS.baseY - MAIDS.rimY) * C_MAID_H;     // basket depth
const C_GROUND  = 556;                                       // y of the basket rim

const MAID_ART = { img:null, ready:false };
if (typeof Image !== "undefined"){
  const im = new Image();
  im.onload  = ()=>{ MAID_ART.img = im; MAID_ART.ready = true; };
  im.onerror = ()=>{ MAID_ART.ready = false; };
  im.src = "maids.png";
}

/* fallback if the sprite is missing — the plain wicker basket from before */
const BASKET = {
  map:[
    "..bbbbbbbbbb..",
    ".wwwwwwwwwwww.",
    "wwWWwwWWwwWWww",
    "wWWwwWWwwWWwww",
    "wwWWwwWWwwWWww",
    ".wwwwwwwwwwww.",
    "..wwwwwwwwww.."
  ],
  pal:{ b:"#D9A86A", w:"#EAC08C", W:"#B98A52" }
};

class CatchGame {
  init(){
    this.basket = { x: W/2, w: C_CATCH_W, h: C_CATCH_H, y: C_GROUND };
    this.items  = [];
    this.parts  = new Particles();
    this.score  = 0; this.lives = 3; this.streak = 0; this.mult = 1; this.maxMult = 1;
    this.begun = false;                 // read the brief in your own time first
    this.t = -2;                        // negative = countdown, once you've tapped
    this.duration = 50;                 // fixed round, so every guest gets the same shot
    this.spawn = 0;
    this.shake = 0; this.hurtFlash = 0; this.invuln = 0; this.popups = [];
    this.caught = 0; this.rings = 0;

    // --- control mode ---
    this.dragX = null; this.keyDir = 0;

    Input.down = (x,y)=>{
      if (!this.begun){ this.begun = true; Sfx.blip(); return; }
      this.dragX = x;
    };
    Input.move = (x,y)=>{ if (this.dragX !== null) this.dragX = x; };
    Input.up   = ()=>{ this.dragX = null; };
    Input.key  = (k)=>{
      if (!this.begun && (k === " " || k === "Enter")){ this.begun = true; return; }
      if (k === "ArrowLeft")  this.keyDir = -1;
      if (k === "ArrowRight") this.keyDir =  1;
    };
    this._keyUp = (e)=>{ if (e.key === "ArrowLeft" || e.key === "ArrowRight") this.keyDir = 0; };
    window.addEventListener("keyup", this._keyUp);
  }

  spawnItem(){
    const diff = this.difficulty;
    // Independent shares, so rings never get squeezed out as corks ramp up.
    const corkP = Math.min(0.22, 0.10 + diff*0.035);
    const ringP = 0.11;
    const r = Math.random();
    let type = r < corkP ? "cork" : r < corkP + ringP ? "ring" : "petal";

    // Fairness rail: never more than three corks in the air at once, so a bad
    // cluster can't be unsurvivable. Spawn position is deliberately NOT biased
    // away from the basket — corks take 2+ seconds to fall, which is all the
    // reaction time anyone needs, and a safe zone would make camping immortal.
    // No corks for the first 5 seconds either — everyone gets a moment to work
    // work out the controls before anything can hurt them.
    const corks = this.items.reduce((n,i)=> n + (i.type === "cork" ? 1 : 0), 0);
    if (type === "cork" && (this.t < 5 || corks >= 2)) type = "petal";
    const x = rand(24, W-24);

    const speed = { petal:112, ring:150, cork:132 }[type] * (0.85 + diff*0.30);
    this.items.push({
      x, y: -20, vy: speed, vx: type === "petal" ? rand(-26,26) : 0,
      type, rot: rand(0,6.3), spin: rand(-3,3),
      r: type === "ring" ? 9 : type === "cork" ? 8 : 7
    });
  }

  // Ramp compressed to the 50s round, so it still peaks where the 90s one did.
  get difficulty(){ return 1 + Math.max(0, this.t) / 18; }

  pop(txt, x, y, color){ this.popups.push({ txt, x, y, color, age:0 }); }

  update(dt){
    if (!this.begun) return;            // holding on the brief until they tap
    this.t += dt;
    this.parts.update(dt);
    this.shake = Math.max(0, this.shake - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt*2);
    this.invuln = Math.max(0, this.invuln - dt);
    for (let i=this.popups.length-1;i>=0;i--){
      const p = this.popups[i]; p.age += dt; p.y -= dt*26;
      if (p.age > 0.9) this.popups.splice(i,1);
    }

    if (this.t < 0) return;
    if (this.t >= this.duration){ this.finish(true); return; }

    // --- basket movement ---
    // drag on touch, arrow keys on a desktop. Tilt was removed: on real phones
    // it was imprecise, needed an iOS permission prompt, and only worked on HTTPS.
    let target = this.basket.x;
    if (this.dragX !== null) target = this.dragX;
    else if (this.keyDir)    target = this.basket.x + this.keyDir * 340 * dt * 6;
    this.basket.x = lerp(this.basket.x, clamp(target, this.basket.w/2, W - this.basket.w/2), Math.min(1, dt*14));

    // --- spawning ---
    this.spawn -= dt;
    if (this.spawn <= 0){
      this.spawnItem();
      this.spawn = Math.max(0.26, 0.72 / this.difficulty) * rand(0.75, 1.25);
    }

    // --- items ---
    const b = this.basket;
    for (let i=this.items.length-1;i>=0;i--){
      const it = this.items[i];
      it.y += it.vy * dt;
      it.x += it.vx * dt;
      it.rot += it.spin * dt;
      if (it.x < 12 || it.x > W-12) it.vx *= -1;

      const inX = Math.abs(it.x - b.x) < b.w/2 + it.r*0.55;
      const inY = it.y + it.r > b.y && it.y - it.r < b.y + b.h*0.8;
      // corks pass harmlessly through during the grace window after a hit,
      // so one unlucky cluster can't drain all three lives at once
      if (inX && inY && !(it.type === "cork" && this.invuln > 0)){
        this.items.splice(i,1);
        if (it.type === "cork"){
          this.lives--; this.streak = 0; this.mult = 1;
          this.shake = 0.3; this.hurtFlash = 1; this.invuln = 0.9;
          this.parts.burst(it.x, b.y, 16, { colors:["#C33A4E","#D9A86A"], grav:400, maxSpeed:190 });
          this.pop(T("ow"), it.x, b.y-20, "#C33A4E");
          Sfx.boom();
          if (this.lives <= 0){ this.finish(); return; }
        } else {
          const base = it.type === "ring" ? 50 : 10;
          this.score += base * this.mult;
          this.streak++; this.caught++;
          if (it.type === "ring") this.rings++;
          this.mult = Math.min(5, 1 + Math.floor(this.streak/8));
          this.maxMult = Math.max(this.maxMult, this.mult);
          this.parts.burst(it.x, b.y, it.type === "ring" ? 18 : 9, {
            colors: it.type === "ring" ? ["#F5A03C","#FBCB55"] : ["#E4568A","#EE7FA0","#FBCB55"],
            grav:180, maxSpeed:170, minLife:.35, maxLife:.8
          });
          this.pop("+" + (base*this.mult), it.x, b.y-18, it.type === "ring" ? "#E2683A" : "#EE7FA0");
          it.type === "ring" ? Sfx.great() : Sfx.good();
        }
        continue;
      }

      if (it.y - it.r > H){
        this.items.splice(i,1);
        // Dropping a petal is forgiven — several fall at once and you can't be
        // everywhere. Dropping a RING breaks the streak; rings are rare and slow.
        if (it.type === "ring" && this.streak > 0){ this.streak = 0; this.mult = 1; }
      }
    }
  }

  finish(timeUp){
    showResults("petals", this.score, {
      title: timeUp && this.lives === 3 ? T("notAScratch") : timeUp ? T("wentDistance")
           : this.score > 2500 ? T("safeHands") : null,
      lead:  timeUp ? T("lastedFull") : T("outAt", { t:Math.round(this.t) }),
      stats: [
        [T("statPetals"), this.caught - this.rings],
        [T("statRings"),  this.rings],
        [T("statMult"),   "x" + this.maxMult]
      ],
      meta: { time: Math.round(this.t), caught: this.caught, lives: this.lives }
    });
  }

  destroy(){
    window.removeEventListener("keyup", this._keyUp);
  }

  draw(g){
    const t = Math.max(0, this.t);
    g.save();
    if (this.shake > 0) g.translate(rand(-4,4)*this.shake*4, rand(-4,4)*this.shake*4);

    // daytime garden: warm sky wash, sun haze, drifting pollen, hedge line
    g.fillStyle = "#FFFBF4"; g.fillRect(0,0,W,H);
    const sky = g.createLinearGradient(0,0,0,H*0.55);
    sky.addColorStop(0, "#EAF2FB");
    sky.addColorStop(1, "#FFFBF4");
    g.fillStyle = sky; g.fillRect(0,0,W,H*0.55);

    g.globalAlpha = .30; g.fillStyle = "#FBCB55";
    g.beginPath(); g.arc(298, 74, 30, 0, 6.3); g.fill();
    g.globalAlpha = .55;
    g.beginPath(); g.arc(298, 74, 17, 0, 6.3); g.fill();
    g.globalAlpha = 1;

    for (let i=0;i<26;i++){
      const x = (i*61 + Math.sin(t*0.5 + i)*14) % W;
      const y = ((i*137 + t*11) % 320) + 40;
      g.globalAlpha = 0.20 + 0.22*Math.sin(t*1.6 + i);
      g.fillStyle = i%3 ? "#EAC08C" : "#EE7FA0";
      g.fillRect(x, y, 2, 2);
    }
    g.globalAlpha = 1;

    drawHedge(g, t, C_GROUND + 22);
    drawLights(g, t, 4);
    drawFloor(g, C_GROUND + (1 - MAIDS.rimY) * C_MAID_H);   // floor meets their feet

    // items
    for (const it of this.items){
      g.save(); g.translate(it.x, it.y); g.rotate(it.rot);
      if (it.type === "petal"){
        g.fillStyle = "#EE7FA0"; g.fillRect(-6,-4,12,8);
        g.fillStyle = "#E4568A"; g.fillRect(-6,-4,6,8);
        g.fillStyle = "#FBCB55"; g.fillRect(2,-1,3,3);
      } else if (it.type === "ring"){
        g.strokeStyle = "#F5A03C"; g.lineWidth = 3.5;
        g.beginPath(); g.arc(0,0,7.5,0,6.3); g.stroke();
        g.fillStyle = "#FFFDF4"; g.fillRect(-1.5,-11,3,4);
        g.globalAlpha = .3; g.beginPath(); g.arc(0,0,13,0,6.3);
        g.strokeStyle = "#F5A03C"; g.lineWidth = 2; g.stroke(); g.globalAlpha = 1;
      } else {
        g.fillStyle = "#D9A86A"; g.fillRect(-6,-9,12,18);
        g.fillStyle = "#96203C"; g.fillRect(-6,-9,12,5);
        g.fillStyle = "#EAC08C"; g.fillRect(-4,-2,3,8);
      }
      g.restore();
    }

    // Eva and Soraya — they blink while the post-hit grace window runs
    if (!(this.invuln > 0 && Math.floor(this.invuln*12) % 2)){
      if (MAID_ART.ready){
        // line the basket's mouth up with the hitbox, not the sprite's centre
        const L = this.basket.x - (MAIDS.catchL + MAIDS.catchR)/2 * C_MAID_W;
        g.drawImage(MAID_ART.img, L, this.basket.y - MAIDS.rimY*C_MAID_H, C_MAID_W, C_MAID_H);
      } else {
        sprite(g, BASKET.map, BASKET.pal, this.basket.x - 7*4, this.basket.y, 4);
      }
    }

    this.parts.draw(g);

    // popups
    for (const p of this.popups){
      g.globalAlpha = clamp(1 - p.age/0.9, 0, 1);
      textShadow(g, p.txt, p.x, p.y, 10, p.color);
      g.globalAlpha = 1;
    }

    // HUD
    g.fillStyle = "rgba(255,251,244,.86)"; g.fillRect(0,0,W,62);
    textShadow(g, fmt(this.score), 128, 24, 16, "#E2683A", "right");
    if (this.mult > 1) textShadow(g, "x" + this.mult, 148, 25, 12, "#E4568A", "left");
    // countdown bar
    const left = clamp(1 - Math.max(0,this.t)/this.duration, 0, 1);
    g.fillStyle = "rgba(90,64,56,.12)"; g.fillRect(24, 52, W-48, 4);
    g.fillStyle = left < 0.17 ? "#C33A4E" : "#6E9BD8"; g.fillRect(24, 52, (W-48)*left, 4);
    if (this.t > 0 && this.t > this.duration - 10.5)
      textShadow(g, String(Math.ceil(this.duration - this.t)), W/2, 24, 16,
                 Math.sin(this.t*9) > 0 ? "#C33A4E" : "#5A4038");
    for (let i=0;i<3;i++){
      g.globalAlpha = i < this.lives ? 1 : 0.18;
      g.strokeStyle = "#E4568A"; g.lineWidth = 3;
      g.beginPath(); g.arc(W - 26 - i*30, 26, 8, 0, 6.3); g.stroke();
      g.globalAlpha = 1;
    }

    if (this.hurtFlash > 0){
      g.globalAlpha = this.hurtFlash * 0.35;
      g.fillStyle = "#C33A4E"; g.fillRect(0,0,W,H); g.globalAlpha = 1;
    }

    if (!this.begun || this.t < 0){
      g.fillStyle = "rgba(255,251,244,.90)"; g.fillRect(0,0,W,H);
      textShadow(g, T("petalsName"), W/2, 118, 15, "#96203C");
      let yy = paragraph(g, T("petalsIntro"), W/2, 190, 9, "#BB3D67", W-52);
      yy = paragraph(g, TK("dragToMove","keysToMove"), W/2, yy + 34, 9, "#3A6AA8", W-52);
      yy = paragraph(g, T("dodgeCorks"),   W/2, yy + 20, 9, "#C33A4E", W-52);

      if (!this.begun){
        playButton(g, yy, t);
      } else {
        const n = Math.ceil(-this.t);
        textShadow(g, n > 0 ? String(n) : T("go"), W/2, 452, 44, "#E2683A");
      }
    }
    g.restore();
  }
}

registerGame({
  id:"petals", icon:"&#127800;",
  nameKey:"petalsName", shortKey:"petalsShort", blurbKey:"petalsBlurb",
  make:()=> new CatchGame()
});

/* ============================================================================
   14. GAME THREE  —  CONFETTI CANNON (one shot, timed to the kiss)
   ========================================================================== */
const P_AISLE = 470;             // the line they run along
const P_CX    = W/2;             // where they meet
const P_GAP0  = 460;             // distance still to close when the round starts
const P_LATE  = 110;             // how far past the kiss before it's a write-off
const P_TUBE  = { x: W/2, base: 620, h: 96, w: 30 };

/* Side-profile sprites. He faces right, she faces left, so they close on the
   middle without either needing to be flipped. */
const ART = { groom:null, bride:null, kiss:null, officiant:null, ready:false };
if (typeof Image !== "undefined"){
  let left = 3;
  const load = (key, src) => {
    const im = new Image();
    im.onload  = ()=>{ ART[key] = im; if (--left === 0) ART.ready = true; };
    im.onerror = ()=>{ ART.ready = false; };
    im.src = src;
  };
  load("groom", "groom.png");
  load("bride", "bride.png");
  load("kiss",  "kiss.png");     // they swap to this the instant they meet
  // Easter egg: only ever appears on a perfect shot
  const off = new Image();
  off.onload = ()=>{ ART.officiant = off; };
  off.src = "officiant.png";
}

/* puff = how much confetti actually leaves the tube. A perfect shot empties it;
   a bad one manages a sad little cough. */
/* The kiss sprite swaps in at exactly the top of the perfect band, so the whole
   1,000-point window has the kiss on screen. If you can see it, you can score it. */
const P_KISS_AT = 8;

/* Drawn height of kiss.png, and where each of them sits inside it — measured
   from the artwork's alpha channel. The two running sprites are sized from
   these rather than from a flat number, because groom.png and bride.png have
   different proportions: drawing both at one height made Max 4% shorter than
   his kiss pose and Julie 3% taller than hers, so he visibly shrank on contact.
   `h` is his share of the sprite's height, `foot` how far his feet sit above
   its base. */
const P_KISS_H = 112;
const P_FIT = {
  groom: { h: 380/393, foot: 13/393 },
  bride: { h: 356/393, foot:  1/393 }
};
/* Where their lips actually meet inside kiss.png, measured as the seam between
   the two faces. It is NOT the middle of the picture — Julie's dress and veil
   trail right, so centring on the bounding box pushed the kiss 8px right of the
   mark and the confetti came up beside them instead of between them. */
const P_KISS_CX = 0.4092;

const P_BANDS = [
  { px: P_KISS_AT, pts:1000, puff:2000, key:"mazelTov",  color:"#96203C" },
  { px: 18, pts: 750, puff:260, key:"soNearly",  color:"#C75126" },
  { px: 34, pts: 500, puff:130, key:"notBad",    color:"#3A6AA8" },
  { px: 62, pts: 250, puff: 55, key:"offBeat",   color:"#4A6E3C" },
  { px:999, pts:  50, puff: 16, key:"maybeNext", color:"#836B5C" }
];

class CannonGame {
  init(){
    this.phase = "intro";        // intro | run | result
    this.t = 0;
    this.timer = 0;
    this.parts = new Particles();
    this.gap   = P_GAP0;                 // >0 still running, <0 past the kiss
    this.speed = rand(135, 180);         // combined closing speed, px/s
    this.kissT = 0;                      // seconds since they met
    this.result = null;
    this.pop = 0;                        // tube recoil
    this.waves = null; this.waveT = 0; this.emitted = 0; this.bigShot = false;

    Input.down = ()=> this.tap();
    Input.key  = (k)=>{ if (k === " " || k === "Enter") this.tap(); };
  }

  tap(){
    if (this.phase === "intro"){ this.phase = "run"; Sfx.blip(); return; }
    if (this.phase === "run")   this.fire();
  }

  fire(){
    const dist = Math.abs(this.gap);
    const band = P_BANDS.find(b => dist <= b.px);
    this.result = {
      label: T(band.key), pts: band.pts, color: band.color, dist,
      when: dist <= P_KISS_AT ? ""
          : T(this.gap > 0 ? "notKissedYet" : "momentPassed")
    };
    this.pop = 1;
    this.phase = "result";
    this.timer = band.pts === 1000 ? 6.0 : 2.4;   // a perfect shot earns a proper party

    // A real cannon doesn't dump everything in one frame, so the big shot goes
    // out in waves. It also spreads the drawing cost over ~a quarter second.
    const big = band.pts >= 750;
    this.bigShot = big;
    // a perfect shot keeps topping itself up so the screen stays full for the
    // whole six seconds instead of raining out after two
    this.waves = band.pts === 1000
      ? [ { at:0,    n: Math.round(band.puff*0.30) },
          { at:0.10, n: Math.round(band.puff*0.16) },
          { at:0.22, n: Math.round(band.puff*0.12) },
          { at:0.90, n: Math.round(band.puff*0.14) },
          { at:1.70, n: Math.round(band.puff*0.12) },
          { at:2.60, n: Math.round(band.puff*0.10) },
          { at:3.60, n: Math.round(band.puff*0.10) } ]
      : big
      ? [ { at:0,    n: Math.round(band.puff*0.55) },
          { at:0.10, n: Math.round(band.puff*0.28) },
          { at:0.22, n: Math.round(band.puff*0.17) } ]
      : [ { at:0, n: band.puff } ];
    this.waveT = 0;

    band.pts >= 750 ? Sfx.fanfare() : band.pts >= 250 ? Sfx.good() : Sfx.sad();
  }

  emit(n){
    const big = this.bigShot;
    this.emitted += n;
    this.parts.burst(P_TUBE.x, P_TUBE.base - P_TUBE.h, n, {
      angle: -Math.PI/2,
      colors: big ? ["#FFF6EC","#F7EDE4","#EE7FA0","#FBCB55","#6E9BD8","#7FA36A","#E4568A"]
                  : ["#FFF6EC","#F7EDE4","#E7D8C4"],
      minSpeed: big ? 200 :  70,
      maxSpeed: big ? 540 : 190,
      grav: 300,
      minLife: big ? 1.3 : 0.6,
      maxLife: big ? 2.9 : 1.2,
      size: 4
    });
  }

  update(dt){
    this.t += dt;
    this.parts.update(dt);
    this.pop = Math.max(0, this.pop - dt*3);

    if (this.phase === "run"){
      this.gap -= this.speed * dt;
      if (this.gap <= P_KISS_AT) this.kissT += dt;
      if (this.gap < -P_LATE){
        this.result = { label:T("maybeNext"), pts:0, color:"#836B5C",
                        dist:null, when:T("missedKiss") };
        this.phase = "result"; this.timer = 2.4; Sfx.sad();
      }
      return;
    }
    if (this.phase === "result"){
      if (this.gap <= P_KISS_AT) this.kissT += dt;
      if (this.waves && this.waves.length){
        this.waveT += dt;
        while (this.waves.length && this.waveT >= this.waves[0].at) this.emit(this.waves.shift().n);
      }
      this.timer -= dt;
      if (this.timer <= 0) this.finish();
    }
  }

  finish(){
    const r = this.result;
    showResults("cannon", r.pts, {
      title: r.pts === 1000 ? T("perfectTiming") : r.pts >= 750 ? T("almostPerfect") : null,
      lead:  r.when || r.label,
      stats: r.dist == null ? [] : [[T("statOffBy"), Math.round(r.dist) + "px"]],
      meta: { off: r.dist == null ? null : Math.round(r.dist) }
    });
  }

  /* --- the runners: sprites when they load, stick figures when they don't --- */
  drawRunner(g, who, edgeX, feetY, facing){
    const fit  = P_FIT[who];
    const H    = P_KISS_H * fit.h;               // exactly his/her size in the kiss
    const base = feetY - P_KISS_H * fit.foot;    // and standing on the same line
    const im   = ART.ready ? ART[who] : null;
    if (im){
      const w = H * (im.width / im.height);
      // he's anchored by his right edge, she by her left, so their faces meet
      g.drawImage(im, facing > 0 ? edgeX - w : edgeX, base - H, w, H);
      return;
    }
    const x = facing > 0 ? edgeX - 26 : edgeX + 6;
    if (who === "groom"){
      g.fillStyle = "#6B4A2F"; g.fillRect(x+6, base-92, 18, 15);
      g.fillStyle = "#F2D9C4"; g.fillRect(x+8, base-79, 15, 14);
      g.fillStyle = "#FDF6EA"; g.fillRect(x+4, base-64, 20, 30);
      g.fillStyle = "#2C2622"; g.fillRect(x+7, base-34, 15, 34);
    } else {
      g.fillStyle = "#2A1F1C"; g.fillRect(x+2, base-92, 18, 20);
      g.fillStyle = "#F2D9C4"; g.fillRect(x,   base-79, 14, 14);
      g.fillStyle = "#FFF8F0"; g.fillRect(x,   base-62, 22, 62);
    }
  }

  /* --- a rice-paper confetti tube, like the ones on the gift table --- */
  drawTube(g){
    const { x, base, h, w } = P_TUBE;
    const lift = this.pop * 7;
    const top = base - h - lift, bot = base - lift;
    g.save();
    g.fillStyle = "rgba(90,64,56,.10)";
    g.beginPath(); g.ellipse(x, base + 5, w*0.62, 5, 0, 0, 6.3); g.fill();

    g.fillStyle = "#F7EDE4"; g.fillRect(x - w/2, top, w, h);          // body
    g.fillStyle = "#FFFBF6"; g.fillRect(x - w/2 + 3, top, 7, h);      // gloss
    g.fillStyle = "#E5D5C6"; g.fillRect(x + w/2 - 6, top, 6, h);      // shaded side
    g.fillStyle = "#D8C4B2"; g.fillRect(x - w/2, top, w, 5);          // rim

    g.fillStyle = "#B7A08C";                                          // label marks
    g.fillRect(x - 9, top + 20, 18, 2);
    g.fillRect(x - 7, top + 26, 14, 2);
    g.strokeStyle = "#CBB8A6"; g.lineWidth = 1; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(x - w/2, bot - 16); g.lineTo(x + w/2, bot - 16); g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  /* The moment they meet, the two profiles become one kiss. A short scale pop
     sells the swap rather than trying to hide it. */
  drawKiss(g, feetY){
    const pop = 1 + 0.07 * Math.max(0, 1 - this.kissT/0.26) * Math.sin(this.kissT/0.26 * Math.PI);
    const H = P_KISS_H * pop;
    const im = ART.ready ? ART.kiss : null;
    if (im){
      const w = H * (im.width / im.height);
      // line the lips up with the mark, not the picture's centre. The pop then
      // scales about the kiss itself, which is the right pivot for it.
      g.drawImage(im, P_CX - P_KISS_CX * w, feetY - H, w, H);
      return;
    }
    this.drawRunner(g, "groom", P_CX - 2, feetY,  1);
    this.drawRunner(g, "bride", P_CX + 2, feetY, -1);
  }

  /* The officiant leans in from the bottom-right, tilted, only on a perfect
     shot. He arrives a beat after MAZEL TOV lands, bobs, then ducks back out. */
  drawOfficiant(g){
    const im = ART.officiant;
    if (!im) return;
    const t = this.timer;                       // counts down from 6
    const inAt = 4.6, outAt = 1.2;              // visible between these
    let k = 0;
    if (t <= inAt && t >= outAt) k = 1;
    else if (t > inAt) k = clamp((5.0 - t) / 0.4, 0, 1);
    else k = clamp(t / 0.5, 0, 1);
    if (k <= 0) return;
    const ease = k*k*(3 - 2*k);                 // smootherstep, so he pops
    const h = 210, w = h * (im.width / im.height);
    const restX = W - w*0.52, restY = H - h*0.66;
    const x = lerp(W + w*0.4, restX, ease);
    const y = lerp(H + h*0.4, restY, ease) + Math.sin(this.t*4) * 5;
    g.save();
    g.translate(x + w/2, y + h/2);
    g.rotate((-0.30 + Math.sin(this.t*3)*0.03) * ease);   // leaning in
    g.drawImage(im, -w/2, -h/2, w, h);
    g.restore();
  }

  drawHearts(g){
    const n = 3;
    for (let i=0;i<n;i++){
      const age = this.kissT - i*0.18;
      if (age <= 0) continue;
      const y = P_AISLE - 96 - age*34;
      const x = P_CX + Math.sin(age*3 + i)*9;
      const s = 5 - i*0.7;
      g.globalAlpha = clamp(1 - age/1.6, 0, 1);
      g.fillStyle = i%2 ? "#EE7FA0" : "#E4568A";
      g.fillRect(x-s, y-s, s, s); g.fillRect(x, y-s, s, s);
      g.fillRect(x-s, y, s*2, s); g.fillRect(x-s/2, y+s, s, s);
    }
    g.globalAlpha = 1;
  }

  draw(g){
    const t = this.t;
    g.fillStyle = "#FFFBF4"; g.fillRect(0,0,W,H);
    const sky = g.createLinearGradient(0,0,0,P_AISLE);
    sky.addColorStop(0, "#EAF2FB"); sky.addColorStop(1, "#FFFBF4");
    g.fillStyle = sky; g.fillRect(0,0,W,P_AISLE);

    drawHedge(g, t, P_AISLE - 30);
    drawLights(g, t, 8);
    drawGuests(g, t, P_AISLE - 6, 10);
    drawFloor(g, P_AISLE);

    g.fillStyle = "#FBF3E8"; g.fillRect(0, P_AISLE, W, 30);
    g.fillStyle = "#EFE0CE"; g.fillRect(0, P_AISLE, W, 2);

    // the meeting point
    const met = this.gap <= P_KISS_AT;
    g.globalAlpha = met ? 0.9 : (this.phase === "run" ? 0.35 + 0.35*Math.sin(t*5) : 0.3);
    g.fillStyle = met ? "#E4568A" : "#D9B9C6";
    g.fillRect(P_CX - 1, P_AISLE + 2, 2, 26);
    g.globalAlpha = 1;

    if (this.phase !== "intro"){
      const feet = P_AISLE + 22;
      if (met){
        this.drawKiss(g, feet);
        this.drawHearts(g);
      } else {
        // closes to nothing exactly as the kiss takes over — no leftover gap,
        // and the running bounce settles out so they don't jump on contact
        const half = (this.gap - P_KISS_AT) / 2;
        const bob  = Math.abs(Math.sin(t*11)) * 4 * clamp((this.gap - P_KISS_AT)/70, 0, 1);
        this.drawRunner(g, "groom", P_CX - half, feet - bob,  1);
        this.drawRunner(g, "bride", P_CX + half, feet - bob, -1);
      }
    }

    this.drawTube(g);
    if (this.result && this.result.pts === 1000) this.drawOfficiant(g);
    this.parts.draw(g);

    g.fillStyle = "rgba(255,251,244,.86)"; g.fillRect(0,0,W,50);
    textShadow(g, T("oneShot"), W/2, 25, 11, "#96203C");

    if (this.phase === "intro"){
      g.fillStyle = "rgba(255,251,244,.92)"; g.fillRect(0,0,W,H);
      textShadow(g, T("cannonName"), W/2, 140, 15, "#96203C");
      let yy = paragraph(g, T("cannonIntro"), W/2, 200, 9, "#5A4038", W-52);
      yy = paragraph(g, TK("cannonHowTap","cannonHowKey"), W/2, yy + 30, 9, "#3A6AA8", W-52);
      yy = paragraph(g, T("cannonWarn"), W/2, yy + 22, 8, "#836B5C", W-52);
      playButton(g, yy, t);   // same button as the other two games
    } else if (this.phase === "run"){
      textShadow(g, met ? T("now") : TK("tapToFire","clickToFire"), W/2, 116, met ? 13 : 10,
                 met ? "#96203C" : "#C75126");
    } else if (this.result){
      const perfect = this.result.pts === 1000;
      if (perfect){
        // a bigger, airier layout for the moment worth celebrating
        const pop = 1 + 0.06 * Math.max(0, Math.sin((6 - this.timer) * 3.2));
        textShadow(g, this.result.label, W/2, 168, 34 * pop, this.result.color);
        textShadow(g, T("perfectScore"), W/2, 232, 10, "#C75126");
        textShadow(g, "+" + fmt(this.result.pts), W/2, 286, 20, "#5A4038");
      } else {
        textShadow(g, this.result.label, W/2, 132, 17, this.result.color);
        if (this.result.when) textShadow(g, this.result.when, W/2, 166, 9, "#836B5C");
        textShadow(g, "+" + fmt(this.result.pts), W/2, 192, 11, "#5A4038");
      }
    }
  }
}

registerGame({
  id:"cannon", icon:"&#127881;",
  nameKey:"cannonName", shortKey:"cannonShort", blurbKey:"cannonBlurb",
  make:()=> new CannonGame()
});

/* ============================================================================
   15. BOOT
   ========================================================================== */
buildHub();
document.fonts && document.fonts.ready.then(fitCanvas);
</script>
