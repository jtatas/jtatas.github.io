<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Max &amp; Julie's Wedding Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'DM Sans',sans-serif}
#gameContainer{position:relative;width:100%;max-width:500px;height:100%;margin:0 auto;overflow:hidden}
canvas#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:1}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:2;overflow-y:auto}
.screen.active{display:flex;flex-direction:column}
.screen.canvas-screen{pointer-events:none!important;background:transparent!important}
.pixel-font{font-family:'Press Start 2P',monospace}
#screenCharCreator{background:linear-gradient(180deg,#1a1a2e 0%,#2d1b4e 30%,#4a2a6b 60%,#1a1a2e 100%);padding:10px;align-items:center;gap:8px}
#screenCharCreator *{pointer-events:auto}
.cc-title{color:#ffd700;font-size:11px;text-align:center;margin:5px 0;text-shadow:0 0 8px rgba(255,215,0,0.5)}
.cc-mansion-silhouette{width:100%;height:40px;opacity:0.3}
.cc-section{width:100%;max-width:400px;background:rgba(255,255,255,0.08);border-radius:12px;padding:10px;border:1px solid rgba(255,215,0,0.15)}
.cc-label{color:#e8d5f5;font-size:12px;margin-bottom:6px;font-weight:500}
.cc-input{width:100%;padding:10px;border-radius:8px;border:2px solid rgba(255,215,0,0.3);background:rgba(0,0,0,0.4);color:#fff;font-size:16px;font-family:'DM Sans',sans-serif;outline:none}
.cc-input:focus{border-color:#ffd700}
.cc-avatar-box{width:256px;height:256px;border:3px solid rgba(255,215,0,0.3);border-radius:8px;background:#1a1a2e;overflow:hidden;margin:0 auto}
.cc-avatar-box canvas{width:100%;height:100%;image-rendering:pixelated}
.cc-tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.cc-tab{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,215,0,0.3);background:rgba(0,0,0,0.3);color:#ccc;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.cc-tab.active{background:rgba(255,215,0,0.2);color:#ffd700;border-color:#ffd700}
.cc-arrows{display:flex;align-items:center;justify-content:center;gap:15px;margin:5px 0}
.cc-arrow-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,215,0,0.4);background:rgba(0,0,0,0.4);color:#ffd700;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cc-option-name{color:#fff;font-size:13px;min-width:100px;text-align:center}
.cc-color-btn{padding:6px 14px;border-radius:6px;border:1px solid rgba(255,215,0,0.3);background:rgba(0,0,0,0.3);color:#e8d5f5;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.cc-save-btn{padding:14px 30px;border-radius:10px;border:none;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin:5px 0;text-align:center}
#screenGame2{background:linear-gradient(180deg,#1a1a2e,#2d1b4e);padding:0;align-items:center}
#screenGame2 *{pointer-events:auto}
.ddr-canvas-wrap{width:100%;flex:1;position:relative;min-height:0}
.ddr-canvas-wrap canvas{width:100%;height:100%;image-rendering:pixelated}
.ddr-buttons{display:flex;justify-content:center;gap:8px;padding:8px;flex-shrink:0}
.ddr-btn{width:72px;height:72px;border-radius:12px;border:3px solid;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,0.5);-webkit-tap-highlight-color:transparent;user-select:none}
.ddr-btn.left{border-color:#ff69b4;color:#ff69b4}
.ddr-btn.down{border-color:#4a90d9;color:#4a90d9}
.ddr-btn.up{border-color:#4ad94a;color:#4ad94a}
.ddr-btn.right{border-color:#ffd700;color:#ffd700}
.ddr-btn:active{transform:scale(0.9);filter:brightness(1.5)}
.ddr-score-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;background:rgba(0,0,0,0.85);z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#fff}
.ddr-score-overlay.active{display:flex}
#screenFinale{background:#0a0a1a;padding:20px;align-items:center;justify-content:center;gap:12px;overflow-y:auto}
#screenFinale *{pointer-events:auto}
.finale-title{color:#ffd700;font-size:16px;text-align:center;text-shadow:0 0 15px rgba(255,215,0,0.6)}
.finale-score{color:#fff;font-size:13px;text-align:center}
.finale-avatar{width:128px;height:128px;border:3px solid #ffd700;border-radius:8px;image-rendering:pixelated}
.finale-lb{width:100%;max-width:380px;background:rgba(255,255,255,0.06);border-radius:10px;padding:12px;border:1px solid rgba(255,215,0,0.15)}
.finale-lb-row{display:flex;justify-content:space-between;padding:5px 8px;color:#ccc;font-size:12px;border-radius:4px}
.finale-lb-row.me{background:rgba(255,215,0,0.15);color:#ffd700}
.finale-btn{padding:12px 24px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;text-align:center;display:inline-block}
.finale-btn.gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e}
.finale-btn.outline{background:transparent;border:2px solid #ffd700;color:#ffd700}
.finale-footer{color:#888;font-size:10px;text-align:center;margin-top:8px}
.firework{position:absolute;width:6px;height:6px;border-radius:50%;animation:fw 1.2s ease-out forwards}
@keyframes fw{0%{transform:scale(1);opacity:1}100%{transform:scale(0) translateY(-80px);opacity:0}}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="screenWelcome" class="screen canvas-screen active"></div>
<div id="screenCharCreator" class="screen"></div>
<div id="screenStoryIntro" class="screen canvas-screen"></div>
<div id="screenGame1" class="screen canvas-screen"></div>
<div id="screenStormTransition" class="screen canvas-screen"></div>
<div id="screenWitchIntro" class="screen canvas-screen"></div>
<div id="screenGame2" class="screen"></div>
<div id="screenClearSkies" class="screen canvas-screen"></div>
<div id="screenGame3" class="screen canvas-screen"></div>
<div id="screenFinale" class="screen"></div>
</div>
<script>
'use strict';
/* ============================================================
   MAX & JULIE'S WEDDING ARCADE — COMPLETE GAME
   ============================================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = container.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---- State ---- */
let currentScreen = 'welcome';
let playerName = 'Guest';
let playerAvatar = { hair: 0, hairColor: 0, top: 0, bottom: 0, shoes: 0, acc: 0 };
let scores = { game1: 0, game2: 0, game3: 0 };
let animFrame = 0;
let tapCallbacks = [];

/* ---- Screen Manager ---- */
function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screenMap = {
    welcome: 'screenWelcome', charCreator: 'screenCharCreator',
    storyIntro: 'screenStoryIntro', game1: 'screenGame1',
    stormTransition: 'screenStormTransition', witchIntro: 'screenWitchIntro',
    game2: 'screenGame2', clearSkies: 'screenClearSkies',
    game3: 'screenGame3', finale: 'screenFinale'
  };
  const el = document.getElementById(screenMap[name] || 'screenWelcome');
  if (el) el.classList.add('active');
  tapCallbacks = [];
  if (name === 'charCreator') initCharCreator();
  if (name === 'game2') initGame2DOM();
  if (name === 'finale') initFinale();
}

/* ---- Input ---- */
function onTap(x, y) {
  for (let i = tapCallbacks.length - 1; i >= 0; i--) {
    if (tapCallbacks[i](x, y)) return;
  }
}
canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  onTap(e.clientX - rect.left, e.clientY - rect.top);
});

/* ============================================================
   DRAWING HELPERS
   ============================================================ */

function drawGothicWindow(x, y, w, h, color, mullionColor, darkColor) {
  const archH = h * 0.35;
  const bodyH = h - archH;
  ctx.fillStyle = color;
  ctx.fillRect(x, y + archH, w, bodyH);
  ctx.beginPath();
  ctx.moveTo(x, y + archH);
  ctx.quadraticCurveTo(x, y - archH * 0.1, x + w / 2, y);
  ctx.quadraticCurveTo(x + w, y - archH * 0.1, x + w, y + archH);
  ctx.closePath();
  ctx.fill();
  if (darkColor) {
    ctx.fillStyle = darkColor;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(x + w * 0.6, y + archH, w * 0.4, bodyH);
    ctx.globalAlpha = 1;
  }
  if (mullionColor) {
    ctx.strokeStyle = mullionColor;
    ctx.lineWidth = Math.max(1, w * 0.08);
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w / 2, y + h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y + archH + bodyH * 0.4);
    ctx.lineTo(x + w, y + archH + bodyH * 0.4);
    ctx.stroke();
  }
  ctx.strokeStyle = mullionColor || '#666';
  ctx.lineWidth = Math.max(1, w * 0.06);
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + archH);
  ctx.quadraticCurveTo(x, y - archH * 0.1, x + w / 2, y);
  ctx.quadraticCurveTo(x + w, y - archH * 0.1, x + w, y + archH);
  ctx.lineTo(x + w, y + h);
  ctx.stroke();
}

function drawCrenellations(x, y, width, toothH, toothW, color) {
  ctx.fillStyle = color;
  const count = Math.floor(width / toothW);
  for (let i = 0; i < count; i++) {
    if (i % 2 === 0) {
      ctx.fillRect(x + i * toothW, y - toothH, toothW, toothH);
    }
  }
}

function drawStoneCoursing(x, y, w, h, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.25;
  for (let row = 0; row < h; row += 7) {
    ctx.beginPath();
    ctx.moveTo(x, y + row);
    ctx.lineTo(x + w, y + row);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   drawMansion() — ARCHITECTURALLY ACCURATE LYNDHURST MANSION
   ============================================================ */
function drawMansion(baseX, baseY, s, timeOfDay) {
  const colorSets = {
    golden: {
      stoneLight: '#c9bfb0', stoneMid: '#b5a997', stoneDark: '#9c8e7c',
      roof: '#4a4f54', roofHighlight: '#6b7178',
      window: '#ffd700', windowDark: '#b8960f',
      trim: '#8b7d6b', shadow: 'rgba(0,0,0,0.15)', copper: '#c47a3a'
    },
    storm: {
      stoneLight: '#8a8292', stoneMid: '#6e677a', stoneDark: '#555060',
      roof: '#3a3d42', roofHighlight: '#4a4f54',
      window: '#4a6080', windowDark: '#354560',
      trim: '#5c5470', shadow: 'rgba(0,0,0,0.25)', copper: '#6a5a4a'
    },
    clear: {
      stoneLight: '#d4cabb', stoneMid: '#bfb5a2', stoneDark: '#a89c8a',
      roof: '#4a5054', roofHighlight: '#6b7278',
      window: '#87ceeb', windowDark: '#5ba3c9',
      trim: '#8b7d6b', shadow: 'rgba(0,0,0,0.12)', copper: '#c47a3a'
    },
    night: {
      stoneLight: '#6b6478', stoneMid: '#555060', stoneDark: '#3d3a4a',
      roof: '#2a2d32', roofHighlight: '#3a3d42',
      window: '#ffd700', windowDark: '#b8960f',
      trim: '#4a4460', shadow: 'rgba(0,0,0,0.3)', copper: '#5a4a3a'
    }
  };
  const c = colorSets[timeOfDay] || colorSets.golden;

  const totalW = 300 * s;
  const maxH = 200 * s;
  const left = baseX - totalW / 2;

  // ---- 1. LEFT WING ---- (30% width, 55% height)
  const lwW = totalW * 0.30;
  const lwH = maxH * 0.55;
  const lwX = left;
  const lwY = baseY - lwH;

  // Bay window protrusion
  ctx.fillStyle = c.stoneMid;
  ctx.fillRect(lwX - 6 * s, baseY - lwH * 0.7, 8 * s, lwH * 0.5);
  ctx.fillStyle = c.stoneDark;
  ctx.fillRect(lwX - 6 * s, baseY - lwH * 0.7, 8 * s, 2 * s);
  drawGothicWindow(lwX - 4 * s, baseY - lwH * 0.65, 5 * s, 12 * s, c.window, c.trim, c.windowDark);

  // Main body
  ctx.fillStyle = c.stoneMid;
  ctx.fillRect(lwX, lwY, lwW, lwH);
  // Shadow right edge
  ctx.fillStyle = c.shadow;
  ctx.fillRect(lwX + lwW - 4 * s, lwY, 4 * s, lwH);
  // Stone coursing
  drawStoneCoursing(lwX, lwY, lwW, lwH, c.stoneDark);

  // Gable roof
  ctx.fillStyle = c.roof;
  ctx.beginPath();
  ctx.moveTo(lwX - 3 * s, lwY);
  ctx.lineTo(lwX + lwW / 2, lwY - 30 * s);
  ctx.lineTo(lwX + lwW + 3 * s, lwY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = c.roofHighlight;
  ctx.beginPath();
  ctx.moveTo(lwX - 3 * s, lwY);
  ctx.lineTo(lwX + lwW / 2, lwY - 30 * s);
  ctx.lineTo(lwX + lwW * 0.3, lwY);
  ctx.closePath();
  ctx.fill();

  // Left wing windows - upper row
  const lwWinW = 8 * s;
  const lwWinH = 14 * s;
  for (let i = 0; i < 3; i++) {
    drawGothicWindow(lwX + 8 * s + i * (lwWinW + 8 * s), lwY + 10 * s, lwWinW, lwWinH, c.window, c.trim, c.windowDark);
  }
  // Left wing windows - lower row
  for (let i = 0; i < 3; i++) {
    drawGothicWindow(lwX + 8 * s + i * (lwWinW + 8 * s), lwY + lwH * 0.5 + 4 * s, lwWinW, lwWinH * 0.9, c.window, c.trim, c.windowDark);
  }

  // ---- 2. MAIN SQUARE TOWER ---- (15% width, 100% height)
  const twW = totalW * 0.15;
  const twH = maxH;
  const twX = left + totalW * 0.28;
  const twY = baseY - twH;

  // Tower body
  ctx.fillStyle = c.stoneLight;
  ctx.fillRect(twX, twY, twW, twH);
  // Mid-tone band
  ctx.fillStyle = c.stoneMid;
  ctx.fillRect(twX, twY + twH * 0.3, twW, twH * 0.4);
  // Shadow right
  ctx.fillStyle = c.shadow;
  ctx.fillRect(twX + twW - 3 * s, twY, 3 * s, twH);
  // Stone coursing
  drawStoneCoursing(twX, twY, twW, twH, c.stoneDark);

  // Horizontal band / string course
  ctx.fillStyle = c.stoneDark;
  ctx.fillRect(twX - 2 * s, twY + twH * 0.3, twW + 4 * s, 2 * s);
  ctx.fillRect(twX - 2 * s, twY + twH * 0.55, twW + 4 * s, 2 * s);

  // CRENELLATIONS - the signature flat top
  const toothW = Math.max(4, twW / 6);
  const toothH = 6 * s;
  // Parapet base
  ctx.fillStyle = c.stoneLight;
  ctx.fillRect(twX - 2 * s, twY - 3 * s, twW + 4 * s, 5 * s);
  drawCrenellations(twX - 2 * s, twY - 3 * s, twW + 4 * s, toothH, toothW, c.stoneLight);
  // Coursing on teeth
  ctx.fillStyle = c.stoneDark;
  ctx.globalAlpha = 0.3;
  const cCount = Math.floor((twW + 4 * s) / toothW);
  for (let i = 0; i < cCount; i++) {
    if (i % 2 === 0) {
      ctx.fillRect(twX - 2 * s + i * toothW, twY - 3 * s - toothH + toothH * 0.5, toothW, 1);
    }
  }
  ctx.globalAlpha = 1;

  // Large Gothic tracery window on tower
  const tWinW = twW * 0.6;
  const tWinH = twH * 0.28;
  const tWinX = twX + (twW - tWinW) / 2;
  const tWinY = twY + twH * 0.08;
  drawGothicWindow(tWinX, tWinY, tWinW, tWinH, c.window, c.trim, c.windowDark);
  // Extra tracery mullion (vertical subdivisions)
  ctx.strokeStyle = c.trim;
  ctx.lineWidth = Math.max(1, s);
  ctx.beginPath();
  ctx.moveTo(tWinX + tWinW * 0.3, tWinY + tWinH * 0.35);
  ctx.lineTo(tWinX + tWinW * 0.3, tWinY + tWinH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tWinX + tWinW * 0.7, tWinY + tWinH * 0.35);
  ctx.lineTo(tWinX + tWinW * 0.7, tWinY + tWinH);
  ctx.stroke();

  // Lower tower window
  drawGothicWindow(tWinX + 2 * s, twY + twH * 0.45, tWinW - 4 * s, tWinH * 0.6, c.window, c.trim, c.windowDark);

  // ---- 3. CENTER BODY ---- (25% width, 65% height)
  const cbW = totalW * 0.25;
  const cbH = maxH * 0.65;
  const cbX = left + totalW * 0.38;
  const cbY = baseY - cbH;

  ctx.fillStyle = c.stoneMid;
  ctx.fillRect(cbX, cbY, cbW, cbH);
  ctx.fillStyle = c.shadow;
  ctx.fillRect(cbX + cbW - 4 * s, cbY, 4 * s, cbH);
  drawStoneCoursing(cbX, cbY, cbW, cbH, c.stoneDark);

  // Pointed gable roof
  ctx.fillStyle = c.roof;
  ctx.beginPath();
  ctx.moveTo(cbX - 3 * s, cbY);
  ctx.lineTo(cbX + cbW / 2, cbY - 25 * s);
  ctx.lineTo(cbX + cbW + 3 * s, cbY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = c.copper;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(cbX + cbW / 2, cbY - 25 * s);
  ctx.lineTo(cbX + cbW / 2 + 2 * s, cbY - 24 * s);
  ctx.lineTo(cbX + cbW / 2, cbY - 15 * s);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Center upper windows
  const cbWinW = 9 * s;
  const cbWinH = 15 * s;
  for (let i = 0; i < 2; i++) {
    drawGothicWindow(cbX + 10 * s + i * (cbWinW + 12 * s), cbY + 8 * s, cbWinW, cbWinH, c.window, c.trim, c.windowDark);
  }

  // Grand Gothic arched doorway
  const doorW = 16 * s;
  const doorH = 26 * s;
  const doorX = cbX + (cbW - doorW) / 2;
  const doorY = baseY - doorH;
  ctx.fillStyle = c.stoneDark;
  ctx.fillRect(doorX, doorY + doorH * 0.35, doorW, doorH * 0.65);
  ctx.beginPath();
  ctx.moveTo(doorX, doorY + doorH * 0.35);
  ctx.quadraticCurveTo(doorX, doorY - doorH * 0.05, doorX + doorW / 2, doorY);
  ctx.quadraticCurveTo(doorX + doorW, doorY - doorH * 0.05, doorX + doorW, doorY + doorH * 0.35);
  ctx.closePath();
  ctx.fill();
  // Door darker interior
  const innerD = 2 * s;
  ctx.fillStyle = '#1a1510';
  ctx.fillRect(doorX + innerD, doorY + doorH * 0.4, doorW - innerD * 2, doorH * 0.6);
  ctx.beginPath();
  ctx.moveTo(doorX + innerD, doorY + doorH * 0.4);
  ctx.quadraticCurveTo(doorX + innerD, doorY + doorH * 0.05, doorX + doorW / 2, doorY + innerD);
  ctx.quadraticCurveTo(doorX + doorW - innerD, doorY + doorH * 0.05, doorX + doorW - innerD, doorY + doorH * 0.4);
  ctx.closePath();
  ctx.fill();
  // Door frame trim
  ctx.strokeStyle = c.trim;
  ctx.lineWidth = Math.max(1.5, 1.5 * s);
  ctx.beginPath();
  ctx.moveTo(doorX, baseY);
  ctx.lineTo(doorX, doorY + doorH * 0.35);
  ctx.quadraticCurveTo(doorX, doorY - doorH * 0.05, doorX + doorW / 2, doorY);
  ctx.quadraticCurveTo(doorX + doorW, doorY - doorH * 0.05, doorX + doorW, doorY + doorH * 0.35);
  ctx.lineTo(doorX + doorW, baseY);
  ctx.stroke();

  // ---- 4. RIGHT WING ---- (30% width, 50% height)
  const rwW = totalW * 0.30;
  const rwH = maxH * 0.50;
  const rwX = left + totalW * 0.60;
  const rwY = baseY - rwH;

  ctx.fillStyle = c.stoneMid;
  ctx.fillRect(rwX, rwY, rwW, rwH);
  ctx.fillStyle = c.shadow;
  ctx.fillRect(rwX + rwW - 4 * s, rwY, 4 * s, rwH);
  drawStoneCoursing(rwX, rwY, rwW, rwH, c.stoneDark);

  // Right wing gable
  ctx.fillStyle = c.roof;
  ctx.beginPath();
  ctx.moveTo(rwX - 3 * s, rwY);
  ctx.lineTo(rwX + rwW / 2, rwY - 22 * s);
  ctx.lineTo(rwX + rwW + 3 * s, rwY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = c.roofHighlight;
  ctx.beginPath();
  ctx.moveTo(rwX - 3 * s, rwY);
  ctx.lineTo(rwX + rwW / 2, rwY - 22 * s);
  ctx.lineTo(rwX + rwW * 0.35, rwY);
  ctx.closePath();
  ctx.fill();

  // Right wing windows upper
  for (let i = 0; i < 3; i++) {
    drawGothicWindow(rwX + 8 * s + i * (8 * s + 8 * s), rwY + 8 * s, 8 * s, 13 * s, c.window, c.trim, c.windowDark);
  }
  // Right wing windows lower
  for (let i = 0; i < 3; i++) {
    drawGothicWindow(rwX + 8 * s + i * (8 * s + 8 * s), rwY + rwH * 0.48 + 4 * s, 8 * s, 12 * s, c.window, c.trim, c.windowDark);
  }

  // Covered porch / veranda at ground level
  ctx.fillStyle = c.stoneDark;
  ctx.fillRect(rwX + 4 * s, baseY - 18 * s, rwW - 8 * s, 2 * s);
  // Porch columns
  for (let i = 0; i < 4; i++) {
    const px = rwX + 8 * s + i * ((rwW - 16 * s) / 3);
    ctx.fillStyle = c.stoneLight;
    ctx.fillRect(px, baseY - 18 * s, 2 * s, 18 * s);
  }

  // ---- Foundation line ----
  ctx.fillStyle = c.stoneDark;
  ctx.fillRect(left - 6 * s, baseY - 2 * s, totalW + 12 * s, 4 * s);
}

/* ============================================================
   LANDSCAPE HELPERS
   ============================================================ */

function drawSky(timeOfDay) {
  let grad;
  if (timeOfDay === 'golden') {
    grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(0.25, '#3d2d6b');
    grad.addColorStop(0.45, '#8b4a78');
    grad.addColorStop(0.6, '#e88ca5');
    grad.addColorStop(0.75, '#f0a0b8');
    grad.addColorStop(1, '#ffd4a8');
  } else if (timeOfDay === 'storm') {
    grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a15');
    grad.addColorStop(0.3, '#1a1a30');
    grad.addColorStop(0.6, '#2a2a45');
    grad.addColorStop(1, '#3a3a55');
  } else if (timeOfDay === 'clear') {
    grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a6dd4');
    grad.addColorStop(0.3, '#4a9de8');
    grad.addColorStop(0.5, '#7dc4f5');
    grad.addColorStop(0.7, '#aadcfa');
    grad.addColorStop(1, '#e0f0ff');
  } else {
    grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.4, '#151530');
    grad.addColorStop(1, '#1a1a3a');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds(y, timeOfDay, offset) {
  const cloudColor = timeOfDay === 'golden' ? ['#e88ca5', '#f0a0b8', '#c8a8d8'] :
    timeOfDay === 'storm' ? ['#2a2a40', '#353550', '#404060'] :
    timeOfDay === 'clear' ? ['#ffffff', '#e8f4ff', '#d0e8ff'] :
    ['#1a1a30', '#252540', '#2a2a45'];
  const t = offset * 0.0003;
  for (let i = 0; i < 5; i++) {
    const cx = (W * 0.15 + i * W * 0.2 + Math.sin(t + i * 1.5) * 30) % (W + 100) - 50;
    const cy = y + Math.sin(t * 0.7 + i) * 10 + i * 8;
    const r = 25 + i * 8;
    ctx.fillStyle = cloudColor[i % cloudColor.length];
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 1.8, r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.8, cy + 5, r * 1.2, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + r, cy + 3, r * 1.4, r * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawCherryTree(x, y, size, mirrored) {
  const dir = mirrored ? -1 : 1;
  // Trunk
  ctx.fillStyle = '#5a3a28';
  ctx.fillRect(x - size * 0.05, y - size * 0.6, size * 0.1, size * 0.6);
  // Branches
  ctx.strokeStyle = '#5a3a28';
  ctx.lineWidth = size * 0.04;
  ctx.beginPath();
  ctx.moveTo(x, y - size * 0.5);
  ctx.lineTo(x + dir * size * 0.3, y - size * 0.8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - size * 0.45);
  ctx.lineTo(x - dir * size * 0.2, y - size * 0.7);
  ctx.stroke();
  // Pink blossom canopy
  const blossomColors = ['#ffb7c5', '#ff91a4', '#ffc0cb', '#ff69b4', '#ffcce0'];
  for (let i = 0; i < 20; i++) {
    const bx = x + dir * size * 0.1 + (Math.sin(i * 2.3) * size * 0.35);
    const by = y - size * 0.6 - Math.abs(Math.cos(i * 1.7)) * size * 0.4;
    const br = size * (0.06 + Math.sin(i) * 0.03);
    ctx.fillStyle = blossomColors[i % blossomColors.length];
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawEvergreenTree(x, y, h) {
  ctx.fillStyle = '#3a2820';
  ctx.fillRect(x - h * 0.04, y - h * 0.15, h * 0.08, h * 0.15);
  const layers = 4;
  const greens = ['#1a4d2e', '#2d6b3f', '#1a5530', '#245a35'];
  for (let i = 0; i < layers; i++) {
    const ly = y - h * 0.15 - i * h * 0.22;
    const lw = h * (0.25 - i * 0.04);
    ctx.fillStyle = greens[i % greens.length];
    ctx.beginPath();
    ctx.moveTo(x - lw, ly);
    ctx.lineTo(x, ly - h * 0.25);
    ctx.lineTo(x + lw, ly);
    ctx.closePath();
    ctx.fill();
  }
}

function drawLawn(groundY) {
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, '#4a8f5c');
  grad.addColorStop(0.3, '#3d7a4e');
  grad.addColorStop(1, '#2d6b3f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, W, H - groundY);
  // Path
  ctx.fillStyle = '#b0a090';
  ctx.beginPath();
  ctx.moveTo(W * 0.42, groundY);
  ctx.lineTo(W * 0.38, H);
  ctx.lineTo(W * 0.62, H);
  ctx.lineTo(W * 0.58, groundY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#a0907a';
  ctx.globalAlpha = 0.3;
  for (let i = 0; i < 15; i++) {
    ctx.fillRect(W * 0.39 + Math.random() * W * 0.22, groundY + Math.random() * (H - groundY), 3, 2);
  }
  ctx.globalAlpha = 1;
}

function drawBirds(t) {
  ctx.strokeStyle = '#2a2030';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const bx = (W * 0.2 + i * W * 0.2 + t * 0.02) % (W + 40) - 20;
    const by = H * 0.08 + i * 15 + Math.sin(t * 0.005 + i) * 8;
    const wing = Math.sin(t * 0.015 + i * 2) * 4;
    ctx.beginPath();
    ctx.moveTo(bx - 5, by + wing);
    ctx.quadraticCurveTo(bx - 2, by - 3, bx, by);
    ctx.quadraticCurveTo(bx + 2, by - 3, bx + 5, by + wing);
    ctx.stroke();
  }
}

let petals = [];
function initPetals() {
  petals = [];
  for (let i = 0; i < 25; i++) {
    petals.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: -0.3 + Math.random() * 0.6,
      vy: 0.3 + Math.random() * 0.5,
      r: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      color: ['#ffb7c5', '#ff91a4', '#ffc0cb', '#ffcce0'][Math.floor(Math.random() * 4)]
    });
  }
}
initPetals();

function updatePetals() {
  for (const p of petals) {
    p.x += p.vx + Math.sin(animFrame * 0.01 + p.rot) * 0.3;
    p.y += p.vy;
    p.rot += 0.02;
    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.8;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawRainbow(x, y, r) {
  const colors = ['#ff0000', '#ff7700', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#8b00ff'];
  for (let i = 0; i < colors.length; i++) {
    ctx.strokeStyle = colors[i];
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(x, y, r - i * 4, Math.PI, 0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   PIXEL TEXT
   ============================================================ */
function drawPixelText(text, x, y, size, color, align, shadow) {
  ctx.font = size + 'px "Press Start 2P"';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.fillStyle = typeof shadow === 'string' ? shadow : 'rgba(0,0,0,0.5)';
    ctx.fillText(text, x + 2, y + 2);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawButton(text, x, y, w, h, active) {
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, active ? '#ffe066' : '#ffd700');
  grad.addColorStop(1, active ? '#ffcc00' : '#e6b800');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = '#b8960f';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#1a1a2e';
  ctx.font = '11px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
}

/* ============================================================
   AVATAR DRAWING
   ============================================================ */
const HAIR_COLORS = ['#5a3825', '#d4a855', '#1a1a1a', '#aa3322'];
const HAIR_NAMES = ['Brown', 'Blonde', 'Black', 'Red'];
const HAIR_STYLES = ['Short', 'Long', 'Curly', 'Pixie', 'Mohawk', 'Bun'];
const TOP_NAMES = ['Suit Jacket', 'Bridesmaid', 'Hawaiian', 'Tux Vest', 'Floral', 'Hoodie', 'Crop Top'];
const BOTTOM_NAMES = ['Dress Pants', 'Skirt', 'Shorts', 'Gown', 'Jeans', 'Mini Skirt'];
const SHOE_NAMES = ['Dress Shoes', 'Heels', 'Sneakers', 'Boots', 'Sandals'];
const ACC_NAMES = ['None', 'Bow Tie', 'Necklace', 'Sunglasses', 'Flower Crown', 'Top Hat', 'Tiara'];

function drawAvatar(ctx2, x, y, scale, avatar) {
  const s = scale;
  const hc = HAIR_COLORS[avatar.hairColor % HAIR_COLORS.length];
  // Skin
  ctx2.fillStyle = '#f0c8a0';
  // Body
  ctx2.fillRect(x + 24 * s, y + 28 * s, 16 * s, 14 * s);
  // Head
  ctx2.fillRect(x + 22 * s, y + 10 * s, 20 * s, 18 * s);
  // Eyes
  ctx2.fillStyle = '#1a1a2e';
  ctx2.fillRect(x + 26 * s, y + 18 * s, 3 * s, 3 * s);
  ctx2.fillRect(x + 35 * s, y + 18 * s, 3 * s, 3 * s);
  // Mouth
  ctx2.fillStyle = '#cc6666';
  ctx2.fillRect(x + 29 * s, y + 23 * s, 6 * s, 2 * s);

  // Hair
  ctx2.fillStyle = hc;
  const hs = avatar.hair % HAIR_STYLES.length;
  if (hs === 0) { ctx2.fillRect(x + 20 * s, y + 8 * s, 24 * s, 8 * s); }
  else if (hs === 1) { ctx2.fillRect(x + 20 * s, y + 8 * s, 24 * s, 8 * s); ctx2.fillRect(x + 20 * s, y + 16 * s, 5 * s, 14 * s); ctx2.fillRect(x + 39 * s, y + 16 * s, 5 * s, 14 * s); }
  else if (hs === 2) { ctx2.fillRect(x + 18 * s, y + 6 * s, 28 * s, 12 * s); ctx2.fillRect(x + 18 * s, y + 12 * s, 6 * s, 10 * s); ctx2.fillRect(x + 40 * s, y + 12 * s, 6 * s, 10 * s); }
  else if (hs === 3) { ctx2.fillRect(x + 22 * s, y + 6 * s, 20 * s, 6 * s); ctx2.fillRect(x + 38 * s, y + 8 * s, 6 * s, 8 * s); }
  else if (hs === 4) { ctx2.fillRect(x + 28 * s, y + 2 * s, 8 * s, 10 * s); ctx2.fillRect(x + 22 * s, y + 8 * s, 20 * s, 4 * s); }
  else { ctx2.fillRect(x + 22 * s, y + 6 * s, 20 * s, 6 * s); ctx2.beginPath(); ctx2.arc(x + 32 * s, y + 6 * s, 6 * s, 0, Math.PI * 2); ctx2.fill(); }

  // Top
  const topColors = ['#2a2a4a', '#e88ca5', '#ff9944', '#1a1a2e', '#d4a8d4', '#666', '#ff6b8a'];
  ctx2.fillStyle = topColors[avatar.top % topColors.length];
  ctx2.fillRect(x + 20 * s, y + 28 * s, 24 * s, 14 * s);
  // Arms
  ctx2.fillRect(x + 14 * s, y + 28 * s, 6 * s, 12 * s);
  ctx2.fillRect(x + 44 * s, y + 28 * s, 6 * s, 12 * s);

  // Bottom
  const botColors = ['#2a2a3a', '#c44a7a', '#8b7355', '#e88ca5', '#4a6a9a', '#c44a7a'];
  ctx2.fillStyle = botColors[avatar.bottom % botColors.length];
  ctx2.fillRect(x + 22 * s, y + 42 * s, 20 * s, 12 * s);

  // Shoes
  const shoeColors = ['#1a1a1a', '#cc4466', '#ffffff', '#5a3a20', '#c4a060'];
  ctx2.fillStyle = shoeColors[avatar.shoes % shoeColors.length];
  ctx2.fillRect(x + 20 * s, y + 54 * s, 10 * s, 4 * s);
  ctx2.fillRect(x + 34 * s, y + 54 * s, 10 * s, 4 * s);

  // Accessory
  const acc = avatar.acc % ACC_NAMES.length;
  if (acc === 1) { ctx2.fillStyle = '#ffd700'; ctx2.fillRect(x + 29 * s, y + 27 * s, 6 * s, 3 * s); ctx2.fillRect(x + 31 * s, y + 26 * s, 2 * s, 1 * s); }
  else if (acc === 2) { ctx2.fillStyle = '#ffd700'; ctx2.fillRect(x + 26 * s, y + 28 * s, 12 * s, 2 * s); ctx2.fillRect(x + 30 * s, y + 30 * s, 4 * s, 3 * s); }
  else if (acc === 3) { ctx2.fillStyle = '#1a1a1a'; ctx2.fillRect(x + 24 * s, y + 17 * s, 16 * s, 5 * s); ctx2.fillStyle = '#4a4aaa'; ctx2.globalAlpha = 0.5; ctx2.fillRect(x + 25 * s, y + 18 * s, 6 * s, 3 * s); ctx2.fillRect(x + 33 * s, y + 18 * s, 6 * s, 3 * s); ctx2.globalAlpha = 1; }
  else if (acc === 4) { ctx2.fillStyle = '#ff69b4'; for (let fi = 0; fi < 5; fi++) { ctx2.beginPath(); ctx2.arc(x + (24 + fi * 4) * s, y + 9 * s, 2.5 * s, 0, Math.PI * 2); ctx2.fill(); } ctx2.fillStyle = '#4a8f5c'; ctx2.fillRect(x + 22 * s, y + 10 * s, 20 * s, 2 * s); }
  else if (acc === 5) { ctx2.fillStyle = '#1a1a2e'; ctx2.fillRect(x + 24 * s, y + 0, 16 * s, 8 * s); ctx2.fillRect(x + 20 * s, y + 8 * s, 24 * s, 3 * s); }
  else if (acc === 6) { ctx2.fillStyle = '#ffd700'; ctx2.fillRect(x + 24 * s, y + 7 * s, 16 * s, 3 * s); for (let ti = 0; ti < 3; ti++) { ctx2.fillRect(x + (26 + ti * 5) * s, y + 4 * s, 3 * s, 3 * s); } }
}

/* ============================================================
   SCREEN: WELCOME
   ============================================================ */
function drawWelcome() {
  drawSky('golden');
  drawClouds(H * 0.12, 'golden', animFrame);
  drawBirds(animFrame);

  const groundY = H * 0.72;
  const mansionY = groundY;
  const mansionScale = W / 340;

  // Trees behind mansion
  drawEvergreenTree(W * 0.05, groundY, H * 0.3);
  drawEvergreenTree(W * 0.12, groundY, H * 0.35);
  drawEvergreenTree(W * 0.88, groundY, H * 0.32);
  drawEvergreenTree(W * 0.95, groundY, H * 0.28);

  drawCherryTree(W * 0.18, groundY, H * 0.25, false);
  drawCherryTree(W * 0.82, groundY, H * 0.22, true);

  // Mansion
  drawMansion(W / 2, mansionY, mansionScale, 'golden');

  // Lawn
  drawLawn(groundY);

  // More cherry trees in foreground
  drawCherryTree(W * 0.08, H * 0.85, H * 0.15, false);
  drawCherryTree(W * 0.92, H * 0.88, H * 0.13, true);

  // Petals
  updatePetals();

  // Title
  const pulse = Math.sin(animFrame * 0.04) * 3;
  ctx.save();
  // Gold glow
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 15;
  drawPixelText("Max & Julie's", W / 2, H * 0.15 + pulse, Math.min(18, W * 0.04), '#ffd700', 'center', '#8b6914');
  drawPixelText("Wedding Arcade", W / 2, H * 0.15 + 28 + pulse, Math.min(14, W * 0.032), '#fff', 'center', '#4a3060');
  ctx.shadowBlur = 0;
  drawPixelText("at Lyndhurst Mansion", W / 2, H * 0.15 + 52 + pulse, Math.min(8, W * 0.018), '#e8d5f5', 'center', false);
  ctx.restore();

  // Tap to start
  const tapAlpha = 0.5 + Math.sin(animFrame * 0.06) * 0.5;
  ctx.globalAlpha = tapAlpha;
  drawPixelText("Tap to Start", W / 2, H * 0.92, Math.min(10, W * 0.024), '#ffd700', 'center', '#000');
  ctx.globalAlpha = 1;

  // Tap handler
  tapCallbacks = [() => { showScreen('charCreator'); return true; }];
}

/* ============================================================
   SCREEN: CHARACTER CREATOR (DOM)
   ============================================================ */
function initCharCreator() {
  const el = document.getElementById('screenCharCreator');
  let tab = 'Hair';
  const saved = JSON.parse(localStorage.getItem('weddingAvatar') || 'null');
  if (saved) {
    playerAvatar = saved.avatar || playerAvatar;
    playerName = saved.name || playerName;
  }
  function render() {
    const categories = ['Hair', 'Top', 'Bottom', 'Shoes', 'Accessories'];
    const optionNames = {
      Hair: HAIR_STYLES,
      Top: TOP_NAMES,
      Bottom: BOTTOM_NAMES,
      Shoes: SHOE_NAMES,
      Accessories: ACC_NAMES
    };
    const keys = { Hair: 'hair', Top: 'top', Bottom: 'bottom', Shoes: 'shoes', Accessories: 'acc' };
    const curKey = keys[tab];
    const curIdx = playerAvatar[curKey];
    const curOptions = optionNames[tab];
    const curName = curOptions[curIdx % curOptions.length];

    el.innerHTML = `
      <div class="cc-title pixel-font">CREATE YOUR GUEST</div>
      <div class="cc-section">
        <div class="cc-label">Your Name</div>
        <input class="cc-input" id="ccName" type="text" value="${playerName.replace(/"/g, '&quot;')}" maxlength="16" placeholder="Enter name...">
      </div>
      <div class="cc-section">
        <div class="cc-label">Preview</div>
        <div class="cc-avatar-box"><canvas id="ccAvatarCanvas" width="64" height="64"></canvas></div>
      </div>
      <div class="cc-section">
        <div class="cc-tabs">
          ${categories.map(c => `<div class="cc-tab ${c === tab ? 'active' : ''}" data-tab="${c}">${c}</div>`).join('')}
        </div>
        <div class="cc-arrows">
          <button class="cc-arrow-btn" id="ccPrev">◀</button>
          <span class="cc-option-name">${curName}</span>
          <button class="cc-arrow-btn" id="ccNext">▶</button>
        </div>
        ${tab === 'Hair' ? `<div style="text-align:center;margin-top:4px"><button class="cc-color-btn" id="ccColorBtn">Color: ${HAIR_NAMES[playerAvatar.hairColor % HAIR_COLORS.length]}</button></div>` : ''}
      </div>
      <button class="cc-save-btn" id="ccSave">Save & Continue ▶</button>
    `;

    // Draw avatar
    const avCanvas = document.getElementById('ccAvatarCanvas');
    if (avCanvas) {
      const actx = avCanvas.getContext('2d');
      actx.clearRect(0, 0, 64, 64);
      drawAvatar(actx, 0, 0, 1, playerAvatar);
    }

    // Events
    document.getElementById('ccName').addEventListener('input', e => { playerName = e.target.value || 'Guest'; });
    document.querySelectorAll('.cc-tab').forEach(t => {
      t.addEventListener('click', () => { tab = t.dataset.tab; render(); });
    });
    document.getElementById('ccPrev').addEventListener('click', () => {
      playerAvatar[curKey] = (playerAvatar[curKey] - 1 + curOptions.length) % curOptions.length;
      render();
    });
    document.getElementById('ccNext').addEventListener('click', () => {
      playerAvatar[curKey] = (playerAvatar[curKey] + 1) % curOptions.length;
      render();
    });
    const colorBtn = document.getElementById('ccColorBtn');
    if (colorBtn) {
      colorBtn.addEventListener('click', () => {
        playerAvatar.hairColor = (playerAvatar.hairColor + 1) % HAIR_COLORS.length;
        render();
      });
    }
    document.getElementById('ccSave').addEventListener('click', () => {
      playerName = document.getElementById('ccName').value || 'Guest';
      localStorage.setItem('weddingAvatar', JSON.stringify({ name: playerName, avatar: playerAvatar }));
      showScreen('storyIntro');
    });
  }
  render();
}

  ctx.fillRect(W * 0.5 - 4, charY - 28, 8, 8);
  ctx.fillStyle = '#3a2a15';
  ctx.fillRect(W * 0.5 - 5, charY - 30, 10, 4);

  // Dog (golden retriever)
  ctx.fillStyle = '#c8a050';
  ctx.fillRect(W * 0.68 - 8, charY - 12, 16, 10);
  ctx.fillRect(W * 0.68 - 11, charY - 16, 8, 8);
  // Tail
  ctx.fillRect(W * 0.68 + 8, charY - 16, 4, 6);
  // Bowtie
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(W * 0.68 - 7, charY - 10, 4, 3);
  // Legs
  ctx.fillStyle = '#b08840';
  ctx.fillRect(W * 0.68 - 6, charY - 2, 3, 4);
  ctx.fillRect(W * 0.68 + 3, charY - 2, 3, 4);

  // Dialog box
  storyTimer++;
  storyCharIdx = Math.min(storyText.length, Math.floor(storyTimer / 2));
  const boxY = H * 0.7;
  const boxH = H * 0.18;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.beginPath();
  ctx.roundRect(W * 0.05, boxY, W * 0.9, boxH, 10);
  ctx.fill();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(10, W * 0.022)}px "Press Start 2P"`;
  ctx.textAlign = 'left';
  const visibleText = storyText.substring(0, storyCharIdx);
  wrapText(visibleText, W * 0.1, boxY + 18, W * 0.8, 16);

  // Button
  if (storyCharIdx >= storyText.length) {
    const btnW = 150;
    const btnH = 36;
    const btnX = W / 2 - btnW / 2;
    const btnY = H * 0.91;
    drawButton('Help Them!', btnX, btnY, btnW, btnH, false);
    tapCallbacks = [(x, y) => {
      if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        showScreen('game1');
        initGame1();
        return true;
      }
      return false;
    }];
  }
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  let ly = y;
  for (const word of words) {
    const test = line + word + ' ';
    const m = ctx.measureText(test);
    if (m.width > maxW && line) {
      ctx.fillText(line.trim(), x, ly);
      line = word + ' ';
      ly += lineH;
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, ly);
}

/* ============================================================
   GAME 1: QUEST TO THE ALTAR (Runner)
   ============================================================ */
let g1 = {};
function initGame1() {
  g1 = {
    dist: 0, maxDist: 1500, score: 0,
    py: 0, vy: 0, jumping: false, grounded: true,
    speed: 3, elapsed: 0,
    collectibles: [], obstacles: [],
    sparkles: [], done: false, doneTimer: 0,
    scrollX: 0
  };
  // Pre-generate items
  for (let d = 100; d < 1500; d += 40 + Math.random() * 60) {
    if (Math.random() < 0.7) {
      g1.collectibles.push({ d, type: Math.random() < 0.8 ? 'petal' : 'ring', y: Math.random() * 60, collected: false });
    }
    if (Math.random() < 0.4) {
      g1.obstacles.push({ d: d + 20, type: ['cork', 'chair', 'program'][Math.floor(Math.random() * 3)], y: 0, hit: false });
    }
  }
  tapCallbacks = [(x, y) => {
    if (g1.done) {
      if (g1.doneTimer > 60) {
        showScreen('stormTransition');
        stormTimer = 0;
        return true;
      }
      return false;
    }
    if (g1.grounded) {
      g1.vy = -8 - Math.min(3, (y / H) * 3);
      g1.jumping = true;
      g1.grounded = false;
    }
    return true;
  }];
}

function drawGame1() {
  const groundY = H * 0.75;
  const playerX = W * 0.2;

  if (!g1.done) {
    g1.elapsed++;
    g1.dist += g1.speed;
    g1.scrollX += g1.speed * 2;

    // Physics
    g1.vy += 0.45;
    g1.py += g1.vy;
    if (g1.py >= 0) { g1.py = 0; g1.vy = 0; g1.grounded = true; g1.jumping = false; }
  }

  const progress = g1.dist / g1.maxDist;
  const stormProgress = Math.max(0, (progress - 0.8) / 0.2);

  // Background — interior
  // Far: stone walls
  const wallColor = `rgb(${Math.floor(160 - stormProgress * 40)},${Math.floor(150 - stormProgress * 40)},${Math.floor(140 - stormProgress * 40)})`;
  ctx.fillStyle = wallColor;
  ctx.fillRect(0, 0, W, H);

  // Gothic windows in far background
  for (let i = 0; i < 4; i++) {
    const wx = (i * W * 0.3 - g1.scrollX * 0.2) % (W * 1.5) - W * 0.15;
    const skyColor = stormProgress > 0 ? `rgba(60,60,80,${0.8 + stormProgress * 0.2})` : '#87ceeb';
    drawGothicWindow(wx, H * 0.1, W * 0.08, H * 0.25, skyColor, '#8b7d6b', null);
  }

  // Mid: columns
  for (let i = 0; i < 6; i++) {
    const cx = (i * W * 0.25 - g1.scrollX * 0.5) % (W * 1.8) - W * 0.1;
    ctx.fillStyle = '#a09080';
    ctx.fillRect(cx, H * 0.2, 12, groundY - H * 0.2);
    // Column cap
    ctx.fillStyle = '#b0a090';
    ctx.fillRect(cx - 4, H * 0.2, 20, 8);
    // Gothic arch between columns
    if (i < 5) {
      ctx.strokeStyle = '#a09080';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + 12, H * 0.2 + 8);
      ctx.quadraticCurveTo(cx + W * 0.125, H * 0.12, cx + W * 0.25, H * 0.2 + 8);
      ctx.stroke();
    }
  }

  // Candelabras
  for (let i = 0; i < 3; i++) {
    const cx = (W * 0.2 + i * W * 0.35 - g1.scrollX * 0.4) % (W * 1.5) - W * 0.1;
    ctx.fillStyle = '#c4a030';
    ctx.fillRect(cx, H * 0.35, 3, 20);
    ctx.fillRect(cx - 4, H * 0.35, 11, 3);
    // Flames
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(cx - 3, H * 0.33, 3, 3);
    ctx.fillRect(cx + 1, H * 0.33, 3, 3);
    ctx.fillRect(cx + 5, H * 0.33, 3, 3);
  }

  // Near: pews
  for (let i = 0; i < 8; i++) {
    const px = (i * W * 0.2 - g1.scrollX) % (W * 2) - W * 0.15;
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(px, groundY - 30, 8, 30);
    ctx.fillRect(px - 5, groundY - 35, 18, 8);
    ctx.fillRect(px + W * 0.08, groundY - 30, 8, 30);
    ctx.fillRect(px + W * 0.08 - 5, groundY - 35, 18, 8);
  }

  // Red carpet
  ctx.fillStyle = '#8b2020';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#a83030';
  ctx.fillRect(0, groundY, W, 4);

  // Collectibles & obstacles
  for (const c of g1.collectibles) {
    if (c.collected) continue;
    const cx = playerX + (c.d - g1.dist) * 2;
    if (cx < -20 || cx > W + 20) continue;
    const cy = groundY - 20 - c.y;
    if (c.type === 'petal') {
      ctx.fillStyle = '#ff69b4';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 6, 4, animFrame * 0.05, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Collision
    if (!g1.done && Math.abs(cx - playerX) < 15 && Math.abs(cy - (groundY - 16 + g1.py)) < 20) {
      c.collected = true;
      g1.score += c.type === 'petal' ? 10 : 50;
      if (c.type === 'ring') g1.speed = Math.min(6, g1.speed + 0.5);
      for (let si = 0; si < 5; si++) {
        g1.sparkles.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, life: 30, color: c.type === 'petal' ? '#ff69b4' : '#ffd700' });
      }
    }
  }

  for (const o of g1.obstacles) {
    if (o.hit) continue;
    const ox = playerX + (o.d - g1.dist) * 2;
    if (ox < -20 || ox > W + 20) continue;
    const oy = groundY;
    if (o.type === 'chair') {
      ctx.fillStyle = '#8b6b4a';
      ctx.fillRect(ox - 8, oy - 22, 16, 22);
      ctx.fillRect(ox - 10, oy - 28, 20, 6);
    } else if (o.type === 'cork') {
      const corkY = oy - 30 - Math.abs(Math.sin((animFrame + o.d) * 0.08)) * 20;
      ctx.fillStyle = '#c4a060';
      ctx.beginPath();
      ctx.ellipse(ox, corkY, 5, 7, 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const progY = oy - 35 + Math.sin(animFrame * 0.03 + o.d) * 15;
      ctx.fillStyle = '#f5f0e0';
      ctx.fillRect(ox - 6, progY, 12, 16);
      ctx.fillStyle = '#ccc';
      ctx.fillRect(ox - 4, progY + 3, 8, 1);
      ctx.fillRect(ox - 4, progY + 6, 8, 1);
    }
    // Collision
    if (!g1.done && Math.abs(ox - playerX) < 12 && g1.py > -20) {
      o.hit = true;
      g1.score = Math.max(0, g1.score - 15);
      g1.speed = Math.max(2, g1.speed - 0.3);
    }
  }

  // Player avatar (simplified)
  const ppy = groundY - 16 + g1.py;
  const runFrame = Math.floor(animFrame / 8) % 2;
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(playerX - 4, ppy - 20, 8, 8);
  const topCol = ['#2a2a4a', '#e88ca5', '#ff9944', '#1a1a2e', '#d4a8d4', '#666', '#ff6b8a'][playerAvatar.top % 7];
  ctx.fillStyle = topCol;
  ctx.fillRect(playerX - 5, ppy - 12, 10, 8);
  const botCol = ['#2a2a3a', '#c44a7a', '#8b7355', '#e88ca5', '#4a6a9a', '#c44a7a'][playerAvatar.bottom % 6];
  ctx.fillStyle = botCol;
  ctx.fillRect(playerX - 4, ppy - 4, 8, 6);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(playerX - 5, ppy + 2 + (runFrame * 2 - 1), 4, 3);
  ctx.fillRect(playerX + 1, ppy + 2 - (runFrame * 2 - 1), 4, 3);
  // Hair
  ctx.fillStyle = HAIR_COLORS[playerAvatar.hairColor % HAIR_COLORS.length];
  ctx.fillRect(playerX - 5, ppy - 23, 10, 5);

  // Sparkles
  for (let i = g1.sparkles.length - 1; i >= 0; i--) {
    const sp = g1.sparkles[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.vy += 0.1;
    sp.life--;
    ctx.fillStyle = sp.color;
    ctx.globalAlpha = sp.life / 30;
    ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
    ctx.globalAlpha = 1;
    if (sp.life <= 0) g1.sparkles.splice(i, 1);
  }

  // Progress bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W * 0.1, 12, W * 0.6, 10);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(W * 0.1, 12, W * 0.6 * Math.min(1, progress), 10);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(W * 0.1, 12, W * 0.6, 10);

  // Score
  drawPixelText(`${g1.score}`, W * 0.92, 18, 10, '#ffd700', 'right', '#000');

  // Check finish
  if (g1.dist >= g1.maxDist && !g1.done) {
    g1.done = true;
    g1.doneTimer = 0;
    scores.game1 = g1.score;
    // Celebration sparkles
    for (let i = 0; i < 30; i++) {
      g1.sparkles.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.6,
        y: H * 0.5,
        vx: (Math.random() - 0.5) * 6,
        vy: -2 - Math.random() * 5,
        life: 60 + Math.random() * 30,
        color: ['#ffd700', '#ff69b4', '#87ceeb', '#ff4444', '#44ff44'][Math.floor(Math.random() * 5)]
      });
    }
  }

  // Done overlay
  if (g1.done) {
    g1.doneTimer++;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawPixelText('ALTAR REACHED!', W / 2, H * 0.35, 14, '#ffd700', 'center', '#000');
    drawPixelText(`Score: ${g1.score}`, W / 2, H * 0.45, 12, '#fff', 'center', '#000');
    if (g1.doneTimer > 60) {
      const btnW = 140;
      const btnH = 36;
      drawButton('Continue', W / 2 - btnW / 2, H * 0.55, btnW, btnH, false);
    }
  }
}

/* ============================================================
   GAME 2: DDR RHYTHM (DOM + Canvas hybrid)
   ============================================================ */
let g2 = {};

function initGame2DOM() {
  const el = document.getElementById('screenGame2');
  el.innerHTML = `
    <div class="ddr-canvas-wrap"><canvas id="ddrCanvas"></canvas></div>
    <div class="ddr-buttons">
      <button class="ddr-btn left" data-dir="0">⬅</button>
      <button class="ddr-btn down" data-dir="1">⬇</button>
      <button class="ddr-btn up" data-dir="2">⬆</button>
      <button class="ddr-btn right" data-dir="3">➡</button>
    </div>
    <div class="ddr-score-overlay" id="ddrOverlay">
      <div class="pixel-font" style="color:#ffd700;font-size:16px">SPELL COMPLETE!</div>
      <div class="pixel-font" id="ddrFinalScore" style="font-size:14px">0</div>
      <div class="pixel-font" id="ddrMaxCombo" style="font-size:10px;color:#c8a8d8">Max Combo: 0</div>
      <button class="finale-btn gold" id="ddrContinue">Continue ▶</button>
    </div>
  `;

  const ddrCanvas = document.getElementById('ddrCanvas');
  const dCtx = ddrCanvas.getContext('2d');

  g2 = {
    canvas: ddrCanvas, ctx: dCtx,
    arrows: [], score: 0, combo: 0, maxCombo: 0,
    targetY: 0, laneW: 0,
    elapsed: 0, duration: 3600, // 60 sec at 60fps
    done: false, feedbacks: [],
    cleared: 0, // 0-1 how cleared the sky is
    witchX: 0, witchY: 0
  };

  // Generate arrows
  const totalArrows = 90;
  for (let i = 0; i < totalArrows; i++) {
    g2.arrows.push({
      lane: Math.floor(Math.random() * 4),
      time: 120 + i * (g2.duration / totalArrows),
      hit: false, missed: false,
      y: -1 // computed
    });
  }

  // Button events
  document.querySelectorAll('.ddr-btn').forEach(btn => {
    const handler = e => {
      e.preventDefault();
      if (g2.done) return;
      const dir = parseInt(btn.dataset.dir);
      hitDDR(dir);
    };
    btn.addEventListener('pointerdown', handler);
  });

  document.getElementById('ddrContinue').addEventListener('click', () => {
    showScreen('clearSkies');
    clearTimer = 0;
  });

  requestAnimationFrame(ddrLoop);
}

function hitDDR(lane) {
  const targetY = g2.targetY;
  let best = null;
  let bestDist = Infinity;
  for (const a of g2.arrows) {
    if (a.lane !== lane || a.hit || a.missed) continue;
    const dist = Math.abs(a.y - targetY);
    if (dist < bestDist) { bestDist = dist; best = a; }
  }
  if (!best) return;
  const multiplier = g2.combo >= 50 ? 3 : g2.combo >= 25 ? 2 : g2.combo >= 10 ? 1.5 : 1;
  let label = '';
  let pts = 0;
  if (bestDist <= 8) { label = 'PERFECT'; pts = 100; }
  else if (bestDist <= 20) { label = 'GREAT'; pts = 50; }
  else if (bestDist <= 35) { label = 'GOOD'; pts = 25; }
  else { return; }

  best.hit = true;
  pts = Math.floor(pts * multiplier);
  g2.score += pts;
  g2.combo++;
  if (g2.combo > g2.maxCombo) g2.maxCombo = g2.combo;
  g2.feedbacks.push({ text: label, x: g2.laneW * (lane + 0.5) + (g2.canvas.width * 0.1), y: g2.targetY, life: 40, color: label === 'PERFECT' ? '#ffd700' : label === 'GREAT' ? '#4ad94a' : '#4a90d9' });

  // Perfect sparkle on witch
  if (label === 'PERFECT') {
    for (let i = 0; i < 3; i++) {
      g2.feedbacks.push({
        text: '✨', x: g2.witchX + (Math.random() - 0.5) * 30,
        y: g2.witchY + (Math.random() - 0.5) * 20, life: 25, color: '#ffd700'
      });
    }
  }
}

function ddrLoop() {
  if (currentScreen !== 'game2') return;
  requestAnimationFrame(ddrLoop);

  const c = g2.canvas;
  const parent = c.parentElement;
  if (!parent) return;
  c.width = parent.clientWidth * dpr;
  c.height = parent.clientHeight * dpr;
  c.style.width = parent.clientWidth + 'px';
  c.style.height = parent.clientHeight + 'px';
  const d = g2.ctx;
  d.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cW = parent.clientWidth;
  const cH = parent.clientHeight;

  if (!g2.done) g2.elapsed++;

  g2.targetY = cH * 0.15;
  const margin = cW * 0.1;
  g2.laneW = (cW - margin * 2) / 4;
  const laneColors = ['#ff69b4', '#4a90d9', '#4ad94a', '#ffd700'];
  const arrowSymbols = ['◀', '▼', '▲', '▶'];
  const scrollSpeed = cH / 90;

  // Sky clearing
  g2.cleared = Math.min(1, g2.score / 5000);

  // Background — sky gradient based on clearing
  const skyR = Math.floor(26 + g2.cleared * 100);
  const skyG = Math.floor(26 + g2.cleared * 130);
  const skyB = Math.floor(48 + g2.cleared * 160);
  d.fillStyle = `rgb(${skyR},${skyG},${skyB})`;
  d.fillRect(0, 0, cW, cH);

  // Small mansion silhouette at bottom
  const msY = cH * 0.85;
  d.fillStyle = g2.cleared > 0.5 ? 'rgba(180,170,155,0.4)' : 'rgba(80,75,90,0.4)';
  d.fillRect(cW * 0.25, msY, cW * 0.5, cH * 0.15);
  d.fillRect(cW * 0.42, msY - cH * 0.08, cW * 0.08, cH * 0.08);
  // Crenellations silhouette
  for (let i = 0; i < 4; i++) {
    if (i % 2 === 0) d.fillRect(cW * 0.42 + i * cW * 0.02, msY - cH * 0.1, cW * 0.02, cH * 0.02);
  }

  // Rainbow when > 75%
  if (g2.cleared > 0.75) {
    const rainbowColors = ['#ff000060', '#ff770060', '#ffff0060', '#00ff0060', '#0000ff60', '#4b008260'];
    for (let i = 0; i < rainbowColors.length; i++) {
      d.strokeStyle = rainbowColors[i];
      d.lineWidth = 3;
      d.beginPath();
      d.arc(cW * 0.5, cH * 0.9, cW * (0.3 + i * 0.02), Math.PI, 0);
      d.stroke();
    }
  }

  // Storm clouds if not cleared
  if (g2.cleared < 1) {
    d.fillStyle = `rgba(40,40,60,${(1 - g2.cleared) * 0.6})`;
    for (let i = 0; i < 5; i++) {
      const cx = cW * 0.1 + i * cW * 0.2 + Math.sin(g2.elapsed * 0.003 + i) * 15;
      d.beginPath();
      d.ellipse(cx, cH * 0.7, 40, 15, 0, 0, Math.PI * 2);
      d.fill();
    }
  }

  // Lane backgrounds
  for (let i = 0; i < 4; i++) {
    const lx = margin + i * g2.laneW;
    d.fillStyle = 'rgba(255,255,255,0.05)';
    d.fillRect(lx, 0, g2.laneW, cH);
    d.strokeStyle = 'rgba(255,255,255,0.1)';
    d.lineWidth = 1;
    d.strokeRect(lx, 0, g2.laneW, cH);
  }

  // Target zones
  for (let i = 0; i < 4; i++) {
    const lx = margin + i * g2.laneW;
    d.strokeStyle = laneColors[i];
    d.lineWidth = 2;
    d.globalAlpha = 0.5 + Math.sin(g2.elapsed * 0.06) * 0.2;
    d.strokeRect(lx + 4, g2.targetY - 15, g2.laneW - 8, 30);
    d.globalAlpha = 1;
  }

  // Arrows
  for (const a of g2.arrows) {
    if (a.hit) continue;
    a.y = g2.targetY + (a.time - g2.elapsed) * scrollSpeed * -0.3;
    if (a.y > cH + 30) continue;
    if (a.y < -30) continue;

    // Check miss
    if (!a.missed && a.y < g2.targetY - 40) {
      a.missed = true;
      g2.combo = 0;
    }

    if (a.missed) continue;

    const lx = margin + a.lane * g2.laneW + g2.laneW / 2;
    d.fillStyle = laneColors[a.lane];
    d.font = `${Math.min(24, g2.laneW * 0.5)}px "Press Start 2P"`;
    d.textAlign = 'center';
    d.textBaseline = 'middle';
    d.fillText(arrowSymbols[a.lane], lx, a.y);
  }

  // Witch flying around
  g2.witchX = cW * 0.7 + Math.sin(g2.elapsed * 0.02) * cW * 0.15;
  g2.witchY = cH * 0.55 + Math.cos(g2.elapsed * 0.015) * 20;
  d.fillStyle = '#4a2080';
  d.fillRect(g2.witchX - 4, g2.witchY - 6, 8, 10);
  d.fillStyle = '#f0c8a0';
  d.fillRect(g2.witchX - 3, g2.witchY - 12, 6, 6);
  d.fillStyle = '#2a1050';
  d.fillRect(g2.witchX - 5, g2.witchY - 14, 10, 3);
  d.beginPath();
  d.moveTo(g2.witchX - 2, g2.witchY - 14);
  d.lineTo(g2.witchX, g2.witchY - 22);
  d.lineTo(g2.witchX + 2, g2.witchY - 14);
  d.fill();
  d.fillStyle = '#8b6b3a';
  d.fillRect(g2.witchX - 15, g2.witchY + 3, 30, 2);

  // Feedbacks
  for (let i = g2.feedbacks.length - 1; i >= 0; i--) {
    const f = g2.feedbacks[i];
    f.life--;
    f.y -= 1.5;
    d.fillStyle = f.color;
    d.globalAlpha = f.life / 40;
    d.font = '10px "Press Start 2P"';
    d.textAlign = 'center';
    d.fillText(f.text, f.x, f.y);
    d.globalAlpha = 1;
    if (f.life <= 0) g2.feedbacks.splice(i, 1);
  }

  // Score / combo display
  d.fillStyle = '#fff';
  d.font = '10px "Press Start 2P"';
  d.textAlign = 'right';
  d.fillText(`${g2.score}`, cW - 10, 20);
  if (g2.combo > 5) {
    d.fillStyle = '#ffd700';
    d.font = '8px "Press Start 2P"';
    d.fillText(`${g2.combo}x combo`, cW - 10, 34);
  }

  // Multiplier indicator
  const mult = g2.combo >= 50 ? '3x' : g2.combo >= 25 ? '2x' : g2.combo >= 10 ? '1.5x' : '1x';
  d.fillStyle = '#c8a8d8';
  d.font = '8px "Press Start 2P"';
  d.textAlign = 'left';
  d.fillText(`${mult}`, 10, 20);

  // Check done
  if (!g2.done && g2.elapsed > g2.duration + 120) {
    g2.done = true;
    scores.game2 = g2.score;
    const overlay = document.getElementById('ddrOverlay');
    document.getElementById('ddrFinalScore').textContent = `Score: ${g2.score}`;
    document.getElementById('ddrMaxCombo').textContent = `Max Combo: ${g2.maxCombo}`;
    overlay.classList.add('active');
  }
}

/* ============================================================
   GAME 3: KISS CANNONS
   ============================================================ */
let g3 = {};

function initGame3() {
  g3 = {
    score: 0, round: 0, totalRounds: 4,
    needleAngle: 0, needleSpeed: 1.5,
    speedMults: [1, 1.3, 1.6, 2],
    state: 'aiming', // aiming, celebrating, roundEnd, done
    timer: 0, confetti: [], feedback: ''
  };
  tapCallbacks = [(x, y) => {
    if (g3.state === 'aiming') {
      // Calculate score based on needle position
      const norm = (Math.sin(g3.needleAngle) + 1) / 2; // 0-1
      const center = Math.abs(norm - 0.5) * 2; // 0 = center, 1 = edge
      let pts = 0;
      if (center <= 0.08) { pts = 100; g3.feedback = 'PERFECT!'; }
      else if (center <= 0.2) { pts = 60; g3.feedback = 'GREAT!'; }
      else if (center <= 0.4) { pts = 30; g3.feedback = 'GOOD'; }
      else { pts = 0; g3.feedback = 'MISS'; }
      g3.score += pts;
      g3.state = 'celebrating';
      g3.timer = 0;
      // Confetti
      if (pts > 0) {
        const intensity = pts >= 100 ? 40 : pts >= 60 ? 25 : 10;
        for (let i = 0; i < intensity; i++) {
          g3.confetti.push({
            x: W * (0.15 + Math.random() * 0.7),
            y: H * 0.4,
            vx: (Math.random() - 0.5) * 8,
            vy: -3 - Math.random() * 6,
            color: ['#ffd700', '#ff69b4', '#87ceeb', '#ff4444', '#44ff44', '#ff8800', '#aa44ff'][Math.floor(Math.random() * 7)],
            life: 60 + Math.random() * 40,
            size: 3 + Math.random() * 4
          });
        }
      }
      return true;
    }
    if (g3.state === 'roundEnd') {
      g3.round++;
      if (g3.round >= g3.totalRounds) {
        g3.state = 'done';
        scores.game3 = g3.score;
        g3.timer = 0;
      } else {
        g3.state = 'aiming';
        g3.needleAngle = 0;
      }
      return true;
    }
    if (g3.state === 'done' && g3.timer > 90) {
      showScreen('finale');
      return true;
    }
    return false;
  }];
}

function drawGame3() {
  // Interior scene with Gothic arches
  ctx.fillStyle = '#3a3530';
  ctx.fillRect(0, 0, W, H);

  // Arched ceiling
  ctx.fillStyle = '#4a4540';
  for (let i = 0; i < 3; i++) {
    const ax = W * (0.2 + i * 0.3);
    ctx.beginPath();
    ctx.moveTo(ax - W * 0.15, H * 0.5);
    ctx.quadraticCurveTo(ax, H * 0.02, ax + W * 0.15, H * 0.5);
    ctx.lineTo(ax + W * 0.15, 0);
    ctx.lineTo(ax - W * 0.15, 0);
    ctx.closePath();
    ctx.fill();
  }

  // Gothic arch frames
  ctx.strokeStyle = '#8b7d6b';
  ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    const ax = W * (0.2 + i * 0.3);
    ctx.beginPath();
    ctx.moveTo(ax - W * 0.12, H * 0.55);
    ctx.quadraticCurveTo(ax, H * 0.08, ax + W * 0.12, H * 0.55);
    ctx.stroke();
  }

  // Altar
  ctx.fillStyle = '#f5f0e0';
  ctx.fillRect(W * 0.35, H * 0.45, W * 0.3, H * 0.08);
  ctx.fillStyle = '#e8e0d0';
  ctx.fillRect(W * 0.38, H * 0.53, W * 0.24, H * 0.12);

  // Couple
  // Person 1 (left)
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(W * 0.42, H * 0.28, 14, 18);
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(W * 0.43, H * 0.22, 12, 8);
  ctx.fillStyle = '#2a2a3a';
  ctx.fillRect(W * 0.43, H * 0.19, 12, 4);

  // Person 2 (right)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(W * 0.54, H * 0.26, 16, 20);
  ctx.fillStyle = '#f0c8a0';
  ctx.fillRect(W * 0.55, H * 0.20, 12, 8);
  ctx.fillStyle = '#5a3825';
  ctx.fillRect(W * 0.54, H * 0.18, 14, 4);
  // Veil
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(W * 0.56, H * 0.17, 12, 16);

  // Confetti cannons
  const cannonPositions = [
    { x: W * 0.08, y: H * 0.4 },
    { x: W * 0.22, y: H * 0.35 },
    { x: W * 0.78, y: H * 0.35 },
    { x: W * 0.92, y: H * 0.4 }
  ];
  for (const cp of cannonPositions) {
    ctx.fillStyle = '#c44a7a';
    ctx.fillRect(cp.x - 6, cp.y, 12, 24);
    ctx.fillStyle = '#e88ca5';
    ctx.fillRect(cp.x - 8, cp.y - 4, 16, 6);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(cp.x - 2, cp.y - 2, 4, 4);
  }

  // Mazel Tov Meter
  const meterY = H * 0.72;
  const meterW = W * 0.7;
  const meterX = W * 0.15;
  const meterH = 30;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.roundRect(meterX - 10, meterY - 5, meterW + 20, meterH + 10, 8);
  ctx.fill();

  // Meter zones
  const zones = [
    { start: 0, end: 0.3, color: '#555' },
    { start: 0.3, end: 0.4, color: '#4a6a9a' },
    { start: 0.4, end: 0.46, color: '#4ad94a' },
    { start: 0.46, end: 0.54, color: '#ffd700' },
    { start: 0.54, end: 0.6, color: '#4ad94a' },
    { start: 0.6, end: 0.7, color: '#4a6a9a' },
    { start: 0.7, end: 1, color: '#555' }
  ];
  for (const z of zones) {
    ctx.fillStyle = z.color;
    ctx.fillRect(meterX + meterW * z.start, meterY, meterW * (z.end - z.start), meterH);
  }
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(meterX, meterY, meterW, meterH);

  // Update state
  g3.timer++;
  if (g3.state === 'aiming') {
    const speedMult = g3.speedMults[g3.round % g3.speedMults.length];
    g3.needleAngle += 0.04 * speedMult * g3.needleSpeed;
  } else if (g3.state === 'celebrating' && g3.timer > 60) {
    g3.state = 'roundEnd';
    g3.timer = 0;
  }

  // Needle
  const needleNorm = (Math.sin(g3.needleAngle) + 1) / 2;
  const needleX = meterX + meterW * needleNorm;
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.moveTo(needleX, meterY - 6);
  ctx.lineTo(needleX - 5, meterY - 14);
  ctx.lineTo(needleX + 5, meterY - 14);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(needleX - 1, meterY, 2, meterH);

  // Confetti particles
  for (let i = g3.confetti.length - 1; i >= 0; i--) {
    const p = g3.confetti[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.vx *= 0.99;
    p.life--;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.life * 0.1);
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
    ctx.globalAlpha = 1;
    if (p.life <= 0) g3.confetti.splice(i, 1);
  }

  // Round indicator
  drawPixelText(`Round ${g3.round + 1}/${g3.totalRounds}`, W / 2, H * 0.12, 10, '#fff', 'center', '#000');
  drawPixelText(`Score: ${g3.score}`, W * 0.85, H * 0.12, 8, '#ffd700', 'center', '#000');

  // Feedback text
  if (g3.state === 'celebrating' || g3.state === 'roundEnd') {
    const fbColor = g3.feedback === 'PERFECT!' ? '#ffd700' : g3.feedback === 'GREAT!' ? '#4ad94a' : g3.feedback === 'GOOD' ? '#4a90d9' : '#ff4444';
    const fbScale = g3.state === 'celebrating' ? Math.min(1, g3.timer / 10) : 1;
    drawPixelText(g3.feedback, W / 2, H * 0.2, 14 * fbScale, fbColor, 'center', '#000');
  }

  if (g3.state === 'roundEnd') {
    drawPixelText('Tap for next round', W / 2, H * 0.88, 8, '#ccc', 'center', false);
  }

  // Done overlay
  if (g3.state === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    drawPixelText('MAZEL TOV!', W / 2, H * 0.35, 16, '#ffd700', 'center', '#000');
    drawPixelText(`Total: ${g3.score}`, W / 2, H * 0.45, 12, '#fff', 'center', '#000');
    const verdict = g3.score >= 250 ? 'AMAZING!' : g3.score >= 150 ? 'Nice!' : 'Good try!';
    drawPixelText(verdict, W / 2, H * 0.55, 10, '#e88ca5', 'center', false);
    if (g3.timer > 90) {
      const btnW = 140;
      const btnH = 36;
      drawButton('Continue', W / 2 - btnW / 2, H * 0.65, btnW, btnH, false);
    }

    // Celebration confetti
    if (g3.timer % 8 === 0 && g3.score >= 250) {
      for (let i = 0; i < 5; i++) {
        g3.confetti.push({
          x: Math.random() * W, y: -10,
          vx: (Math.random() - 0.5) * 4, vy: 1 + Math.random() * 3,
          color: ['#ffd700', '#ff69b4', '#87ceeb', '#ff4444'][Math.floor(Math.random() * 4)],
          life: 80, size: 4
        });
      }
    }
  }
}

    const totalEl = document.getElementById('finaleTotal');
    if (totalEl) totalEl.textContent = `TOTAL: ${countUp}`;
  }, 30);

  function spawnFirework() {
    if (currentScreen !== 'finale') return;
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.style.left = Math.random() * 100 + '%';
    fw.style.top = 20 + Math.random() * 40 + '%';

  setTimeout(spawnFirework, 500);

  document.getElementById('copyScore').addEventListener('click', () => {
    const text = `I scored ${total} at Max & Julie's Wedding Arcade! 🎮💒\nQuest: ${scores.game1} | Spell: ${scores.game2} | Kiss: ${scores.game3}`;
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('copyScore').textContent = '✅ Copied!';
    }).catch(() => {
      document.getElementById('copyScore').textContent = '❌ Failed';
    });
  });

  document.getElementById('playAgain').addEventListener('click', () => {
    scores = { game1: 0, game2: 0, game3: 0 };
    showScreen('welcome');
  });
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function gameLoop() {
  requestAnimationFrame(gameLoop);
  animFrame++;
  ctx.clearRect(0, 0, W, H);

  switch (currentScreen) {
    case 'welcome': drawWelcome(); break;
    case 'storyIntro': drawStoryIntro(); break;
    case 'game1': drawGame1(); break;
    case 'stormTransition': drawStormTransition(); break;
    case 'witchIntro': drawWitchIntro(); break;
    case 'clearSkies': drawClearSkies(); break;
    case 'game3': drawGame3(); break;
    default: break;
  }
}

// Start
showScreen('welcome');
gameLoop();
</script>
