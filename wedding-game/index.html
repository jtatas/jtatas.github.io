<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Max & Julie's Wedding Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14;font-family:'DM Sans',sans-serif}
#app{position:relative;width:100%;max-width:500px;height:100%;margin:0 auto;overflow:hidden}
canvas#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:1}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;display:none;flex-direction:column}
.screen.active{display:flex}
.screen.canvas-screen{pointer-events:none!important;background:transparent!important}
#screenCharCreator,#screenGame2,#screenFinale{background:#1a1a2e;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pixel-font{font-family:'Press Start 2P',monospace}
.char-creator{padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.char-creator input[type=text]{font-family:'Press Start 2P',monospace;font-size:10px;padding:8px 12px;border:3px solid #d4af37;border-radius:4px;background:#2a1a3e;color:#fff8e7;text-align:center;width:80%;max-width:300px;outline:none}
.char-creator input[type=text]::placeholder{color:#8b7d9b}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.cat-tab{font-family:'Press Start 2P',monospace;font-size:7px;padding:6px 8px;border:2px solid #5c5470;background:#2a1a3e;color:#b8a9c9;cursor:pointer;border-radius:3px;transition:all .2s}
.cat-tab.active{border-color:#d4af37;background:#3d1f5c;color:#ffd700}
.option-row{display:flex;align-items:center;gap:10px;justify-content:center}
.arrow-btn{font-size:20px;width:40px;height:40px;border:2px solid #d4af37;background:#2a1a3e;color:#ffd700;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.arrow-btn:active{background:#3d1f5c;transform:scale(.9)}
.option-label{font-family:'Press Start 2P',monospace;font-size:8px;color:#fff8e7;min-width:100px;text-align:center}
.save-btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 24px;border:3px solid #d4af37;background:linear-gradient(180deg,#3d1f5c,#2a1a3e);color:#ffd700;border-radius:6px;cursor:pointer;margin-top:8px;text-shadow:0 0 8px rgba(255,215,0,.5)}
.save-btn:active{transform:scale(.95);background:#1a1a2e}
#screenGame2{display:none;flex-direction:column}
#screenGame2.active{display:flex}
.ddr-buttons{display:flex;justify-content:center;gap:8px;padding:10px;background:rgba(26,26,46,.95);z-index:10;flex-shrink:0}
.ddr-btn{width:72px;height:72px;border:3px solid;border-radius:8px;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;-webkit-tap-highlight-color:transparent;user-select:none}
.ddr-btn.left{border-color:#e88ca5;background:rgba(232,140,165,.2);color:#e88ca5}
.ddr-btn.down{border-color:#4a8fbd;background:rgba(74,143,189,.2);color:#4a8fbd}
.ddr-btn.up{border-color:#4a8f5c;background:rgba(74,143,92,.2);color:#4a8f5c}
.ddr-btn.right{border-color:#d4af37;background:rgba(212,175,55,.2);color:#d4af37}
.ddr-btn:active,.ddr-btn.flash{transform:scale(.9);filter:brightness(2)}
.ddr-canvas-wrap{flex:1;position:relative;min-height:0}
.ddr-canvas-wrap canvas{width:100%;height:100%;image-rendering:pixelated}
.finale-wrap{padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%}
.finale-title{font-family:'Press Start 2P',monospace;font-size:16px;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.6);animation:glow 1.5s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px rgba(255,215,0,.4)}to{text-shadow:0 0 30px rgba(255,215,0,.8),0 0 60px rgba(255,215,0,.3)}}
.finale-score{font-family:'Press Start 2P',monospace;font-size:20px;color:#fff8e7}
.lb-entry{font-family:'Press Start 2P',monospace;font-size:8px;color:#b8a9c9;padding:4px 0;display:flex;justify-content:space-between;width:100%;max-width:350px}
.lb-entry.current{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.5)}
.finale-btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 16px;border:2px solid #d4af37;background:#2a1a3e;color:#ffd700;border-radius:6px;cursor:pointer;width:100%;max-width:300px}
.finale-btn:active{background:#3d1f5c;transform:scale(.97)}
@keyframes firework-particle{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.fw-particle{position:absolute;width:4px;height:4px;border-radius:50%;animation:firework-particle 1.2s ease-out forwards;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<canvas id="gameCanvas"></canvas>
<div id="screenWelcome" class="screen active canvas-screen"></div>
<div id="screenCharCreator" class="screen"></div>
<div id="screenStoryIntro" class="screen canvas-screen"></div>
<div id="screenGame1" class="screen canvas-screen"></div>
<div id="screenStormTransition" class="screen canvas-screen"></div>
<div id="screenWitchIntro" class="screen canvas-screen"></div>
<div id="screenGame2" class="screen"></div>
<div id="screenClearSkies" class="screen canvas-screen"></div>
<div id="screenGame3" class="screen canvas-screen"></div>
<div id="screenFinale" class="screen"></div>
</div>
<script>
'use strict';
const C=document.getElementById('gameCanvas');
const X=C.getContext('2d');
let W,H,DPR;
function resize(){
const app=document.getElementById('app');
const r=app.getBoundingClientRect();
DPR=Math.min(window.devicePixelRatio||1,2);
W=Math.floor(r.width);H=Math.floor(r.height);
C.width=W*DPR;C.height=H*DPR;
C.style.width=W+'px';C.style.height=H+'px';
X.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize',resize);

// ─── STATE ───
let currentScreen='welcome';
let playerName='Guest';
let playerAvatar={hair:0,hairColor:0,top:0,bottom:0,shoes:0,acc:0};
let scores={game1:0,game2:0,game3:0};
let totalScore=0;
let frameCount=0;

// ─── PALETTE ───
const P={
skyNavy:'#1a1a2e',skyPurple:'#3d1f5c',skyPink:'#e88ca5',
cloudPink:'#e88ca5',cloudSalmon:'#f4a7bb',cloudLavender:'#c4a8d4',
stoneMain:'#8b7d9b',stoneDark:'#5c5470',stoneLight:'#b8a9c9',
copperWarm:'#c47a3a',copperOrange:'#d4913a',copperDark:'#8b5e2a',
treeGreen:'#2d6b3f',treeDark:'#1a4d2e',treeLight:'#4a8f5c',
blossomPink:'#f4a7bb',blossomLight:'#ffd4e0',blossomWhite:'#fff0f5',
gold:'#d4af37',goldBright:'#ffd700',
grass1:'#3a7d44',grass2:'#2d6b3f',grass3:'#5ca86b',
water1:'#4a8fbd',water2:'#3a7aad',
warmWhite:'#fff8e7',cream:'#fdf5e6'
};
const HAIR_COLORS=['#5c3a1e','#e0c97f','#1a1a1a','#a83232'];

// ─── PARTICLES ───
let petals=[];
let birds=[];
let rainDrops=[];
let confettiParticles=[];
let fireworkParticles=[];

function initPetals(n=30){petals=[];for(let i=0;i<n;i++)petals.push({x:Math.random()*W,y:Math.random()*H,vx:-.3-Math.random()*.5,vy:.2+Math.random()*.4,rot:Math.random()*6.28,size:2+Math.random()*3,alpha:.6+Math.random()*.4});}
function updatePetals(){petals.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=.02;if(p.x<-10)p.x=W+10;if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}});}
function drawPetals(){X.save();petals.forEach(p=>{X.globalAlpha=p.alpha;X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.fillStyle=P.blossomPink;X.beginPath();X.ellipse(0,0,p.size,p.size*.5,0,0,Math.PI*2);X.fill();X.fillStyle=P.blossomLight;X.beginPath();X.ellipse(1,-1,p.size*.5,p.size*.3,0,0,Math.PI*2);X.fill();X.restore();});X.restore();}

function initBirds(n=5){birds=[];for(let i=0;i<n;i++)birds.push({x:Math.random()*W,y:20+Math.random()*60,vx:.5+Math.random(),wing:Math.random()*6.28,size:3+Math.random()*2});}
function updateBirds(){birds.forEach(b=>{b.x+=b.vx;b.wing+=.15;if(b.x>W+20)b.x=-20;});}
function drawBirds(){birds.forEach(b=>{X.fillStyle='#2a1a3e';const w=Math.sin(b.wing)*b.size;X.fillRect(b.x-b.size,b.y-Math.abs(w),2,2);X.fillRect(b.x,b.y,2,2);X.fillRect(b.x+b.size,b.y-Math.abs(w),2,2);});}

function initRain(n=100){rainDrops=[];for(let i=0;i<n;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,speed:4+Math.random()*6,len:4+Math.random()*8});}
function updateRain(){rainDrops.forEach(r=>{r.y+=r.speed;if(r.y>H){r.y=-r.len;r.x=Math.random()*W;}});}
function drawRain(){X.strokeStyle='rgba(180,200,255,.4)';X.lineWidth=1;rainDrops.forEach(r=>{X.beginPath();X.moveTo(r.x,r.y);X.lineTo(r.x+1,r.y+r.len);X.stroke();});}

// ─── SKY GRADIENTS ───
function drawSky(type){
let g;
if(type==='golden'){g=X.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,P.skyNavy);g.addColorStop(.4,P.skyPurple);g.addColorStop(.7,P.skyPink);g.addColorStop(1,'#f4a7bb');}
else if(type==='storm'){g=X.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,'#0a0a14');g.addColorStop(.5,'#1a1a2e');g.addColorStop(1,'#3d2a4e');}
else if(type==='clear'){g=X.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,'#4a8fbd');g.addColorStop(.5,'#7abde0');g.addColorStop(1,'#b0dff5');}
else{g=X.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,P.skyNavy);g.addColorStop(1,P.skyPurple);}
X.fillStyle=g;X.fillRect(0,0,W,H*.5);
}

function drawClouds(y,type){
const cols=type==='storm'?['#2a1a3e','#3d2a4e','#1a1020']:
type==='clearing'?['#c4a8d4','#d4b8e4','#a898c4']:
[P.cloudPink,P.cloudSalmon,P.cloudLavender];
for(let i=0;i<5;i++){
const cx=(i*W/4+frameCount*.2*(i%2===0?1:-1))%((W+200))-100;
const cy=y+Math.sin(i*1.5)*15;
X.fillStyle=cols[i%3];
drawPixelCloud(cx,cy,30+i*8,12+i*3);
}
}

function drawPixelCloud(cx,cy,w,h){
const s=4;
for(let dy=-h;dy<=h;dy+=s){
const ratio=1-Math.abs(dy)/h;
const rw=w*ratio;
for(let dx=-rw;dx<=rw;dx+=s){
X.fillRect(cx+dx,cy+dy,s,s);
}
}
}

// ─── HILLS & NATURE ───
function drawHills(baseY){
X.fillStyle='#2a4a3a';
for(let i=0;i<4;i++){
X.beginPath();
const cx=i*W/3-W/6+Math.sin(i*2)*30;
X.moveTo(cx-W/2,baseY+20);
X.quadraticCurveTo(cx,baseY-40-i*10,cx+W/2,baseY+20);
X.fill();
}
}

function drawWater(y,w){
const t=frameCount*.02;
for(let row=0;row<12;row++){
X.fillStyle=row%2===0?P.water1:P.water2;
for(let col=0;col<w;col+=4){
const oy=Math.sin(col*.05+t+row*.3)*2;
X.fillRect(col,y+row*2+oy,4,2);
}
}
}

function drawGrass(y,h){
const colors=[P.grass1,P.grass2,P.grass3];
for(let row=0;row<h;row+=3){
X.fillStyle=colors[row%3];
X.fillRect(0,y+row,W,3);
}
// Grass detail blades
for(let i=0;i<W;i+=6){
X.fillStyle=colors[Math.floor(Math.random()*3)];
const bh=3+Math.random()*5;
X.fillRect(i,y-bh,2,bh);
}
}

// ─── TREE DRAWING ───
function drawTree(x,y,type,scale=1){
const s=scale;
X.save();
X.translate(x,y);
if(type==='evergreen'){
// Trunk
X.fillStyle='#4a3520';
X.fillRect(-3*s,-2*s,6*s,12*s);
// Layers of branches
const greens=[P.treeDark,P.treeGreen,P.treeLight];
for(let layer=0;layer<4;layer++){
const w=(20-layer*3)*s;
const ly=(-8-layer*14)*s;
X.fillStyle=greens[layer%3];
// Triangle
for(let row=0;row<12*s;row+=2*s){
const rw=w*(1-row/(12*s));
X.fillRect(-rw,ly+row,rw*2,2*s);
}
}
}else if(type==='deciduous'){
X.fillStyle='#5c4030';
X.fillRect(-3*s,0,6*s,16*s);
// Crown
const cr=16*s;
X.fillStyle=P.treeGreen;
drawPixelCircle(0,-cr*.6,cr,P.treeGreen);
X.fillStyle=P.treeLight;
drawPixelCircle(-4*s,-cr*.8,cr*.6,P.treeLight);
X.fillStyle=P.treeDark;
drawPixelCircle(5*s,-cr*.5,cr*.5,P.treeDark);
}else if(type==='cherry_blossom'){
X.fillStyle='#5c4030';
X.fillRect(-3*s,0,6*s,16*s);
X.fillStyle='#4a3520';
X.fillRect(-8*s,-4*s,4*s,4*s);
X.fillRect(5*s,-6*s,4*s,4*s);
// Pink canopy
const cr=16*s;
drawPixelCircle(0,-cr*.7,cr,P.blossomPink);
drawPixelCircle(-6*s,-cr*.5,cr*.7,P.blossomLight);
drawPixelCircle(5*s,-cr*.8,cr*.6,'#f4a7bb');
// Flower dots
for(let i=0;i<12;i++){
const fx=(Math.random()-.5)*cr*1.5;
const fy=-cr*.3-Math.random()*cr;
X.fillStyle=i%2===0?P.blossomWhite:'#ffd4e0';
X.fillRect(fx,fy,3*s,3*s);
}
}
X.restore();
}

function drawPixelCircle(cx,cy,r,col){
X.fillStyle=col;
const s=2;
for(let dy=-r;dy<=r;dy+=s){
const w=Math.sqrt(r*r-dy*dy);
X.fillRect(cx-w,cy+dy,w*2,s);
}
}

// ─── LYNDHURST MANSION ───
function drawMansion(mx,my,scale,timeOfDay){
const s=scale;
X.save();
X.translate(mx,my);

// Color adjustments based on time
let stoneCol=P.stoneMain,stoneDk=P.stoneDark,stoneLt=P.stoneLight;
let roofCol=P.copperWarm,roofDk=P.copperDark;
let winGlow='rgba(255,220,150,.6)';
if(timeOfDay==='storm'){stoneCol='#6b5d7b';stoneDk='#4c4060';stoneLt='#988aab';roofCol='#8a6030';roofDk='#6a4a20';winGlow='rgba(200,180,100,.3)';}
else if(timeOfDay==='clear'){stoneCol='#9b8dab';stoneDk='#6c6480';stoneLt='#c8b9d9';winGlow='rgba(200,230,255,.4)';}
else if(timeOfDay==='night'){stoneCol='#5b4d6b';stoneDk='#3c3050';stoneLt='#7b6d8b';winGlow='rgba(255,200,100,.8)';}

// Main body
const bodyW=120*s,bodyH=70*s;
// Stone texture
for(let row=0;row<bodyH;row+=3*s){
X.fillStyle=row%(6*s)<3*s?stoneCol:stoneDk;
X.fillRect(-bodyW/2,-bodyH+row,bodyW,3*s);
// Mortar lines
if(row%(6*s)===0){X.fillStyle=stoneLt;X.fillRect(-bodyW/2,-bodyH+row,bodyW,s);}
}

// Crenellations
for(let i=0;i<bodyW;i+=8*s){
if((i/( 8*s))%2===0){
X.fillStyle=stoneCol;
X.fillRect(-bodyW/2+i,-bodyH-6*s,6*s,6*s);
}
}

// Central tower
const towerW=28*s,towerH=55*s;
for(let row=0;row<towerH;row+=3*s){
X.fillStyle=row%(6*s)<3*s?stoneDk:stoneCol;
X.fillRect(-towerW/2,-bodyH-towerH+row,towerW,3*s);
}
// Central spire
X.fillStyle=roofCol;
for(let row=0;row<30*s;row+=2*s){
const w=towerW/2*(1-row/(30*s));
X.fillRect(-w,-bodyH-towerH-30*s+row,w*2,2*s);
}
// Spire tip
X.fillStyle=P.goldBright;
X.fillRect(-s,-bodyH-towerH-32*s,2*s,4*s);

// Left tower
const ltX=-bodyW/2-5*s;
const stH=40*s,stW=22*s;
for(let row=0;row<stH;row+=3*s){
X.fillStyle=row%(6*s)<3*s?stoneCol:stoneDk;
X.fillRect(ltX,-(bodyH+stH)+row+bodyH*.3,stW,3*s);
}
// Left tower roof
X.fillStyle=roofCol;
for(let row=0;row<20*s;row+=2*s){
const w=stW/2*(1-row/(20*s));
X.fillRect(ltX+stW/2-w,-(bodyH+stH)-20*s+row+bodyH*.3,w*2,2*s);
}

// Right tower
const rtX=bodyW/2-17*s;
for(let row=0;row<stH;row+=3*s){
X.fillStyle=row%(6*s)<3*s?stoneCol:stoneDk;
X.fillRect(rtX,-(bodyH+stH)+row+bodyH*.3,stW,3*s);
}
X.fillStyle=roofCol;
for(let row=0;row<20*s;row+=2*s){
const w=stW/2*(1-row/(20*s));
X.fillRect(rtX+stW/2-w,-(bodyH+stH)-20*s+row+bodyH*.3,w*2,2*s);
}

// Gothic windows on main body
for(let i=0;i<3;i++){
const wx=-35*s+i*30*s;
drawGothicWindow(wx,-bodyH+20*s,8*s,16*s,winGlow);
}
// Tower windows
drawGothicWindow(0,-bodyH-towerH+15*s,6*s,12*s,winGlow);
drawGothicWindow(0,-bodyH-towerH+32*s,6*s,12*s,winGlow);
drawGothicWindow(ltX+stW/2,-(bodyH+stH)+15*s+bodyH*.3,5*s,10*s,winGlow);
drawGothicWindow(rtX+stW/2,-(bodyH+stH)+15*s+bodyH*.3,5*s,10*s,winGlow);

// Grand entrance
const doorW=16*s,doorH=22*s;
X.fillStyle='#2a1a1a';
X.fillRect(-doorW/2,-doorH,doorW,doorH);
// Arch top
X.fillStyle=stoneDk;
for(let row=0;row<doorW/2;row+=2*s){
const w=Math.sqrt((doorW/2)*(doorW/2)-row*row);
X.fillRect(-w,-doorH-row,w*2,2*s);
}
X.fillStyle='#1a0a0a';
for(let row=0;row<doorW/2-2*s;row+=2*s){
const w=Math.sqrt((doorW/2-2*s)*(doorW/2-2*s)-row*row);
X.fillRect(-w,-doorH-row,w*2,2*s);
}
// Door details
X.fillStyle=roofDk;
X.fillRect(-2*s,-doorH+4*s,s,doorH-4*s);
X.fillStyle=P.gold;
X.fillRect(3*s,-doorH/2,2*s,2*s);

X.restore();
}

function drawGothicWindow(cx,cy,w,h,glowCol){
// Window frame
X.fillStyle='#3c3050';
X.fillRect(cx-w/2,cy,w,h);
// Pointed arch top
for(let row=0;row<w/2;row+=2){
const rw=w/2-row;
X.fillRect(cx-rw,cy-row,rw*2,2);
}
// Glass glow
X.fillStyle=glowCol;
X.fillRect(cx-w/2+2,cy+2,w-4,h-4);
for(let row=0;row<w/2-2;row+=2){
const rw=w/2-2-row;
X.fillRect(cx-rw,cy-row,rw*2,2);
}
// Mullion
X.fillStyle='#3c3050';
X.fillRect(cx-1,cy-w/4,2,h+w/4);
}

// ─── DRAW AVATAR ───
function drawAvatar(ax,ay,sc,av){
av=av||playerAvatar;
const s=sc||4;
X.save();
X.translate(ax,ay);
// Body base (skin)
const skin='#e8b89d';
const skinShade='#d4a088';
// Head
X.fillStyle=skin;
X.fillRect(-5*s,-58*s,10*s,10*s);
X.fillStyle=skinShade;
X.fillRect(-5*s,-49*s,10*s,2*s);
// Eyes
X.fillStyle='#1a1a1a';
X.fillRect(-3*s,-55*s,2*s,2*s);
X.fillRect(1*s,-55*s,2*s,2*s);
// Mouth
X.fillStyle='#c47070';
X.fillRect(-2*s,-52*s,4*s,s);

// Hair
const hc=HAIR_COLORS[av.hairColor%4];
const hairs=[
()=>{X.fillStyle=hc;X.fillRect(-6*s,-62*s,12*s,6*s);X.fillRect(-6*s,-58*s,2*s,4*s);X.fillRect(4*s,-58*s,2*s,4*s);},
()=>{X.fillStyle=hc;X.fillRect(-6*s,-63*s,12*s,6*s);X.fillRect(-7*s,-58*s,3*s,16*s);X.fillRect(4*s,-58*s,3*s,16*s);X.fillRect(-6*s,-58*s,2*s,8*s);X.fillRect(4*s,-58*s,2*s,8*s);},

// ─── DRAW TEXT HELPERS ───
function drawPixelText(text,x,y,size,color,align){
X.save();
X.font=size+'px "Press Start 2P",monospace';
X.fillStyle=color||P.warmWhite;
X.textAlign=align||'center';
X.textBaseline='middle';
X.fillText(text,x,y);
X.restore();
}

function drawTextWithShadow(text,x,y,size,color,shadowColor){
X.save();
X.font=size+'px "Press Start 2P",monospace';
X.textAlign='center';X.textBaseline='middle';
X.fillStyle=shadowColor||'rgba(0,0,0,.5)';
X.fillText(text,x+2,y+2);
X.fillStyle=color||P.goldBright;
X.fillText(text,x,y);
X.restore();
}

function drawButton(text,bx,by,bw,bh,pulse){
const p=pulse?Math.sin(frameCount*.06)*3:0;
X.fillStyle='rgba(61,31,92,.9)';
X.fillRect(bx-bw/2-p,by-bh/2-p,bw+p*2,bh+p*2);
X.strokeStyle=P.gold;X.lineWidth=2;
X.strokeRect(bx-bw/2-p,by-bh/2-p,bw+p*2,bh+p*2);
drawPixelText(text,bx,by,10,P.goldBright);
return{x:bx-bw/2-p,y:by-bh/2-p,w:bw+p*2,h:bh+p*2};
}

function isInRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}

// ─── DIALOG BOX ───
function drawDialogBox(text,progress){
const dh=80;const dy=H-dh-20;
X.fillStyle='rgba(26,26,46,.92)';
X.fillRect(10,dy,W-20,dh);
X.strokeStyle=P.gold;X.lineWidth=2;
X.strokeRect(10,dy,W-20,dh);
const shown=text.substring(0,Math.floor(progress*text.length));
X.save();
X.font='9px "Press Start 2P",monospace';
X.fillStyle=P.warmWhite;
X.textAlign='left';X.textBaseline='top';
// Word wrap
const maxW=W-50;
let lines=[];let line='';
for(const word of shown.split(' ')){
const test=line?line+' '+word:word;
if(X.measureText(test).width>maxW){lines.push(line);line=word;}
else line=test;
}
if(line)lines.push(line);
lines.forEach((l,i)=>X.fillText(l,22,dy+12+i*16));
X.restore();
}

// ─── RAINBOW ───
function drawRainbow(rx,ry,rw,rh,alpha){
X.save();X.globalAlpha=alpha||1;
const colors=['#ff0000','#ff7700','#ffff00','#00cc00','#0077ff','#8800ff'];
const bandH=rh/colors.length;
colors.forEach((c,i)=>{
X.strokeStyle=c;X.lineWidth=bandH;
X.beginPath();
X.arc(rx,ry+rh*2,rw-i*bandH*1.5,Math.PI,0);
X.stroke();
});
X.restore();
}

// ─── CONFETTI ───
function spawnConfetti(n,cx,cy){
for(let i=0;i<n;i++){
confettiParticles.push({
x:cx,y:cy,
vx:(Math.random()-.5)*8,vy:-3-Math.random()*6,
color:['#ff6b6b','#ffd700','#ff69b4','#00ff88','#4a8fbd','#f4a7bb','#d4af37'][Math.floor(Math.random()*7)],
size:2+Math.random()*4,life:1,decay:.008+Math.random()*.01
});
}
}
function updateConfetti(){confettiParticles=confettiParticles.filter(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.15;c.life-=c.decay;return c.life>0;});}
function drawConfetti(){confettiParticles.forEach(c=>{X.globalAlpha=c.life;X.fillStyle=c.color;X.fillRect(c.x,c.y,c.size,c.size);});X.globalAlpha=1;}

// ─── LIGHTNING ───
let lightningTimer=0;let lightningAlpha=0;
function drawLightning(){
if(lightningTimer<=0&&Math.random()<.005){lightningTimer=6;lightningAlpha=.8;}
if(lightningTimer>0){
X.save();X.globalAlpha=lightningAlpha;X.fillStyle='#fff';X.fillRect(0,0,W,H);
lightningTimer--;lightningAlpha*=.5;
X.restore();
}
}

// ─── FULL SCENE HELPERS ───
function drawFullScene(timeOfDay,showMansion,showTrees){

if(timeOfDay==='clear'){drawRainbow(W/2,H*.15,W*.4,30,1);}
drawHills(H*.35);
drawWater(H*.38,W);
drawGrass(H*.42,H*.58);
if(showTrees!==false){
drawTree(30,H*.5,'evergreen',.8);
drawTree(W-40,H*.48,'evergreen',.9);
drawTree(60,H*.52,'cherry_blossom',.7);
drawTree(W-70,H*.53,'cherry_blossom',.75);
drawTree(W/2-80,H*.55,'deciduous',.6);
drawTree(W/2+85,H*.54,'deciduous',.65);
}
if(showMansion!==false){
drawMansion(W/2,H*.58,Math.min(W/300,1.6),timeOfDay);
}
}

// SCREEN 4: GAME 1 - Side-Scrolling Runner
// ══════════════════════════════════════
let g1={dist:0,maxDist:1500,score:0,vy:0,py:0,ground:0,jumping:false,jumpHold:false,jumpTimer:0,
speed:3,items:[],obstacles:[],particles:[],done:false,showResult:false,resultTimer:0,btnRect:null,boosted:0};

function initGame1(){
showScreen('game1');
g1={dist:0,maxDist:1500,score:0,vy:0,py:0,ground:0,jumping:false,jumpHold:false,jumpTimer:0,
speed:3,items:[],obstacles:[],particles:[],done:false,showResult:false,resultTimer:0,btnRect:null,boosted:0};
g1.ground=H*.78;g1.py=g1.ground;

// Pre-generate items
for(let d=100;d<1500;d+=30+Math.random()*40){
if(Math.random()<.7){
g1.items.push({type:Math.random()<.85?'petal':'ring',dist:d,y:g1.ground-20-Math.random()*60,collected:false});
}
}
for(let d=200;d<1400;d+=80+Math.random()*80){
const types=['chair','cork','program'];
g1.obstacles.push({type:types[Math.floor(Math.random()*3)],dist:d,y:0,vy:0,active:true});
}

let holdStart=0;
canvasClickHandler=(cx,cy)=>{
if(g1.showResult&&g1.btnRect&&isInRect(cx,cy,g1.btnRect)){
scores.game1=g1.score;
initStormTransition();
return;
}
if(!g1.done&&!g1.jumping&&g1.py>=g1.ground-1){
g1.jumping=true;g1.vy=-8;g1.jumpTimer=0;
}
};
// Hold for higher jump
C.addEventListener('mousedown',g1HoldStart);
C.addEventListener('touchstart',g1HoldStart,{passive:true});
C.addEventListener('mouseup',g1HoldEnd);
C.addEventListener('touchend',g1HoldEnd,{passive:true});
}

function g1HoldStart(){g1.jumpHold=true;g1.jumpTimer=0;}
function g1HoldEnd(){g1.jumpHold=false;}

function cleanupG1(){
C.removeEventListener('mousedown',g1HoldStart);
C.removeEventListener('touchstart',g1HoldStart);
C.removeEventListener('mouseup',g1HoldEnd);
C.removeEventListener('touchend',g1HoldEnd);
}

function updateGame1(){
if(g1.done)return;
const spd=g1.boosted>0?g1.speed*1.5:g1.speed;
g1.dist+=spd;
if(g1.boosted>0)g1.boosted--;

// Jump physics
if(g1.jumping){
if(g1.jumpHold&&g1.jumpTimer<12){g1.vy-=.3;g1.jumpTimer++;}
g1.py+=g1.vy;g1.vy+=.5;
if(g1.py>=g1.ground){g1.py=g1.ground;g1.jumping=false;g1.vy=0;}
}

// Player hitbox
const px=60,pw=20,ph=40;
const playerRect={x:px-pw/2,y:g1.py-ph,w:pw,h:ph};

// Collect items
g1.items.forEach(it=>{
if(it.collected)return;
const ix=(it.dist-g1.dist)+W*.2;
if(ix<-30||ix>W+30)return;
if(Math.abs(ix-px)<18&&Math.abs(it.y-(g1.py-20))<25){
it.collected=true;
if(it.type==='petal'){g1.score+=10;g1.particles.push({x:ix,y:it.y,life:30,type:'petal'});}
else{g1.score+=50;g1.boosted=120;g1.particles.push({x:ix,y:it.y,life:40,type:'ring'});}
}
});

// Check obstacles
g1.obstacles.forEach(ob=>{
if(!ob.active)return;
const ox=(ob.dist-g1.dist)+W*.2;
if(ob.type==='cork'){
ob.y=H*.3+Math.sin((g1.dist-ob.dist+400)*.01)*100;
if(Math.abs(ox-px)<12&&Math.abs(ob.y-(g1.py-20))<15){
g1.score=Math.max(0,g1.score-5);ob.active=false;
}
}else if(ob.type==='chair'){
ob.y=g1.ground;
if(ox>px-15&&ox<px+15&&g1.py>g1.ground-20){
g1.score=Math.max(0,g1.score-5);ob.active=false;
}
}else{
ob.y=H*.2+(g1.dist%200)*.5;
if(Math.abs(ox-px)<10&&Math.abs(ob.y-(g1.py-20))<15){
g1.score=Math.max(0,g1.score-5);ob.active=false;
}
}
});

g1.particles=g1.particles.filter(p=>{p.life--;return p.life>0;});

if(g1.dist>=g1.maxDist){
g1.done=true;g1.showResult=true;g1.resultTimer=0;
spawnConfetti(60,W/2,H/2);
}
}

function drawGame1(){
X.clearRect(0,0,W,H);
updateGame1();

// Parallax Layer 1: Sky
const progress=g1.dist/g1.maxDist;
const stormAlpha=Math.max(0,(progress-.8)/.2);
drawSky(stormAlpha>.3?'storm':'golden');
drawClouds(20+stormAlpha*10,stormAlpha>.3?'storm':'golden');

// Parallax Layer 2: Mansion interior walls
const wallOffset=(-g1.dist*.3)%200;
X.fillStyle=P.stoneDark;X.fillRect(0,H*.2,W,H*.6);
X.fillStyle=P.stoneMain;
for(let row=0;row<H*.6;row+=6){
X.fillRect(0,H*.2+row,W,3);
}
// Gothic windows scrolling
for(let i=-1;i<5;i++){
const wx=wallOffset+i*120;
drawGothicWindow(wx+60,H*.32,10,20,'rgba(200,180,255,.3)');
}
// Columns
for(let i=-1;i<6;i++){
const cx=wallOffset+i*120;
X.fillStyle=P.stoneDark;X.fillRect(cx,H*.2,12,H*.6);
X.fillStyle=P.stoneLight;X.fillRect(cx+2,H*.2,8,H*.6);
}

// Pews
const pewOffset=(-g1.dist*.8)%100;
for(let i=-1;i<8;i++){
const px2=pewOffset+i*70;
X.fillStyle='#5c3a20';
X.fillRect(px2,H*.65,40,12);X.fillRect(px2,H*.55,4,22);X.fillRect(px2+36,H*.55,4,22);
X.fillRect(px2+W*.5,H*.65,40,12);X.fillRect(px2+W*.5,H*.55,4,22);X.fillRect(px2+W*.5+36,H*.55,4,22);
}

// Red carpet
X.fillStyle='#8b2020';X.fillRect(W*.25,H*.72,W*.5,H*.3);
X.fillStyle='#a03030';
for(let i=0;i<W*.5;i+=4){X.fillRect(W*.25+i,H*.72,2,H*.3);}

// Items
g1.items.forEach(it=>{
if(it.collected)return;
const ix=(it.dist-g1.dist)+W*.2;
if(ix<-20||ix>W+20)return;
if(it.type==='petal'){
X.fillStyle=P.blossomPink;
X.save();X.translate(ix,it.y);X.rotate(frameCount*.05);
X.beginPath();X.ellipse(0,0,6,3,0,0,Math.PI*2);X.fill();
X.fillStyle=P.blossomLight;
X.beginPath();X.ellipse(1,-1,3,2,0,0,Math.PI*2);X.fill();
X.restore();
}else{
// Ring with sparkle
X.strokeStyle=P.goldBright;X.lineWidth=3;
X.beginPath();X.arc(ix,it.y,7,0,Math.PI*2);X.stroke();
X.fillStyle=P.gold;X.beginPath();X.arc(ix,it.y,5,0,Math.PI*2);X.fill();
// Sparkle
const sa=Math.sin(frameCount*.15)*4;
X.fillStyle='#fff';X.fillRect(ix+sa,it.y-8,2,2);X.fillRect(ix-sa,it.y+6,2,2);
}
});

// Obstacles
g1.obstacles.forEach(ob=>{
if(!ob.active)return;
const ox=(ob.dist-g1.dist)+W*.2;
if(ox<-30||ox>W+30)return;
if(ob.type==='chair'){
X.fillStyle='#6a4a2a';
X.fillRect(ox-8,g1.ground-20,16,20);
X.fillRect(ox-10,g1.ground-22,20,4);
X.fillRect(ox-8,g1.ground-30,4,10);
}else if(ob.type==='cork'){
X.fillStyle='#c4963a';
X.fillRect(ox-3,ob.y-4,6,8);
X.fillStyle='#a87a2a';X.fillRect(ox-2,ob.y-5,4,2);
}else{
X.fillStyle='#f0f0f0';X.save();X.translate(ox,ob.y);
X.rotate(Math.sin(frameCount*.1)*.3);
X.fillRect(-8,-10,16,20);
X.fillStyle='#ccc';for(let r=0;r<15;r+=3){X.fillRect(-6,-8+r,12,1);}
X.restore();
}
});

// Particles
g1.particles.forEach(p=>{
X.globalAlpha=p.life/40;
X.fillStyle=p.type==='petal'?P.blossomPink:P.goldBright;
X.fillRect(p.x+Math.random()*10-5,p.y+Math.random()*10-5,3,3);
});
X.globalAlpha=1;

// Player avatar
const playerX=60;
drawAvatar(playerX,g1.py,2);

// Flower trail
if(g1.boosted>0){
X.fillStyle='rgba(255,215,0,.4)';
for(let i=0;i<5;i++){
X.fillRect(playerX-10-i*8,g1.py-10+Math.random()*10,4,4);
}

function generateArrowChart(){
const arrows=[];
const dirs=[0,1,2,3];// left,down,up,right
let t=2000;// start at 2 seconds
const totalDuration=58000;
const numArrows=90;
const interval=totalDuration/numArrows;

for(let i=0;i<numArrows;i++){
const complexity=i/numArrows;
let dir=dirs[Math.floor(Math.random()*4)];
arrows.push({dir,time:t,hit:false,missed:false});
// Double arrows later
if(complexity>.6&&Math.random()<.25){
let dir2=(dir+1+Math.floor(Math.random()*3))%4;
arrows.push({dir:dir2,time:t+50,hit:false,missed:false});
}
t+=interval*(1-complexity*.3)+Math.random()*200;
}
return arrows;
}

function handleDDRInput(dir){
if(g2.done)return;
const now=performance.now();
const currentTime=now-g2.startTime;

let bestIdx=-1,bestDiff=Infinity;
for(let i=0;i<g2.arrows.length;i++){
const a=g2.arrows[i];
if(a.hit||a.missed)continue;
if(a.dir!==dir)continue;
const diff=Math.abs(a.time-currentTime);
if(diff<bestDiff){bestDiff=diff;bestIdx=i;}
}

if(bestIdx>=0&&bestDiff<200){
const a=g2.arrows[bestIdx];
a.hit=true;
let pts=0,text='',color='';
if(bestDiff<=30){pts=100;text='PERFECT!';color='#ffd700';g2.witchSparkle=true;setTimeout(()=>{g2.witchSparkle=false;},500);}
else if(bestDiff<=80){pts=50;text='GREAT!';color='#4a8f5c';}
else if(bestDiff<=130){pts=25;text='GOOD!';color='#4a8fbd';}
else{pts=10;text='OK';color='#b8a9c9';}

g2.combo++;
if(g2.combo>=50)g2.multiplier=3;
else if(g2.combo>=25)g2.multiplier=2;
else if(g2.combo>=10)g2.multiplier=1.5;
else g2.multiplier=1;

g2.maxCombo=Math.max(g2.maxCombo,g2.combo);
g2.score+=Math.floor(pts*g2.multiplier);
g2.feedbackText=text;g2.feedbackTimer=30;g2.feedbackColor=color;
g2.cloudClear=Math.min(1,g2.score/4000);
}else{
g2.combo=0;g2.multiplier=1;
g2.feedbackText='MISS...';g2.feedbackTimer=25;g2.feedbackColor='#c03030';
}
}

function drawPixelCloudOnCtx(ctx,cx,cy,w,h){
const s=3;
for(let dy=-h;dy<=h;dy+=s){
const ratio=1-Math.abs(dy)/h;
const rw=w*ratio;
for(let dx=-rw;dx<=rw;dx+=s){ctx.fillRect(cx+dx,cy+dy,s,s);}
}
}

function lerpColor(a,b,t){
const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
const ar=(ah>>16)&255,ag=(ah>>8)&255,ab2=ah&255;
const br=(bh>>16)&255,bg=(bh>>8)&255,bb=bh&255;
const rr=Math.round(ar+(br-ar)*t),rg=Math.round(ag+(bg-ag)*t),rb=Math.round(ab2+(bb-ab2)*t);
return '#'+((1<<24)+(rr<<16)+(rg<<8)+rb).toString(16).slice(1);
}

const isCurrent=(e.name===playerName&&e.score===totalScore);
lbHtml+=`<div class="lb-entry${isCurrent?' current':''}"><span>${i+1}. ${e.name}</span><span>${e.score}</span></div>`;
});

scr.innerHTML=`
<div class="finale-wrap" id="finaleContent">
<div style="height:20px"></div>
<div class="finale-title">🎉 MAZEL TOV! 🎉</div>
<canvas id="finaleAvatar" width="120" height="200" style="image-rendering:pixelated;margin:8px 0"></canvas>
<div class="finale-score" id="scoreCounter">0</div>
<div style="font-size:10px;color:#b8a9c9;font-family:'Press Start 2P'">
Runner: ${scores.game1} | Spell: ${scores.game2} | Kiss: ${scores.game3}
</div>
<div style="margin-top:12px">
<div style="font-family:'Press Start 2P';font-size:10px;color:#ffd700;margin-bottom:8px">🏆 Guest Leaderboard</div>
${lbHtml}
</div>
<button class="finale-btn" onclick="copyScore()">📋 Copy Score</button>
<button class="finale-btn" onclick="location.href='#'">📸 View Our Photo Album</button>
<button class="finale-btn" onclick="playAgain()">🎮 Play Again</button>
<div style="font-size:8px;color:#8b7d9b;margin:16px 0;font-family:'Press Start 2P';line-height:1.8">
Made with ❤️ for Max & Julie's<br>Wedding at Lyndhurst Mansion
</div>
</div>`;

// Draw small avatar
const fav=document.getElementById('finaleAvatar');
if(fav){
const fc=fav.getContext('2d');
fc.clearRect(0,0,120,200);
fc.save();fc.translate(60,170);
const s2=2;const av=playerAvatar;const skin2='#e8b89d';
fc.fillStyle=skin2;fc.fillRect(-5*s2,-58*s2,10*s2,10*s2);
fc.fillStyle='#1a1a1a';fc.fillRect(-3*s2,-55*s2,2*s2,2*s2);fc.fillRect(1*s2,-55*s2,2*s2,2*s2);
fc.fillStyle='#c47070';fc.fillRect(-2*s2,-52*s2,4*s2,s2);
const hc2=HAIR_COLORS[av.hairColor%4];fc.fillStyle=hc2;
fc.fillRect(-6*s2,-62*s2,12*s2,6*s2);
fc.fillStyle='#1a2a5c';fc.fillRect(-6*s2,-47*s2,12*s2,16*s2);
fc.fillStyle='#1a1a2a';fc.fillRect(-5*s2,-31*s2,10*s2,16*s2);
fc.fillStyle=skin2;fc.fillRect(-4*s2,-15*s2,3*s2,8*s2);fc.fillRect(1*s2,-15*s2,3*s2,8*s2);
fc.fillStyle='#1a1a1a';fc.fillRect(-5*s2,-7*s2,4*s2,4*s2);fc.fillRect(1*s2,-7*s2,4*s2,4*s2);
fc.restore();
}

// Fireworks animation
spawnFinaleFireworks();
}

function spawnFinaleFireworks(){
const fw=document.getElementById('finaleContent');
if(!fw)return;
const colors=['#ff6b6b','#ffd700','#ff69b4','#00ff88','#4a8fbd','#f4a7bb'];
for(let i=0;i<30;i++){
const p=document.createElement('div');
p.className='fw-particle';
p.style.left=Math.random()*100+'%';
p.style.top=Math.random()*30+'%';
p.style.background=colors[Math.floor(Math.random()*6)];
p.style.setProperty('--dx',(Math.random()-.5)*200+'px');
p.style.setProperty('--dy',(Math.random()-.5)*200+'px');
p.style.animationDelay=Math.random()*2+'s';
fw.appendChild(p);
}
setInterval(()=>{
if(currentScreen!=='finale')return;
const p2=document.createElement('div');
p2.className='fw-particle';
p2.style.left=Math.random()*100+'%';
p2.style.top=Math.random()*20+'%';
p2.style.background=colors[Math.floor(Math.random()*6)];
p2.style.setProperty('--dx',(Math.random()-.5)*200+'px');
p2.style.setProperty('--dy',(Math.random()-.5)*200+'px');
if(fw)fw.appendChild(p2);
setTimeout(()=>{if(p2.parentNode)p2.parentNode.removeChild(p2);},1500);
},300);
}

function animateFinaleScore(){
if(currentScreen!=='finale')return;
finaleScoreAnim+=totalScore/60;
const el=document.getElementById('scoreCounter');
if(el){
const shown=Math.min(totalScore,Math.floor(finaleScoreAnim));
el.textContent=shown;
if(shown<totalScore)requestAnimationFrame(animateFinaleScore);
}
}

window.copyScore=function(){
const text=`I scored ${totalScore} at Max & Julie's Wedding Arcade! 🎮🏰`;
if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Copied!')).catch(()=>prompt('Copy:',text));
else prompt('Copy this:',text);
};

window.playAgain=function(){
scores={game1:0,game2:0,game3:0};
initWelcome();
};

// ══════════════════════════════════════
// MAIN GAME LOOP
// ══════════════════════════════════════
function gameLoop(){
frameCount++;
switch(currentScreen){
case 'welcome':drawWelcome();break;
case 'storyIntro':drawStoryIntro();break;
case 'game1':drawGame1();break;
case 'stormTransition':drawStormTransition();break;
case 'witchIntro':drawWitchIntro();break;
case 'game2':drawGame2();break;
case 'clearSkies':drawClearSkies();break;
case 'game3':drawGame3();break;
case 'finale':
if(finaleInited){finaleInited=false;setTimeout(animateFinaleScore,500);}
break;
}
requestAnimationFrame(gameLoop);
}

// Start
initWelcome();
gameLoop();
</script>

</html>
