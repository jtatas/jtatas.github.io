<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Max &amp; Julie's Wedding Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Press Start 2P for English; Nunito for Vietnamese and Russian, which a
     pixel font cannot render legibly. See FONT_STACK in the script. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ONE YEAR ARCADE
   A three-game retro arcade for wedding anniversary guests.
   Everything lives in this one file. Drop it on any web host.
   See the CONFIG block in the script below to customise.
   ============================================================ */

/* Garden-wedding palette: cream paper, meadow flowers, burgundy ink.
   Keep this in sync with the PAL object in the script — the canvas games
   can't read CSS variables, so the two lists mirror each other. */
:root{
  --bg:#FFFBF4;        /* warm cream page          */
  --panel:#FDF2E4;     /* card surface             */
  --panel-2:#F3E0C9;   /* pressed edge / rule      */
  --ink:#5A4038;       /* primary text, warm brown */
  --dim:#836B5C;       /* secondary text           */
  --burgundy:#96203C;
  --coral:#E2683A;
  --gold:#F5A03C;      /* marigold                 */
  --yellow:#FBCB55;
  --pink:#E4568A;      /* ranunculus               */
  --rose:#EE7FA0;
  --blue:#6E9BD8;      /* delphinium               */
  --green:#7FA36A;     /* sage                     */
  --red:#C33A4E;
  /* set by the script from FONT_STACK — see the ONE FONT SWITCH block below */
  --font-scale:1;
  --track:1px;
  --font:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation;
  overscroll-behavior:none;              /* no pull-to-refresh mid-game */
  -webkit-user-select:none; user-select:none;
}
/* dvh keeps the layout stable when mobile browser chrome slides away */
@supports (height:100dvh){ html,body{ height:100dvh; } }

/* soft washes of meadow colour behind the cabinet */
body::before{
  content:''; position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(circle at 18% 12%, rgba(238,127,160,.22), transparent 48%),
    radial-gradient(circle at 84% 78%, rgba(110,155,216,.20), transparent 48%),
    radial-gradient(circle at 62% 20%, rgba(245,160,60,.16), transparent 45%),
    radial-gradient(circle at 30% 88%, rgba(127,163,106,.16), transparent 45%);
  pointer-events:none;
}

#stage{
  position:relative; z-index:1;
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
}

/* On a phone the cabinet fills the screen. On a desktop browser it becomes a
   portrait arcade cabinet in the middle of the page. The canvas letterboxes
   itself inside whichever shape it gets, so play is identical either way. */
#cabinet{
  position:relative;
  width:100%; height:100%;
  background:var(--bg);
  overflow:hidden;
  box-shadow:0 0 0 3px var(--panel-2), 0 18px 50px rgba(150,32,60,.13), 0 2px 12px rgba(90,64,56,.10);
}
/* min-height too: a phone in landscape is 844x390, which matched on width
   alone and shrank the cabinet to a ~210px sliver while every DOM font stayed
   sized against the 844px viewport. */
@media (min-width:520px) and (min-height:600px){
  #cabinet{
    height:min(100%, 880px);
    width:calc(min(100vh, 880px) * 0.5625);
    border-radius:14px;
  }
}

/* Barely-there scanlines. On a dark screen these can be heavy; on cream they'd
   turn to mud, so this is just enough texture to read as "screen". */
#crt{
  position:absolute; inset:0; z-index:60; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(150,32,60,.05) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
#crt::after{
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 62%, rgba(150,110,90,.13) 100%);
}

canvas#game{
  position:absolute; inset:0; width:100%; height:100%;
  display:block; image-rendering:pixelated; z-index:1;
  touch-action:none;                     /* drags steer the basket, not the page */
}

/* ---------- screens ---------- */
.screen{
  position:absolute; inset:0; z-index:10;
  display:none; flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#FFFDF8 0%, #FDF4E8 100%);
}
.screen.active{ display:flex; }
.screen.overlay{ background:rgba(255,251,244,.96); z-index:40; }

h1,h2,h3{margin:0; font-weight:400; line-height:1.5;}
h1{font-size:calc((clamp(14px,4.6vw,20px)) * var(--font-scale)); letter-spacing:1px;}
h2{font-size:calc((clamp(11px,3.4vw,14px)) * var(--font-scale));}
h3{font-size:calc((clamp(9px,2.8vw,11px)) * var(--font-scale));}
p{font-size:calc((clamp(10px,3vw,13px)) * var(--font-scale)); line-height:1.9; color:var(--dim); margin:0;}

/* `safe center` matters here. In a scrolling flex column, plain `center` puts
   overflow past the START edge out of reach — scrollTop cannot go negative — so
   a card taller than the phone loses its top, which on the results screen is
   the SUCCESS banner. `safe` falls back to flex-start once it overflows. */
.center{ align-items:center; justify-content:center; justify-content:safe center;
         text-align:center; gap:18px; }
.spacer{flex:1;}

/* on cream, a glow reads as smudge — these are flat colour with a soft lift */
.glow-pink{ color:var(--burgundy); text-shadow:0 2px 0 rgba(150,32,60,.14); }
.glow-cyan{ color:var(--blue);     text-shadow:0 2px 0 rgba(110,155,216,.18); }
.glow-gold{ color:var(--coral);    text-shadow:0 2px 0 rgba(226,104,58,.16); }

.blink{ animation:blink 1.1s steps(2,start) infinite; }
@keyframes blink{ to{ visibility:hidden; } }

.rings{ font-size:calc((34px) * var(--font-scale)); letter-spacing:-6px; }


/* pixel portraits of the couple — keep the hard edges, never smooth them */
.pixel-art{
  display:block; height:auto; margin:0 auto;
  image-rendering:pixelated; image-rendering:crisp-edges;
}
.bob{ animation:bob 3.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-6px); } }


/* ---------- buttons ---------- */
.btn{
  font-family:var(--font); font-size:calc((clamp(9px,2.8vw,11px)) * var(--font-scale));
  color:var(--ink); background:var(--panel);
  border:none; padding:15px 16px; width:100%;
  cursor:pointer; letter-spacing:var(--track); line-height:1.5;
  box-shadow:0 4px 0 var(--panel-2), inset 0 0 0 2px rgba(90,64,56,.07);
  transition:transform .05s, box-shadow .05s;
}
.btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--panel-2), inset 0 0 0 2px rgba(90,64,56,.07); }
.btn.primary{ background:var(--pink); color:#FFF8FA; box-shadow:0 4px 0 #B33368; }
.btn.primary:active{ box-shadow:0 0 0 #B33368; }
.btn.cyan{ background:var(--blue); color:#F4FAFF; box-shadow:0 4px 0 #4B79B6; }
.btn.cyan:active{ box-shadow:0 0 0 #4B79B6; }
.btn.ghost{ background:transparent; box-shadow:inset 0 0 0 2px var(--panel-2); color:var(--dim); padding:12px; }
/* The album button before all three games are done. Still there — the point is
   that guests can see there is something to unlock — but plainly not pressable. */
.btn.locked{ border:2px dashed var(--dim); box-shadow:none;
  background:var(--panel); color:var(--dim); cursor:default;
  font-size:calc((9px) * var(--font-scale));
}
.btn.locked:active{ transform:none; box-shadow:0 4px 0 var(--panel-2), inset 0 0 0 2px rgba(90,64,56,.07); }
/* unlock popup */
.unlock-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999; display:flex; align-items:center; justify-content:center; animation:fadeIn .3s; }
.unlock-box{ background:var(--cream); padding:28px 24px; border-radius:12px; text-align:center; max-width:88%; width:320px; box-shadow:0 8px 32px rgba(0,0,0,.25); }
.unlock-box h2{ margin:0 0 8px; }
.unlock-box p{ margin:0 0 18px; }
.unlock-box .btn{ margin-top:8px; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.btn.ghost:active{ transform:translateY(2px); }

.btn-row{ display:flex; gap:10px; width:100%; }

/* language picker on the title card */
.langs{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
.langs button{
  font-family:var(--font); font-weight:inherit; font-size:calc((9px) * var(--font-scale)); letter-spacing:var(--track);
  padding:9px 12px; cursor:pointer; border:none; color:var(--dim);
  background:transparent; box-shadow:inset 0 0 0 2px var(--panel-2);
}
.langs button.on{ background:var(--pink); color:#FFF8FA; box-shadow:none; }

/* ---------- cabinet cards on the hub ---------- */
.cards{ display:flex; flex-direction:column; gap:12px; width:100%; }
.card{
  position:relative; display:flex; align-items:center; gap:14px;
  padding:14px; cursor:pointer; text-align:left;
  background:var(--panel); border:none; width:100%; font-family:var(--font);
  box-shadow:0 4px 0 var(--panel-2), inset 0 0 0 2px rgba(90,64,56,.06);
  transition:transform .05s, box-shadow .05s;
}
.card:active{ transform:translateY(4px); box-shadow:0 0 0 var(--panel-2), inset 0 0 0 2px rgba(90,64,56,.06); }
.card .icon{
  flex:0 0 46px; height:46px; display:grid; place-items:center;
  font-size:calc((22px) * var(--font-scale)); background:#FFFDF8; box-shadow:inset 0 0 0 2px rgba(150,32,60,.12);
}
.card .meta{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.card .name{ font-size:calc((clamp(9px,2.9vw,11px)) * var(--font-scale)); color:var(--burgundy); letter-spacing:.5px; }
.card .best{ font-size:calc((8px) * var(--font-scale)); color:var(--dim); letter-spacing:.5px; }
.card .arrow{ color:var(--coral); font-size:calc((14px) * var(--font-scale)); }

/* ---------- HUD / in-game chrome ---------- */
#hud{
  position:absolute; top:0; left:0; right:0; z-index:20;
  display:none; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  pointer-events:none;
}
#hud.active{ display:flex; }
#backBtn{
  pointer-events:auto; font-family:var(--font); font-size:calc((9px) * var(--font-scale));
  background:rgba(255,251,244,.88); color:var(--dim); border:none;
  padding:9px 11px; cursor:pointer; box-shadow:inset 0 0 0 2px var(--panel-2);
}

/* ---------- results ---------- */
/* This was #results .score-big, which matches nothing — the section is
   #scr-results — so the headline number was quietly rendering at body size.
   The clamp is tighter than the original because --font-scale multiplies it,
   and 40px x 1.6 ran a six-figure Russian score off both edges. */
/* Deliberately smaller than the verdict. It used to be the headline and dwarfed
   everything; it's a number for the leaderboard, not the answer to the question
   the screen is being asked. */
.score-big{ font-size:calc((clamp(14px,4.4vw,18px)) * var(--font-scale)); letter-spacing:2px; line-height:1.6; }

/* An explicit vertical rhythm rather than one uniform flex gap, so the verdict,
   the number and the breakdown read as three separate beats instead of one
   column of evenly spaced rows. */
/* A base flex gap PLUS targeted extra, rather than margins carrying the whole
   rhythm. If a margin rule is ever lost to the cascade the layout degrades to
   "slightly tight" instead of "text sitting on text" — which is exactly how the
   SUCCESS banner ended up touching the line below it, twice. */
#scr-results{ gap:12px; }
#resStats{ margin-bottom:10px; }

/* Did I win? Answered before anything else on the card, in one word. The
   weather line underneath tells the story; this just settles the question. */
/* The biggest thing on the card. Did I win is the question everyone actually
   came to the results screen with; the score is a detail underneath it.
   Clamped rather than fixed because "MAYBE NEXT TIME" is twice the length of
   "SUCCESS!" and Russian is twice the length again. */
#resVerdict{
  font-size:calc(clamp(17px,5.6vw,22px) * var(--font-scale)); letter-spacing:var(--track);
  padding:14px 20px; line-height:1.5;
  /* The 26px belongs in this shorthand, not in a separate margin-bottom rule
     further up. Same specificity, and this rule is later, so `margin:0 auto`
     silently reset it and the banner sat on the line below. */
  margin:0 auto 20px;   /* on top of the 12px flex gap, so 32px of clearance */
}
#resVerdict.win{  background:rgba(127,163,106,.22); color:#456E36; box-shadow:0 4px 0 rgba(127,163,106,.30); }
/* deeper than --dim, which only reached 4.0:1 against this panel */
#resVerdict.lose{ background:var(--panel-2);        color:#6E5647; }
#resVerdict:empty{ display:none; }

/* one line per stat, label left and value right, instead of a run-on sentence
   that wrapped mid-phrase */
.lead{ max-width:300px; margin:0 auto 8px; color:var(--burgundy); }
.stats{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:300px; margin:0 auto; }
.stat{
  display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  font-size:calc((9px) * var(--font-scale)); padding:13px 14px; background:var(--panel);
}
.stat .k{ color:var(--dim); letter-spacing:var(--track); }
.stat .v{ color:var(--burgundy); }
.rank-line{ display:flex; justify-content:space-between; gap:10px; font-size:calc((9px) * var(--font-scale)); padding:9px 10px; background:var(--panel); }
.rank-line.me{ background:#FFF3DC; color:var(--coral); box-shadow:inset 0 0 0 2px rgba(226,104,58,.38); }
.rank-line .pos{ color:var(--dim); flex:0 0 26px; }
.rank-line .who{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rank-line .pts{ color:var(--blue); }
.list{ display:flex; flex-direction:column; gap:5px; width:100%; }

/* ---------- name entry ---------- */
input[type=text]{
  font-family:var(--font); font-size:calc((12px) * var(--font-scale)); text-align:center; letter-spacing:2px;
  background:#FFFDF8; color:var(--burgundy); border:none; width:100%; padding:16px 12px;
  box-shadow:inset 0 0 0 2px var(--panel-2); text-transform:uppercase;
}
input[type=text]:focus{ outline:none; box-shadow:inset 0 0 0 2px var(--pink); }
input[type=text]::placeholder{ color:#D9C4B2; }

/* ---------- leaderboard tabs ---------- */
.tabs{ display:flex; gap:5px; width:100%; }
.tab{
  flex:1; font-family:var(--font); font-size:calc((8px) * var(--font-scale)); padding:10px 3px;
  background:var(--panel); color:var(--dim); border:none; cursor:pointer; line-height:1.4;
}
.tab.on{ background:var(--pink); color:#FFF8FA; }

.badge{
  display:inline-block; font-size:calc((7px) * var(--font-scale)); padding:5px 8px; letter-spacing:1px;
  background:var(--panel-2); color:var(--dim);
}
.badge.live{ background:rgba(127,163,106,.20); color:#5F8752; }

.toast{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
  z-index:70; background:var(--burgundy); color:#FFF6F0;
  font-size:calc((8px) * var(--font-scale)); padding:11px 14px; letter-spacing:.5px; max-width:88%;
  text-align:center; line-height:1.7; opacity:0; transition:opacity .25s; pointer-events:none;
}
.toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div id="cabinet">
    <canvas id="game"></canvas>

    <!-- in-game HUD -->
    <div id="hud"><button id="backBtn" data-i18n="quit"></button></div>

    <!-- BOOT -->
    <section class="screen center active" id="scr-boot">
      <img class="pixel-art bob" id="bootArt" src="couple.png" alt="Max and Julie on their wedding day"
           style="width:58%; max-width:200px" onerror="this.style.display='none'">
      <h1 class="glow-pink" data-i18n="bootTitle"></h1>
      <p id="bootSub" data-i18n="bootSub"></p>
      <p id="bootUnlock" style="font-size:calc(10px * var(--font-scale)); color:var(--dim); margin-top:-8px"
         data-i18n="bootUnlock"></p>
      <!-- swallows clicks: the gaps between the chips used to fall through to the
             title card's tap-anywhere handler and enter the arcade -->
        <div class="langs" id="langs" onclick="event.stopPropagation()"></div>
      <!-- no flex spacer here: this is a title card, so the whole group sits
           centred as one composition rather than pinning ENTER to the floor -->
      <button class="btn primary" id="bootBtn" style="margin-top:14px" data-i18n="enter"></button>
      <p class="blink" style="font-size:calc(8px * var(--font-scale))" data-i18n="tapToPlay"></p>
    </section>

    <!-- NAME -->
    <section class="screen center" id="scr-name">
      <h2 class="glow-cyan" data-i18n="nameTitle"></h2>
      <p data-i18n="nameWhy"></p>
      <input type="text" id="nameInput" maxlength="14" data-i18n-ph="namePlaceholder" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn primary" id="nameBtn" data-i18n="start"></button>
      <p style="font-size:calc(7px * var(--font-scale))" data-i18n="namePrivate"></p>
      <!-- only shown when they arrived here via NEW PLAYER, so a first-time
           guest isn't warned about wiping progress they don't have -->
      <p id="newPlayerWhy" style="font-size:calc(7px * var(--font-scale)); color:var(--coral); display:none"
         data-i18n="newPlayerWhy"></p>
    </section>

    <!-- HUB -->
    <section class="screen" id="scr-hub">
      <img class="pixel-art" src="gamers.png" alt="Max and Julie playing games"
           style="width:64%; max-width:250px; margin-bottom:4px" onerror="this.style.display='none'">
      <h2 class="glow-pink" style="text-align:center" data-i18n="selectGame"></h2>
      <p style="text-align:center; margin:10px 0 16px" id="hubGreeting">WELCOME BACK</p>
      <div class="cards" id="cards"></div>
      <!-- a fixed gap, not a flex spacer: enough to separate the games from the
           secondary actions without stranding them at the bottom of the screen -->
      <div style="height:26px; flex:none"></div>
      <div class="btn-row" style="flex-direction:column; gap:8px">
        <!-- label, class and enabled state all set in buildHub(), so no data-i18n
             here — two owners of the same text is how it ends up out of sync -->
        <button class="btn primary" id="finaleBtn"></button>
        <button class="btn cyan" id="scoresBtn" data-i18n="leaderboard"></button>
        <button class="btn ghost" id="renameBtn" style="font-size:calc(8px * var(--font-scale))" data-i18n="changeName"></button>
        <button class="btn ghost" id="homeBtn" style="font-size:calc(8px * var(--font-scale))" data-i18n="backHome"></button>
      </div>
    </section>

    <!-- LEADERBOARD -->
    <section class="screen" id="scr-scores">
      <!-- was the finale screen's portrait at 78%; the leaderboard is a list, so
           it only wants a header, not a hero image -->
      <img class="pixel-art" src="couple-finale.png" alt="Max and Julie celebrating"
           style="width:38%; max-width:130px; margin:0 auto 2px" onerror="this.style.display='none'">
      <h2 class="glow-gold" style="text-align:center" data-i18n="highScores"></h2>
      <div class="tabs" id="scoreTabs" style="margin:16px 0 12px"></div>
      <div class="list" id="scoreList"></div>
      <div class="spacer" style="min-height:16px"></div>
      <span class="badge" id="lbMode" style="display:none"></span>
      <button class="btn ghost" id="scoresBack" data-i18n="back"></button>
    </section>

    <!-- RESULTS -->
    <section class="screen center overlay" id="scr-results">
      <div id="resVerdict"></div>
      <h3 id="resTitle" class="glow-cyan"></h3>
      <div class="score-big glow-gold" id="resScore">0</div>
      <p class="lead" id="resLead"></p>
      <div class="stats" id="resStats"></div>
      <button class="btn primary" id="resAgain"></button>
      <div class="btn-row">
        <button class="btn ghost" id="resHub" data-i18n="hub"></button>
        <button class="btn ghost" id="resScores" data-i18n="scores"></button>
      </div>
    </section>


    <div class="toast" id="toast"></div>
    <div id="crt"></div>
  </div>
</div>

<!-- unlock popup — outside cabinet so it covers the full viewport -->
<div class="unlock-overlay" id="unlockPopup" style="display:none">
  <div class="unlock-box">
    <h2 id="unlockTitle"></h2>
    <p id="unlockMsg"></p>
    <button class="btn primary" id="unlockAlbumBtn"></button>
    <button class="btn ghost" id="unlockLaterBtn"></button>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   1. CONFIG  —  everything you'd want to change lives here
   ========================================================================== */
/* coupleName and weddingYear used to live here and were read by nothing — the
   title card is translated three ways, so a name can't be templated into it.
   Edit STR.bootTitle instead. */
const CONFIG = {
  // Where the hub's SEE THE ALBUM button goes. Blank leaves it permanently
  // locked, so leaving it empty hides the reward rather than breaking anything.
  galleryUrl:   "https://photos.app.goo.gl/Qub8HBfypcJPgY7D9",   // the extended album

  // OPTIONAL shared leaderboard. Leave url blank for on-device scores only.
  // Setup instructions are in README.md.
  supabase: { url: "https://uebgvklwbktrffttijck.supabase.co", anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlYmd2a2x3Ymt0cmZmdHRpamNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODMzMjAsImV4cCI6MjEwMTI1OTMyMH0.v5DNhatHefzw6LGxIN08j4Lx0qs7OWywKsxF-EVaJN0" }
};

/* ============================================================================
   1b. FONTS
   ========================================================================== */
/* Per language, and only English gets a pixel font.

   A pixel font cannot render Vietnamese. "ế" stacks a tone mark on top of an
   already-accented vowel, and a pixel grid has no vertical room for two marks —
   at any size they collapse into noise. Cyrillic in a pixel font fares a little
   better but is still cramped.

   So Vietnamese and Russian use Nunito: rounded and warm enough to sit beside
   the pixel art, and properly legible. The system font stack behind it is the
   real guarantee — every phone ships excellent Vietnamese and Cyrillic faces, so
   these two languages render correctly even if the webfont never loads.

   Readability beat visual uniformity here. To go back to a pixel look for all
   three, point vi and ru at the same family as en — but do look at Vietnamese
   before deciding. */

/* A mouse means a keyboard is probably there too, so the hints name the keys
   rather than telling someone with no touchscreen to tap. */
const DESKTOP = typeof window !== "undefined" && window.matchMedia
  ? window.matchMedia("(pointer: fine)").matches : false;
/* pick the touch or desktop wording for the same instruction */
function TK(touchKey, desktopKey){ return T(DESKTOP ? desktopKey : touchKey); }

/* Safari with "Block All Cookies", and some in-app browsers, throw on any
   localStorage access. Unguarded, that killed the inline script before a single
   string was rendered — the couple portrait and an empty pink button, no error.
   Everything degrades to "nothing is remembered" instead. */
const Store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

let LANG = Store.get("wg.lang") || "en";
if (!STR.bootTitle[LANG]) LANG = "en";

/* T("key", {name:"MAX"}) — falls back to English if a translation is missing,
   so a gap shows up as English rather than as a blank screen. */
function T(key, vars){
  const row = STR[key];
  let s = row ? (row[LANG] || row.en) : key;
  if (vars) for (const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}

/* ============================================================================
   2. TINY UTILITIES
   ========================================================================== */
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick  = (arr) => arr[Math.floor(Math.random()*arr.length)];
const NUM_LOCALE = { en:"en-US", vi:"vi-VN", ru:"ru-RU" };
const fmt   = (n) => Math.round(n).toLocaleString(NUM_LOCALE[LANG] || "en-US");
/* blend two hex colours — the sky crossfades from overcast to clear */
function mixHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  return "rgb(" + Math.round(lerp((pa>>16)&255, (pb>>16)&255, t)) + ","
               + Math.round(lerp((pa>>8)&255,  (pb>>8)&255,  t)) + ","
               + Math.round(lerp(pa&255,       pb&255,       t)) + ")";
}

function toast(msg, ms=2200){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove("show"), ms);
}

   3. SCREEN ROUTER
   ========================================================================== */
const Screens = {
  show(id){
    $$(".screen").forEach(s => s.classList.remove("active"));
    if (id) $("#scr-"+id).classList.add("active");
  },
  overlay(id, on){ $("#scr-"+id).classList.toggle("active", on); },
  hideAll(){ $$(".screen").forEach(s => s.classList.remove("active")); }
};

/* ============================================================================
   4. SOUND  —  a very small chiptune engine (no audio files needed)
   ========================================================================== */
const Sfx = {
  ctx:null, master:null, muted:false,
  init(){
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.32;
    this.master.connect(this.ctx.destination);
    return this.ctx;
  },
  resume(){ if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  // one square-wave blip
  tone(freq, dur=0.08, type="square", vol=0.5, when=0, slideTo=null){
    const c = this.init(); if (!c || this.muted) return;
    const t = when || c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur=0.09, vol=0.35, when=0){
    const c = this.init(); if (!c || this.muted) return;
    const t = when || c.currentTime;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  blip(){ this.tone(880, .05, "square", .35); },
  select(){ this.tone(523.25,.05,"square",.4); this.tone(783.99,.07,"square",.35, this.ctx ? this.ctx.currentTime+.055 : 0); },
  good(){ this.tone(1046.5,.06,"square",.4); },
  great(){ this.tone(1318.5,.07,"square",.4); },
  perfect(){ const c=this.init(); if(!c) return; const t=c.currentTime;
    this.tone(1318.5,.05,"square",.4,t); this.tone(1760,.08,"square",.35,t+.045); },
  miss(){ this.tone(180,.16,"sawtooth",.3,0,90); },
  flap(){ this.tone(660,.05,"square",.3,0,880); },
  boom(){ this.noise(.28,.4); this.tone(120,.3,"triangle",.4,0,40); },
  fanfare(){
    const c=this.init(); if(!c) return; const t=c.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=> this.tone(f,.16,"square",.4,t+i*0.1));
    this.tone(1318.5,.5,"square",.34,t+0.42);
  },
  sad(){
    const c=this.init(); if(!c) return; const t=c.currentTime;
    [392,349.23,293.66].forEach((f,i)=> this.tone(f,.2,"triangle",.35,t+i*0.14));
  }
};

/* ============================================================================
   5. PLAYER STORE
   ========================================================================== */
const Player = {
  get name(){ return Store.get("wg.name") || ""; },
  set name(v){ Store.set("wg.name", v); },
  get id(){
    let i = Store.get("wg.id");
    if (!i){ i = "p" + Math.random().toString(36).slice(2,10); Store.set("wg.id", i); }
    return i;
  },

  /* One phone gets handed round a table all night. Without this, guest two
     arrives with the album already unlocked, sees guest one's scores labelled
     YOUR BEST, and — once Supabase is on — overwrites guest one's leaderboard
     row, because the upsert is keyed on a player_id that never changed.

     A fresh id and no progress. The device leaderboard (wg.lb.*) is deliberately
     left alone: it is the record of everyone who has played on this phone, and
     the new id means the next guest adds a row rather than replacing one. */
  reset(){
    Store.del("wg.id");
    GAMES.forEach(g => { Store.del("wg.done." + g.id); Store.del("wg.best." + g.id); });
    localStorage.removeItem("arcade_album_unlocked");
    this.id;   // mint the new one now, so the first score of the night has it
  }
};

/* ============================================================================
   6. LEADERBOARD  —  local by default, Supabase when configured
   ========================================================================== */
const LB = {
  get live(){ return !!(CONFIG.supabase.url && CONFIG.supabase.anonKey); },

  _localKey(g){ return "wg.lb." + g; },
  _localAll(g){ try { return JSON.parse(Store.get(this._localKey(g))) || []; } catch(e){ return []; } },
  _localSave(g, rows){ Store.set(this._localKey(g), JSON.stringify(rows.slice(0,50))); },

  // personal best, always tracked locally so the hub can show it offline
  best(g){
    const b = Number(Store.get("wg.best."+g) || 0);
    return isNaN(b) ? 0 : b;
  },
  setBest(g, score){
    if (score > this.best(g)) { Store.set("wg.best."+g, String(score)); return true; }
    return false;
  },

  async submit(game, score, meta){
    const isPB = this.setBest(game, score);
    const row = { game, name: Player.name || "ANON", player_id: Player.id, score: Math.round(score), meta: meta||null };

    // always write locally so there's a table even with no network
    const rows = this._localAll(game);
    const mine = rows.findIndex(r => r.player_id === row.player_id);
    if (mine >= 0){ if (score > rows[mine].score) rows[mine] = row; }
    else rows.push(row);
    rows.sort((a,b)=> b.score - a.score);
    this._localSave(game, rows);

    // Only push personal bests upstream. The row is an upsert keyed on
    // (game, player_id), so posting a worse run would clobber a better one.
    if (this.live && isPB){
      try{
        // on_conflict is essential: without naming the (game, player_id) unique
        // constraint, PostgREST checks the primary key instead, which is a
        // generated id that never collides — so every new best would INSERT a
        // fresh row and one guest would fill several leaderboard slots.
        await fetch(CONFIG.supabase.url.replace(/\/$/,"")
                    + "/rest/v1/scores?on_conflict=game,player_id", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey": CONFIG.supabase.anonKey,
            "Authorization": "Bearer " + CONFIG.supabase.anonKey,
            "Prefer": "resolution=merge-duplicates,return=minimal"
          },
          body: JSON.stringify(row)
        });
      } catch(e){ /* offline is fine — local copy already saved */ }
    }
    return isPB;
  },

  async top(game, n=10){
    if (this.live){
      try{
        const url = CONFIG.supabase.url.replace(/\/$/,"")
          + "/rest/v1/scores?game=eq." + encodeURIComponent(game)
          + "&select=name,score,player_id&order=score.desc&limit=" + n;
        const r = await fetch(url, { headers:{ "apikey": CONFIG.supabase.anonKey, "Authorization":"Bearer "+CONFIG.supabase.anonKey }});
        if (r.ok) return await r.json();
      } catch(e){ /* fall through to local */ }
    }
    return this._localAll(game).slice(0, n);
  }
};

/* ============================================================================
   7. CANVAS ENGINE  —  fixed 360x640 logical space, scaled to fit any phone
   ========================================================================== */
const W = 360, H = 640;
const cv = $("#game");
const ctx = cv.getContext("2d", { alpha:false });

function fitCanvas(){
  const box = $("#cabinet").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width  = Math.round(box.width  * dpr);
  cv.height = Math.round(box.height * dpr);
  // resizing resets context state; pixel art must never be smoothed
  ctx.imageSmoothingEnabled = false;
  Engine.scale = Math.min(cv.width / W, cv.height / H);
  Engine.ox = (cv.width  - W * Engine.scale) / 2;
  Engine.oy = (cv.height - H * Engine.scale) / 2;
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", ()=> setTimeout(fitCanvas, 120));

const Engine = {
  scale:1, ox:0, oy:0,
  current:null, raf:null, last:0, running:false,

  start(game){
    this.stop();
    fitCanvas();
    this.current = game;
    Screens.hideAll();
    $("#hud").classList.add("active");
    Sfx.init(); Sfx.resume();
    Input.down = Input.up = Input.move = Input.key = null;
    game.init();
    this.running = true;
    this.last = performance.now();
    const loop = (t) => {
      if (!this.running) return;
      let dt = (t - this.last) / 1000;
      this.last = t;
      dt = Math.min(dt, 1/20);            // never let a background tab warp physics
      ctx.setTransform(1,0,0,1,0,0);
      ctx.fillStyle = "#FFFBF4";
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.setTransform(this.scale,0,0,this.scale,this.ox,this.oy);
      try { game.update(dt); game.draw(ctx); }
      catch(err){
        // stop() leaves no screen active, so without this a thrown error is a
        // blank cream dead end that only a reload escapes
        console.error(err); this.stop();
        try { goHub(); } catch(e){}
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  stop(){
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.current && this.current.destroy) this.current.destroy();
    this.current = null;
    $("#hud").classList.remove("active");
    // wipe the last frame, or it ghosts through the results and finale overlays
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = "#FFFBF4";
    ctx.fillRect(0, 0, cv.width, cv.height);
  },

  // convert a pointer event into logical 360x640 coordinates
  toLocal(e){
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * (cv.width  / r.width);
    const py = (e.clientY - r.top)  * (cv.height / r.height);
    return { x: (px - this.ox) / this.scale, y: (py - this.oy) / this.scale };
  }
};

/* --- shared input plumbing: games register onDown / onUp / onMove --- */
const Input = { down:null, up:null, move:null, key:null };
function bindInput(){
  const handler = (type) => (e) => {
    if (!Engine.running) return;
    if (e.cancelable) e.preventDefault();
    const p = Engine.toLocal(e.touches ? (e.touches[0] || e.changedTouches[0]) : e);
    const fn = Input[type];
    if (fn) fn(p.x, p.y);
  };
  // capture, or a mouse released outside the canvas never sends pointerup and
  // the basket stays stuck to a drag that has already finished
  cv.addEventListener("pointerdown", (e)=>{
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
  }, {passive:true});
  cv.addEventListener("pointerdown", handler("down"), {passive:false});
  cv.addEventListener("pointerup",   handler("up"),   {passive:false});
  cv.addEventListener("pointermove", handler("move"), {passive:false});
  window.addEventListener("keydown", (e)=>{
    if (!Engine.running) return;
    if ([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
    if (Input.key) Input.key(e.key);
  });
}
bindInput();

/* --- pixel-art helper: draw a sprite from a string map --- */
function sprite(g, map, pal, x, y, px){
  for (let r=0;r<map.length;r++){
    const row = map[r];
    for (let c=0;c<row.length;c++){
      const ch = row[c];
      if (ch === " " || ch === ".") continue;
      g.fillStyle = pal[ch] || "#fff";
      g.fillRect(x + c*px, y + r*px, px, px);
    }
  }
}

/* --- chunky pixel text, centred --- */
function setFont(g, size){
  const f = FONT();
  g.font = f.weight + " " + (size * f.scale).toFixed(2) + "px " + f.family;
}

function text(g, str, x, y, size, color, align="center"){
  g.fillStyle = color;
  setFont(g, size);
  g.textAlign = align; g.textBaseline = "middle";
  g.fillText(str, x, y);
}

/* Shrink a line until it fits. Translations run longer than the English they
   came from — "MAYBE NEXT TIME" becomes "МОЖЕТ, В СЛЕДУЮЩИЙ РАЗ" — and the
   font is no longer one em per character, so nothing can be sized by hand. */
function fitSize(g, str, size, maxW){
  setFont(g, size);
  let w = g.measureText(str).width;
  while (w > maxW && size > 5){
    size -= 0.5;
    setFont(g, size);
    w = g.measureText(str).width;
  }
  return size;
}

/* Wrap a sentence to a width and hand back the lines, so intro copy can be one
   string per language instead of hand-broken lines that only suit English. */
function wrapLines(g, str, size, maxW){
  setFont(g, size);
  const words = String(str).split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words){
    const test = line ? line + " " + word : word;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* Draw a wrapped paragraph centred on x, starting at y. Returns the y below it,
   so callers can stack blocks without hard-coding positions per language. */
function paragraph(g, str, x, y, size, color, maxW, lineGap){
  const step = lineGap || size * 2.35;   // roomy: Vietnamese stacks diacritics above
  let yy = y;
  /* A literal \n means "new paragraph", not "new line" — the blocks get a
     half-step of air between them. Word wrap can't be trusted to land a break
     where the meaning does, and "…catch flowers. Last 35 seconds…" ran the
     story and the win condition together mid-line. */
  String(str).split("\n").forEach((part, i) => {
    if (i) yy += step * 0.6;
    wrapLines(g, part, size, maxW).forEach(ln => {
      textShadow(g, ln, x, yy, size, color);
      yy += step;
    });
  });
  return yy;
}
/* On cream, a hard drop shadow looks like a smudge. A thin cream outline keeps
   text readable over flowers and paving without darkening the palette. */
function textShadow(g, str, x, y, size, color, align="center", maxW){
  const halo = "rgba(255,251,244,.95)";
  // never let a translation run off the edge; canvas has no wrapping or clipping
  size = fitSize(g, str, size, maxW || (W - 16));
  text(g, str, x-1.5, y, size, halo, align);
  text(g, str, x+1.5, y, size, halo, align);
  text(g, str, x, y-1.5, size, halo, align);
  text(g, str, x, y+1.5, size, halo, align);
  text(g, str, x, y, size, color, align);
}

/* Draw a PLAY button below whatever the brief ended up being. Text length varies
   by language and by font scale, so the button can't sit at a fixed y — it used
   to collide with the last line of Russian. */
function playButton(g, y, t){
  const bw = 190, bh = 54, bx = W/2 - bw/2;
  const by = clamp(y + 34, 380, H - 116);
  g.fillStyle = "#B33368"; g.fillRect(bx, by + 4, bw, bh);
  g.fillStyle = "#E4568A"; g.fillRect(bx, by, bw, bh);
  text(g, T("play"), W/2, by + bh/2, 15, "#FFF8FA");
  textShadow(g, TK("tapAnywhere","clickAnywhere"), W/2, by + bh + 24, 8,
             Math.sin(t*5) > 0 ? "#836B5C" : "#C6B4A6");
  return by;
}

/* --- reusable particle system (confetti, sparks, petals) --- */
class Particles {
  constructor(){ this.list = []; }
  burst(x, y, n, opts={}){
    const colors = opts.colors || ["#E4568A","#6E9BD8","#F5A03C","#FBCB55","#7FA36A","#EE7FA0"];
    for (let i=0;i<n;i++){
      const a = opts.angle != null ? opts.angle + rand(-0.6,0.6) : rand(0, Math.PI*2);
      const s = rand(opts.minSpeed||40, opts.maxSpeed||220);
      this.list.push({
        x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: rand(opts.minLife||0.6, opts.maxLife||1.6), age:0,
        size: opts.size || randi(2,4), color: pick(colors),
        grav: opts.grav != null ? opts.grav : 260, spin: rand(-8,8), rot: rand(0,6.28)
      });
    }
  }
  update(dt){
    for (let i=this.list.length-1;i>=0;i--){
      const p = this.list[i];
      p.age += dt;
      if (p.age >= p.life){ this.list.splice(i,1); continue; }
      p.vy += p.grav * dt;
      p.vx *= 0.99;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.spin * dt;
    }
  }
  /* A perfect cannon shot puts ~2,080 pieces on screen over 3.6s. save/translate/rotate/restore
     is four calls per piece; composing the matrix by hand is one. Worth it at the
     exact moment you least want a dropped frame. */
  draw(g){
    const s = Engine.scale, ox = Engine.ox, oy = Engine.oy;
    for (const p of this.list){
      const a = 1 - (p.age / p.life);
      const c = Math.cos(p.rot) * s, n = Math.sin(p.rot) * s;
      g.setTransform(c, n, -n, c, ox + p.x * s, oy + p.y * s);
      g.globalAlpha = a < 0.72 ? a * 1.4 : 1;
      g.fillStyle = p.color;
      g.fillRect(-p.size/2, -p.size/2, p.size, p.size*1.6);
    }
    g.setTransform(s, 0, 0, s, ox, oy);      // hand the canvas back as we found it
    g.globalAlpha = 1;
  }
  clear(){ this.list.length = 0; }
}

/* ============================================================================
   8. GAME REGISTRY  (games themselves are defined further down)
   ========================================================================== */
const GAMES = [];       // {id, name, icon, blurb, unit, make()}
function registerGame(def){ GAMES.push(def); }
function gameById(id){ return GAMES.find(g => g.id === id); }

/* ============================================================================
   8b. PROGRESS  —  which games this guest has finished
   ========================================================================== */
const Progress = {
  done(id){ return Store.get("wg.done." + id) === "1"; },
  mark(id){ Store.set("wg.done." + id, "1"); },
  allDone(){ return GAMES.every(g => this.done(g.id)); },
};

/* ============================================================================
   9. RESULTS FLOW
   ========================================================================== */
let lastPlayed = null;

async function showResults(gameId, score, opts={}){
  lastPlayed = gameId;
  Progress.mark(gameId);
  Engine.stop();
  const def = gameById(gameId);
  const isPB = await LB.submit(gameId, score, opts.meta);

  // opts.won is deliberately three-valued: true, false, or absent for the games
  // that don't have a pass mark
  const verdict = $("#resVerdict");
  verdict.textContent = opts.won === undefined ? "" : T(opts.won ? "youWin" : "maybeNext");
  verdict.className   = opts.won ? "win" : "lose";

  $("#resTitle").textContent = opts.title || T(isPB ? "newBest" : "gameOver");
  $("#resTitle").className = isPB ? "glow-gold" : "glow-cyan";
  $("#resScore").textContent = fmt(score) + " " + T("pts");
  $("#resLead").innerHTML = opts.lead || "";
  $("#resStats").innerHTML = (opts.stats || []).map(row =>
      '<div class="stat"><span class="k">' + escapeHtml(row[0]) + '</span>'
    + '<span class="v">' + escapeHtml(String(row[1])) + '</span></div>').join("");

  /* No leaderboard here. It used to fetch the top five and show them under the
     stats, which turned a "did I win" card into a table and cost a network
     round trip on every single finish. The SCORES button is one tap away. */
  Screens.overlay("results", true);
  // winning sounds like winning even if it wasn't a personal best
  (opts.won === true || (opts.won === undefined && isPB)) ? Sfx.fanfare() : Sfx.sad();

  /* NEXT GAME if they won and something is still unplayed, otherwise PLAY AGAIN
     on the game they just lost. A game that passes no `won` (the cannon) counts
     as a win here: it has no lives to lose, and it has already said MAZEL TOV or
     MAYBE NEXT TIME in letters twice this size.

     The album is deliberately not offered here. It lives on the hub and nowhere
     else — a results screen that dangles it after every round makes the reward
     feel like an advert. */
  const next  = opts.won === false ? null : nextGameAfter(gameId);
  const again = $("#resAgain");
  again.textContent = T(next ? "nextGame" : "playAgain");
  again.onclick = ()=>{ Screens.overlay("results", false); Sfx.select();
                        Engine.start((next || gameById(lastPlayed)).make()); };

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================================
   9b. LANGUAGE PLUMBING
   ========================================================================== */
function applyLang(){
  const root = document.documentElement;
  const f = FONT();
  root.style.setProperty("--font", f.family);
  root.style.setProperty("--font-scale", f.scale);
  root.style.setProperty("--track", f.track);
  root.lang = LANG;
  document.body.style.fontWeight = f.weight;

  $$("[data-i18n]").forEach(el => el.innerHTML = T(el.getAttribute("data-i18n")));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = T(el.getAttribute("data-i18n-ph")));
  buildLangButtons();

  // screens whose contents are generated have to be rebuilt, not just relabelled
  if ($("#scr-hub").classList.contains("active")) buildHub();
  if ($("#scr-scores").classList.contains("active")){ buildScoreTabs(); loadScores(); }
}

function buildLangButtons(){
  const wrap = $("#langs");
  if (!wrap) return;
  wrap.innerHTML = "";
  Object.keys(LANGS).forEach(code => {
    const b = document.createElement("button");
    b.textContent = LANGS[code];
    b.className = code === LANG ? "on" : "";
    b.setAttribute("lang", code);
    // Each chip is labelled in its own language, so it needs its own font —
    // Press Start 2P would render "TIẾNG VIỆT" and "РУССКИЙ" as empty boxes.
    // The per-language scale also makes the three chips look the same size.
    const lf = FONT_STACK[code] || FONT_STACK.en;
    b.style.fontFamily = lf.family;
    b.style.fontWeight = lf.weight;
    b.style.fontSize   = (9 * lf.scale).toFixed(1) + "px";
    b.onclick = (e)=>{ if (e && e.stopPropagation) e.stopPropagation(); setLang(code); };
    wrap.appendChild(b);
  });
}

function setLang(code){
  if (!STR.bootTitle[code]) return;
  LANG = code;
  Store.set("wg.lang", code);
  Sfx.blip();
  applyLang();
}

/* ============================================================================
   10. UI WIRING
   ========================================================================== */
function buildHub(){
  const wrap = $("#cards");
  wrap.innerHTML = "";
  GAMES.forEach(def => {
    const best = LB.best(def.id);
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML =
      '<span class="icon">'+def.icon+'</span>'
      + '<span class="meta">'
      +   '<span class="name">'+T(def.nameKey)+'</span>'
      +   '<span class="best">'
      +     (best ? T("yourBest", { n:fmt(best), unit:T("pts") }) : T(def.blurbKey))
      +   '</span>'
      + '</span><span class="arrow">'+(Progress.done(def.id) ? "&#10003;" : "&#9654;")+'</span>';
    card.onclick = ()=>{ Sfx.select(); Engine.start(def.make()); };
    wrap.appendChild(card);
  });

  const n = Player.name;
  $("#hubGreeting").textContent = n ? T("hello", { name:n }) : T("pickOne");
  /* The album button is always on the hub. Hiding it until all three games were
     done meant the reward only appeared once it had already been earned, and the
     hub carried a separate photos button as well — two things doing one job. */
  // no album configured means nothing to unlock, so the button stays locked
  // rather than turning pink and doing nothing
  const unlocked = Progress.allDone() && !!CONFIG.galleryUrl;
  const album = $("#finaleBtn");
  album.className   = "btn " + (unlocked ? "primary" : "locked");
  album.textContent = T(unlocked ? "finaleBtn" : "finaleLocked");
  album.disabled    = !unlocked;

  // first-time unlock popup
  if (unlocked && !localStorage.getItem("arcade_album_unlocked")) {
    localStorage.setItem("arcade_album_unlocked", "1");
    const popup = $("#unlockPopup");
    $("#unlockTitle").textContent = T("unlockTitle");
    $("#unlockMsg").textContent   = T("unlockMsg");
    const albumBtn = $("#unlockAlbumBtn");
    albumBtn.textContent = T("unlockBtn");

function openAlbum(){

     whenever noopener is in the features string, so a null check reads as

/* Where NEXT GAME goes: forward through the list, preferring one they haven't
   finished, otherwise just the next along.

   Two things this deliberately does not do. It doesn't wrap — the last game in
   GAMES is the end of the run, so the cannon offers PLAY AGAIN rather than
   marching people back to the start. And it doesn't return null once everything
   has been played, which it used to; that meant that from the moment a guest
   had played all three, winning offered PLAY AGAIN forever. */
function nextGameAfter(afterId){
  const i = GAMES.findIndex(g => g.id === afterId);
  if (i < 0 || i === GAMES.length - 1) return null;
  for (let k = i + 1; k < GAMES.length; k++)
    if (!Progress.done(GAMES[k].id)) return GAMES[k];
  return GAMES[i + 1];
}

function drawLights(g, t, y=26){

    const yy = y + Math.sin(x/58) * 12 + 12;
    x===0 ? g.moveTo(x,yy) : g.lineTo(x,yy);
  }
  g.stroke();
  const bulbCols = ["#F5A03C","#FBCB55","#EE7FA0"];

    const glow = 0.65 + 0.35*Math.sin(t*2.2 + i*0.9);
    g.globalAlpha = glow;
    g.fillStyle = bulbCols[i%3];
    g.fillRect(x-2, yy+2, 4, 6);
    g.globalAlpha = glow*0.22;
    g.beginPath(); g.arc(x, yy+5, 10, 0, 6.3); g.fill();
    g.globalAlpha = 1;
  }
}

function drawGuests(g, t, y, count=9){

    g.fillStyle = i%2 ? "#BE9E9E" : "#C9A9A0";
    g.fillRect(x-6, y-h+bob, 12, h);          // body
    g.beginPath(); g.arc(x, y-h+bob-4, 5.5, 0, 6.3); g.fill();  // head

}

/* A band of foliage dotted with blooms — the greenery arch from the mood board,
   reduced to something a canvas can draw sixty times a second. */
function drawHedge(g, t, y){
  for (let i=0;i<28;i++){
    const x = (i*14) % (W+24) - 12;
    const r = 12 + (i%4)*5;
    g.globalAlpha = .50;
    g.fillStyle = i%2 ? "#7FA36A" : "#5F8752";
    g.beginPath(); g.arc(x, y + Math.sin(t*0.8 + i*0.7)*1.5, r, 0, 6.3); g.fill();
  }

  for (let i=0;i<20;i++){

    const yy = y - 10 + ((i*53) % 20);
    g.globalAlpha = .88;
    g.fillStyle = blooms[i % blooms.length];
    g.beginPath(); g.arc(x, yy + Math.sin(t*0.9 + i)*1.5, 3.2, 0, 6.3); g.fill();
  }

}

function drawFloor(g, y, t=0){
  for (let i=0;i<12;i++){
    for (let j=0;j<3;j++){
      g.fillStyle = ((i+j) % 2) ? "#F0E3D2" : "#E7D8C4";
      g.fillRect(i*30, y + j*30, 30, 30);
    }
  }
  g.fillStyle = "#C9B49C"; g.fillRect(0, y, W, 2);
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================================
   12. GAME ONE  —  AUNT LENA'S MAGIC (four-lane rhythm, weather on the line)
   ========================================================================== */
const D_LANES = 4, D_LANE_W = 72, D_X0 = (W - D_LANES*D_LANE_W)/2, D_RECEPTOR = 496;
const D_SPEED = 385;
const D_COLORS = ["#E4568A","#6E9BD8","#7FA36A","#E2683A"];
const D_ROT = [-Math.PI/2, Math.PI, 0, Math.PI/2];   // left, down, up, right
const D_WINDOW = { perfect:0.055, great:0.105, good:0.165 };
const D_SEED = 20250614;   // fixed so every guest plays the identical chart
const D_BPM  = 100;
const D_HORIZON = 250;     // hedge line she stands in front of

/* Lena, wand up. The star on her wand sits at 41% across and 9% down, which is
   where the sparkles come from on a good hit. */
const D_LENA = { aspect: 808/406, wandX: 0.41, wandY: 0.09, h: 176,
                 feet: D_HORIZON - 12 };   // stands just clear of the hedge
const LENA_ART = { img:null, ready:false };
if (typeof Image !== "undefined"){
  const im = new Image();
  im.onload  = ()=>{ LENA_ART.img = im; LENA_ART.ready = true; };
  im.onerror = ()=>{ LENA_ART.ready = false; };
  im.src = "lena.png";
}

/* How much each judgment feeds or drains the spell. Tuned so a clean run turns
   the sky about two thirds through, a scrappy one only manages a let-up, and a
   bad one leaves it raining. Misses cost less than hits earn, or 70% accuracy
   would end in a downpour and feel unfair. */
/* These are per-arrow, and tuned against MEDIUM's 89 of them. EASY has 15, so
   the rates are multiplied by the same factor as the score — otherwise the most
   spell power an EASY round could possibly reach is 0.30 and the sky would never
   clear no matter how perfectly it was played. */
const D_POWER = { perfect:0.020, great:0.015, good:0.008, miss:-0.030 };
/* The sky has to actually stop raining for the round to count as a win. That's
   the same line the weather bands already draw between "eased off" and "still
   spitting", so the verdict and the story can't contradict each other. */
const D_WIN_SKY = 0.55;

const SKY_WET  = { top:"#CBD6E2", bot:"#E8EDF2" };
const SKY_CLEAR= { top:"#EAF2FB", bot:"#FFFBF4" };

function drawArrow(g, cx, cy, s, dir, fill, outlineOnly){
  g.save();
  g.translate(cx, cy);
  g.rotate(D_ROT[dir]);
  g.beginPath();
  g.moveTo(0, -s);
  g.lineTo(s, 0);
  g.lineTo(s*0.44, 0);
  g.lineTo(s*0.44, s*0.85);
  g.lineTo(-s*0.44, s*0.85);
  g.lineTo(-s*0.44, 0);
  g.lineTo(-s, 0);
  g.closePath();
  if (outlineOnly){ g.strokeStyle = fill; g.lineWidth = 2.5; g.stroke(); }
  else {
    g.fillStyle = fill; g.fill();
    g.strokeStyle = "rgba(90,64,56,.30)"; g.lineWidth = 1.5; g.stroke();
  }
  g.restore();
}

/* The song has one shape — calm, building, busiest, easing off — held here as
   fractions of the chart rather than absolute beats, so a shorter difficulty
   gets the same arc rather than just the opening of it. The five boundaries are
   written as /79 because that is where MEDIUM's sections used to start, and
   MEDIUM's chart has to come out identical to the one already tuned. */
const D_SECTIONS = [
  { at: 0/79, density:0.42, eighth:0.00, jump:0.00 },
  { at:12/79, density:0.70, eighth:0.22, jump:0.03 },
  { at:30/79, density:0.86, eighth:0.46, jump:0.07 },
  { at:50/79, density:0.94, eighth:0.62, jump:0.13 },
  { at:68/79, density:0.58, eighth:0.18, jump:0.05 }
];

/* Three ways to play the same song.
   EASY is half-time: notes can only land on every other beat, never on the
   off-beat, and never two at once — about a third of MEDIUM's arrows, over
   40 beats (~25s) instead of 79 (~50s). Half-time matters more than it looks:
   the music is in 4/4, so every other beat still falls on beat 1 and 3 of the
   bar. Spacing notes every third beat would be a third as many too, but they'd
   drift across the bar and stop feeling like the music.
   HARD is MEDIUM with the doubles turned up, not sped up — same arrows in the
   same places, more of them arriving together. */
const D_DIFFS = ["easy", "medium", "hard"];
const D_DIFF = {
  easy:   { beats:40, step:2, eighthMul:0, jumpMul:0,   scoreMul:1.0 },
  medium: { beats:79, step:1, eighthMul:1, jumpMul:1,   scoreMul:1.0 },
  hard:   { beats:79, step:1, eighthMul:1, jumpMul:3.6, scoreMul:1.17 }
};

function sectionAt(f){
  let s = D_SECTIONS[0];
  for (const x of D_SECTIONS) if (f >= x.at) s = x;
  return s;
}

function buildChart(bpm, seed, diff){
  const d = D_DIFF[diff] || D_DIFF.medium;
  const rnd = mulberry32(seed), beat = 60/bpm, notes = [];
  let last = -1;
  for (let b = 0; b < d.beats; b += d.step){
    const s = sectionAt(b / d.beats);
    if (rnd() < s.density){
      let lane = Math.floor(rnd()*4);
      if (lane === last && rnd() < 0.65) lane = (lane + 1 + Math.floor(rnd()*3)) % 4;
      notes.push({ t: b*beat, lane, judged:false }); last = lane;
      // capped: past about half, HARD stops being busy and becomes a wall
      if (rnd() < Math.min(0.5, s.jump * d.jumpMul))
        notes.push({ t: b*beat, lane:(lane + 1 + Math.floor(rnd()*3)) % 4, judged:false });
    }
    if (rnd() < s.eighth * d.eighthMul){
      let lane = Math.floor(rnd()*4);
      if (lane === last) lane = (lane+1) % 4;
      notes.push({ t: (b+0.5)*beat, lane, judged:false }); last = lane;
    }
  }
  notes.sort((a,b)=> a.t - b.t);
  return notes;
}

/* EASY has roughly a third of MEDIUM's arrows and HARD has more, so raw points
   aren't comparable — an easy round would sit at the bottom of the leaderboard
   no matter how well it was played. Every difficulty is scaled to MEDIUM's
   ceiling instead, so the choice costs nothing. */
const D_REF_NOTES = buildChart(D_BPM, D_SEED, "medium").length;

function buildMusic(bpm, seed, totalBeats){
  const rnd = mulberry32(seed ^ 0x9e37), beat = 60/bpm, ev = [];
  // vi - IV - I - V: opens unsettled under the rain, resolves bright by the end
  const chords = [
    { root:110.00, tones:[261.63, 329.63, 440.00, 523.25] },
    { root: 87.31, tones:[261.63, 349.23, 440.00, 523.25] },
    { root:130.81, tones:[261.63, 329.63, 392.00, 523.25] },
    { root: 98.00, tones:[246.94, 293.66, 392.00, 493.88] }
  ];
  for (let b=0; b<totalBeats; b++){
    const ch = chords[Math.floor(b/4) % 4];
    if (b % 2 === 0) ev.push({ t:b*beat, type:"bass", freq:ch.root, dur:0.34, vol:0.34 });
    if (b % 4 === 2) ev.push({ t:b*beat, type:"bass", freq:ch.root*1.5, dur:0.2, vol:0.2 });
    ev.push({ t:b*beat, type:"hat" });
    ev.push({ t:(b+0.5)*beat, type:"hat" });
    if (b >= 8){
      const n = ch.tones[Math.floor(rnd()*ch.tones.length)];
      ev.push({ t:b*beat, type:"lead", freq:n, dur:0.16, vol:0.17 });
      if (b >= 40 && rnd() < 0.55)
        ev.push({ t:(b+0.5)*beat, type:"lead", freq:ch.tones[Math.floor(rnd()*4)]*(rnd()<0.3?2:1), dur:0.12, vol:0.13 });
    }
  }
  ev.sort((a,b)=> a.t - b.t);
  return ev;
}

/* Difficulty chips on the intro screen. Three fixed rectangles so the tap test
   and the drawing can't drift apart — both read from diffRects(). */
const D_CHIP = { w:98, h:34, gap:5 };
function diffRects(y){
  const tot = D_DIFFS.length*D_CHIP.w + (D_DIFFS.length-1)*D_CHIP.gap;
  const x0  = W/2 - tot/2;
  return D_DIFFS.map((k,i)=> ({ k, x: x0 + i*(D_CHIP.w+D_CHIP.gap), y, w:D_CHIP.w, h:D_CHIP.h }));
}
function drawDiffChips(g, y, sel){
  textShadow(g, T("difficulty"), W/2, y - 18, 9, "#836B5C");
  for (const r of diffRects(y)){
    const on = r.k === sel;
    g.fillStyle = on ? "#B33368" : "rgba(90,64,56,.07)";
    g.fillRect(r.x, r.y + 3, r.w, r.h);
    g.fillStyle = on ? "#E4568A" : "#FFFBF4";
    g.fillRect(r.x, r.y, r.w, r.h);
    if (!on){
      g.strokeStyle = "rgba(90,64,56,.30)"; g.lineWidth = 2;
      g.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2);
    }
    const label = T("diff_" + r.k);
    text(g, label, r.x + r.w/2, r.y + r.h/2,
         fitSize(g, label, 10, r.w - 12), on ? "#FFF8FA" : "#836B5C");
  }
}

class DanceGame {
  init(){
    // Always EASY. It used to remember the last pick, which meant one round of
    // HARD and every round after it opened on HARD — including for the next
    // person handed the phone.
    this.diff  = "easy";
    this.chipY = 372;
    this.prepare();

    this.score = 0; this.combo = 0; this.maxCombo = 0;
    this.counts = { perfect:0, great:0, good:0, miss:0 };
    this.flash = [0,0,0,0];
    this.judge = null; this.judgeAge = 0;
    this.parts = new Particles();
    this.time = -3;
    this.begun = false;
    this.shake = 0;

    this.power = 0;   // how well the spell is going, 0..1
    this.clear = 0;   // the sky, easing toward power
    this.rain = [];
    for (let i=0;i<110;i++)
      this.rain.push({ x:rand(-40,W+40), y:rand(-H,H), len:rand(9,20), sp:rand(620,880) });

    Sfx.init(); Sfx.resume();

    Input.down = (x,y) => {
      if (!this.begun){
        // a chip swallows the tap; anywhere else still starts the round
        const hit = diffRects(this.chipY).find(r =>
          x >= r.x && x <= r.x + r.w && y >= r.y - 8 && y <= r.y + r.h + 8);
        if (hit){ this.setDiff(hit.k); return; }
        Sfx.blip(); this.roll(); return;
      }
      this.tap(clamp(Math.floor(x / (W/4)), 0, 3));
    };
    Input.key  = (k) => {
      if (!this.begun){
        const i = D_DIFFS.indexOf(this.diff);
        if (k === "ArrowLeft")  return this.setDiff(D_DIFFS[Math.max(0, i-1)]);
        if (k === "ArrowRight") return this.setDiff(D_DIFFS[Math.min(D_DIFFS.length-1, i+1)]);
        if (k >= "1" && k <= "3") return this.setDiff(D_DIFFS[+k - 1]);
        if (k === " " || k === "Enter") this.roll();
        return;
      }
      const m = { ArrowLeft:0, ArrowDown:1, ArrowUp:2, ArrowRight:3 };
      if (m[k] !== undefined) this.tap(m[k]);
    };
  }

  /* Chart, music and scoring all depend on the difficulty, so they're rebuilt
     together whenever it changes. */
  prepare(){
    const d = D_DIFF[this.diff];
    this.notes = buildChart(D_BPM, D_SEED, this.diff);
    this.total = this.notes.length;
    this.endT  = this.notes[this.notes.length-1].t + 2.6;
    // the music stops with the arrows rather than playing on over an empty screen
    this.music = buildMusic(D_BPM, D_SEED, d.beats + 5);
    this.mi    = 0;
    this.scale = (D_REF_NOTES / Math.max(1, this.total)) * (d.scoreMul || 1);
  }

  setDiff(k){
    if (!D_DIFF[k] || k === this.diff) return;
    this.diff = k;
    this.prepare();
    Sfx.blip();
  }

  /* PLAY pressed: 3s lead-in so the first notes fly in and she can wind up */
  roll(){
    this.begun = true;
    this.audioStart = Sfx.ctx ? Sfx.ctx.currentTime + 3 : 0;
  }

  get songTime(){ return Sfx.ctx ? Sfx.ctx.currentTime - this.audioStart : this.time; }
  get wandX(){ return W/2 + (D_LENA.wandX - 0.5) * (D_LENA.h / D_LENA.aspect); }
  get wandY(){ return D_LENA.feet - D_LENA.h + D_LENA.wandY * D_LENA.h; }

  tap(lane){
    if (this.time < -0.2) return;
    this.flash[lane] = 0.16;
    let best = null, bestDt = 1e9;
    for (const n of this.notes){
      if (n.judged || n.lane !== lane) continue;
      const dt = Math.abs(n.t - this.time);
      if (n.t - this.time > 0.4) break;
      if (dt < bestDt){ bestDt = dt; best = n; }
    }
    if (!best || bestDt > D_WINDOW.good){ Sfx.blip(); return; }
    best.judged = true;
    const cx = D_X0 + lane*D_LANE_W + D_LANE_W/2;
    if (bestDt <= D_WINDOW.perfect)      this.award("perfect", 300, "#E2683A", cx, 22);
    else if (bestDt <= D_WINDOW.great)   this.award("great",   200, "#3A6AA8", cx, 14);
    else                                 this.award("good",    100, "#4A6E3C", cx, 8);
  }

  award(key, base, color, cx, pn){
    this.counts[key]++;
    this.combo++;
    this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.score += (base + Math.min(this.combo, 60) * 2) * this.scale;
    this.power = clamp(this.power + D_POWER[key] * this.scale, 0, 1);
    this.judge = { label:T(key), color }; this.judgeAge = 0;
    this.parts.burst(cx, D_RECEPTOR, pn, { colors:[color,"#FBCB55"], grav:120, maxSpeed:150, minLife:.3, maxLife:.7, size:3 });
    // a matching flick of sparkle off the tip of her wand
    this.parts.burst(this.wandX, this.wandY, Math.max(3, pn>>1), {
      colors:["#FFFDF4","#D9CBEE","#FBCB55"], grav:-30, maxSpeed:90,
      minLife:.5, maxLife:1.1, size:3
    });
    if (key === "perfect") Sfx.perfect(); else if (key === "great") Sfx.great(); else Sfx.good();
  }

  missNote(audible = true){
    this.counts.miss++;
    this.combo = 0;
    this.power = clamp(this.power + D_POWER.miss * this.scale, 0, 1);
    this.judge = { label:T("miss"), color:"#C33A4E" }; this.judgeAge = 0;
    this.shake = 0.18;
    if (audible) Sfx.miss();
  }

  tickMusic(){
    if (!Sfx.ctx) return;
    const now = Sfx.ctx.currentTime, horizon = now + 0.28;
    while (this.mi < this.music.length && this.audioStart + this.music[this.mi].t < horizon){
      const e = this.music[this.mi++];
      const when = this.audioStart + e.t;
      if (when < now) continue;
      if (e.type === "hat") Sfx.noise(0.028, 0.045, when);
      else Sfx.tone(e.freq, e.dur, e.type === "bass" ? "triangle" : "square", e.vol, when);
    }
  }

  update(dt){
    this.parts.update(dt);
    // rain keeps falling on the intro screen too, so the problem is obvious
    const drops = Math.round(110 * (1 - this.clear));
    for (let i=0;i<drops;i++){
      const d = this.rain[i];
      d.y += d.sp * dt; d.x += d.sp * 0.18 * dt;
      if (d.y > H + 20){ d.y = rand(-120,-10); d.x = rand(-60, W+20); }
    }
    if (!this.begun) return;

    // the audio clock is the authority — arrows are positioned from the same
    // number the music is scheduled against, so they can't drift apart. Only if
    // there is no audio at all does it fall back to wall time.
    this.time = Sfx.ctx ? this.songTime : this.time + dt;
    this.tickMusic();
    this.judgeAge += dt;
    this.shake = Math.max(0, this.shake - dt);
    this.clear += (this.power - this.clear) * Math.min(1, dt*2.2);
    for (let i=0;i<4;i++) this.flash[i] = Math.max(0, this.flash[i] - dt);

    /* Returning from a backgrounded tab can put dozens of arrows behind the
       line at once. They all still count as missed, but only the first few make
       a sound — otherwise it's ninety sawtooth blips in a single frame. */
    let heard = 0;
    for (const n of this.notes){
      if (!n.judged && n.t < this.time - D_WINDOW.good){
        n.judged = true; this.missNote(heard++ < 4);
      }
    }
    if (this.time > this.endT) this.finish();
  }

  get won(){ return this.clear > D_WIN_SKY; }

  get weather(){
    const c = this.clear;
    if (c > 0.85) return { title:T("sunCameOut"), line:T("sunCameOutL") };
    if (c > D_WIN_SKY) return { title:T("rainEased"), line:T("rainEasedL") };
    if (c > 0.25) return { title:T("keptRaining"), line:T("keptRainingL") };
    return               { title:T("lenaAlone"),  line:T("lenaAloneL")  };
  }

  finish(){
    const acc = this.total ? (this.counts.perfect + this.counts.great*0.72 + this.counts.good*0.42) / this.total : 0;
    const w = this.weather;
    showResults("spell", Math.round(this.score), {
      won:   this.won,
      title: w.title,
      lead:  w.line,
      stats: [
        [T("statLevel"),    T("diff_" + this.diff)],
        [T("statAccuracy"), Math.round(acc*100) + "%"],
        [T("statCombo"),    this.maxCombo]
      ],
      meta: { level: this.diff, acc: Math.round(acc*100), combo: this.maxCombo,
              sky: Math.round(this.clear*100), ...this.counts }
    });
  }

  pause(){}
  destroy(){}

  /* ---------- scenery ---------- */
  drawSky(g){
    const c = this.clear;
    // no horizon in this game — open sky top to bottom, nothing to read but the arrows
    const grad = g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, mixHex(SKY_WET.top, SKY_CLEAR.top, c));
    grad.addColorStop(1, mixHex(SKY_WET.bot, SKY_CLEAR.bot, c));
    g.fillStyle = grad; g.fillRect(0,0,W,H);

    // sun burns through as the spell takes hold
    const sun = clamp((c - 0.35)/0.5, 0, 1);
    if (sun > 0){
      g.globalAlpha = sun*0.30; g.fillStyle = "#FBCB55";
      g.beginPath(); g.arc(40, 104, 46, 0, 6.3); g.fill();
      g.globalAlpha = sun*0.75;
      g.beginPath(); g.arc(40, 104, 20, 0, 6.3); g.fill();
      g.globalAlpha = 1;
    }
    // and a rainbow once it's properly clear
    if (c > 0.80){
      const a = (c - 0.80)/0.20;
      const bands = ["#EE7FA0","#E2683A","#FBCB55","#7FA36A","#6E9BD8","#A98BA0"];
      g.lineWidth = 5;
      bands.forEach((col,i)=>{
        g.globalAlpha = a*0.34; g.strokeStyle = col;
        g.beginPath(); g.arc(180, 430, 250 - i*5, Math.PI*1.12, Math.PI*1.88); g.stroke();
      });
      g.globalAlpha = 1;
    }
  }

  drawRain(g){
    const drops = Math.round(110 * (1 - this.clear));
    if (!drops) return;
    // thin, fast and pale so it never competes with the arrows for attention
    g.strokeStyle = "rgba(110,155,216,.34)"; g.lineWidth = 1;
    g.beginPath();
    for (let i=0;i<drops;i++){
      const d = this.rain[i];
      g.moveTo(d.x, d.y); g.lineTo(d.x - d.len*0.18, d.y - d.len);
    }
    g.stroke();
  }

  drawLena(g, t){
    const h = D_LENA.h, w = h / D_LENA.aspect;
    const bob = Math.sin(t*2.2) * 3;
    const x = W/2 - w/2, y = D_LENA.feet - h + bob;
    // one soft shadow so she isn't floating now the scenery is gone
    g.globalAlpha = 0.10; g.fillStyle = "#5A4038";
    g.beginPath(); g.ellipse(W/2, D_LENA.feet + 2, w*0.30, 4, 0, 0, 6.3); g.fill();
    g.globalAlpha = 1;
    // her aura brightens with the spell
    if (this.clear > 0.05){
      g.globalAlpha = this.clear*0.22; g.fillStyle = "#FBCB55";
      g.beginPath(); g.arc(W/2, D_LENA.feet - h*0.55 + bob, h*0.42, 0, 6.3); g.fill();
      g.globalAlpha = 1;
    }
    if (LENA_ART.ready){
      g.drawImage(LENA_ART.img, x, y, w, h);
    } else {
      g.fillStyle = "#8A4B2A"; g.fillRect(W/2-13, y+22, 26, 20);
      g.fillStyle = "#F2D9C4"; g.fillRect(W/2-11, y+38, 22, 20);
      g.fillStyle = "#2F5C60"; g.fillRect(W/2-18, y+58, 36, h-58);
      g.strokeStyle = "#5A4038"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(W/2-14, y+62); g.lineTo(this.wandX, this.wandY); g.stroke();
      g.fillStyle = "#FFFDF4"; g.fillRect(this.wandX-4, this.wandY-4, 8, 8);
    }
  }

  draw(g){
    const t = Math.max(0, this.time);
    g.save();
    if (this.shake > 0) g.translate(rand(-3,3)*this.shake*5, rand(-3,3)*this.shake*5);

    this.drawSky(g);

    // lanes, washed over the scene so the arrows stay readable
    for (let i=0;i<4;i++){
      const x = D_X0 + i*D_LANE_W;
      g.fillStyle = i%2 ? "rgba(255,255,255,.42)" : "rgba(255,255,255,.66)";
      g.fillRect(x, 0, D_LANE_W, H);
      if (this.flash[i] > 0){
        g.globalAlpha = this.flash[i]*3;
        g.fillStyle = D_COLORS[i]; g.fillRect(x, D_RECEPTOR-140, D_LANE_W, 180);
        g.globalAlpha = 1;
      }
    }
    this.drawRain(g);

    g.fillStyle = "rgba(90,64,56,.08)"; g.fillRect(D_X0, D_RECEPTOR-30, D_LANE_W*4, 60);
    g.fillStyle = "rgba(90,64,56,.18)"; g.fillRect(D_X0, D_RECEPTOR-30, D_LANE_W*4, 2);
    g.fillStyle = "rgba(90,64,56,.18)"; g.fillRect(D_X0, D_RECEPTOR+28, D_LANE_W*4, 2);

    for (let i=0;i<4;i++){
      const cx = D_X0 + i*D_LANE_W + D_LANE_W/2;
      const pulse = this.flash[i] > 0 ? 1.18 : 1;
      drawArrow(g, cx, D_RECEPTOR, 21*pulse, i, this.flash[i] > 0 ? D_COLORS[i] : "rgba(90,64,56,.28)", true);
    }

    // after the lane wash so she stays crisp, before the notes so they fall past her
    this.drawLena(g, t);

    for (const n of this.notes){
      if (n.judged) continue;
      const y = D_RECEPTOR - (n.t - this.time) * D_SPEED;
      if (y < -40 || y > H+40) continue;
      const cx = D_X0 + n.lane*D_LANE_W + D_LANE_W/2;
      drawArrow(g, cx, y, 21, n.lane, D_COLORS[n.lane], false);
    }

    this.parts.draw(g);

    // HUD
    g.fillStyle = "rgba(255,251,244,.86)"; g.fillRect(0,0,W,62);
    textShadow(g, fmt(Math.round(this.score)), W/2, 24, 17, "#E2683A");
    if (this.combo >= 3){
      const p = 1 + Math.max(0, 0.25 - this.judgeAge)*1.2;
      textShadow(g, T("combo", { n:this.combo }), W/2, 320, 15*p, "#96203C");
    }
    // song progress on the left, how clear the sky is on the right
    const prog = clamp(this.time / this.endT, 0, 1);
    g.fillStyle = "rgba(90,64,56,.12)"; g.fillRect(24, 46, 140, 5);
    g.fillStyle = "#A18A7B";            g.fillRect(24, 46, 140*prog, 5);
    g.fillStyle = "rgba(90,64,56,.12)"; g.fillRect(W-164, 46, 140, 5);
    g.fillStyle = this.clear > 0.8 ? "#FBCB55" : this.clear > 0.5 ? "#7FA36A" : "#6E9BD8";
    g.fillRect(W-164, 46, 140*this.clear, 5);
    textShadow(g, T("sky"), W-24, 38, 7, "#836B5C", "right");

    if (this.judge && this.judgeAge < 0.55){
      const a = 1 - this.judgeAge/0.55;
      g.globalAlpha = a;
      textShadow(g, this.judge.label, W/2, 386 - (1-a)*16, 18, this.judge.color);
      g.globalAlpha = 1;
    }

    if (!this.begun || this.time < 0){
      g.fillStyle = "rgba(255,251,244,.90)"; g.fillRect(0,0,W,H);
      textShadow(g, T("spellName"), W/2, 150, 16, "#96203C");
      let yy = paragraph(g, TK("spellHow","spellHowKeys"), W/2, 224, 13, "#3A6AA8", W-48);
      if (!this.begun){
        // chips first, then the button below them — both follow the copy, which
        // runs to different lengths in each language
        this.chipY = clamp(yy + 26, 340, H - 168);
        drawDiffChips(g, this.chipY, this.diff);
        playButton(g, this.chipY + D_CHIP.h - 6, t);
      } else {
        const n = Math.ceil(-this.time);
        textShadow(g, n > 0 ? String(n) : T("go"), W/2, 436, 44, "#E2683A");
      }
    }
    g.restore();
  }
}

registerGame({
  id:"spell", icon:"&#10024;",
  nameKey:"spellName", shortKey:"spellShort", blurbKey:"spellBlurb",
  make:()=> new DanceGame()
