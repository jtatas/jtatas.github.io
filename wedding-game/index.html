<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Max & Julie's Wedding Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#F4A7BB;--gold:#D4AF37;--cream:#FFF8E7;--sage:#8FA67A;--sky:#A8C4D4;--choco:#4A4238;--white:#FFFDF7}
body{background:var(--cream);font-family:'DM Sans',sans-serif;overflow:hidden;height:100dvh;width:100vw;display:flex;justify-content:center;align-items:center;color:var(--choco)}
#app{width:100%;max-width:500px;height:100dvh;position:relative;overflow:hidden;background:var(--cream)}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.screen.active{opacity:1;pointer-events:auto}
.screen.canvas-screen{pointer-events:none!important;background:transparent!important}
canvas#gameCanvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pixel-font{font-family:'Press Start 2P',monospace}
.btn{font-family:'Press Start 2P',monospace;border:none;cursor:pointer;padding:14px 28px;font-size:12px;border-radius:8px;color:var(--white);min-height:48px;touch-action:manipulation;position:relative;overflow:hidden;transition:transform .1s,box-shadow .1s}
.btn:active{transform:scale(.95)}
.btn-pink{background:var(--pink);box-shadow:0 4px 0 #c4788a}
.btn-gold{background:var(--gold);box-shadow:0 4px 0 #a48a2a;color:var(--choco)}
.btn-sage{background:var(--sage);box-shadow:0 4px 0 #6b7f5a}
.btn-pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.dialog-box{background:var(--white);border:4px solid var(--choco);border-radius:12px;padding:16px;margin:12px;font-size:14px;line-height:1.6;max-width:90%;text-align:left}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay-box{background:var(--cream);border:4px solid var(--gold);border-radius:16px;padding:24px;text-align:center;max-width:90%}
#charCreator{padding:10px;overflow-y:auto}
#charCreator .cat-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
#charCreator .cat-btn{width:44px;height:44px;border-radius:50%;border:3px solid var(--choco);background:var(--cream);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#charCreator .cat-label{font-family:'Press Start 2P',monospace;font-size:9px;min-width:80px;text-align:center}
.tab-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tab-btn{padding:8px 10px;font-size:8px;border-radius:6px;border:2px solid var(--choco);background:var(--cream);cursor:pointer;font-family:'Press Start 2P',monospace;min-height:36px}
.tab-btn.active{background:var(--pink);color:var(--white)}
input[type="text"]{font-family:'DM Sans',sans-serif;font-size:16px;padding:10px 14px;border:3px solid var(--choco);border-radius:8px;background:var(--white);width:80%;max-width:280px;text-align:center;outline:none}
input[type="text"]:focus{border-color:var(--pink)}
.ddr-controls{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:center;gap:6px;padding:10px;z-index:30;background:rgba(0,0,0,.3)}
.ddr-btn{width:72px;height:72px;border-radius:12px;border:3px solid rgba(255,255,255,.5);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:background .05s}
.leaderboard{width:90%;max-width:360px;margin:12px auto;text-align:left}
.lb-row{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;font-size:13px;margin:2px 0}
.lb-row.highlight{background:var(--gold);color:var(--choco);font-weight:700}
.lb-row.normal{background:rgba(0,0,0,.05)}
.score-countup{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--gold)}
</style>
</head>
<body>
<div id="app">
<canvas id="gameCanvas"></canvas>
<div id="screenWelcome" class="screen active canvas-screen"></div>
<div id="screenCharCreator" class="screen" id="charCreator"></div>
<div id="screenStoryIntro" class="screen canvas-screen"></div>
<div id="screenGame1" class="screen canvas-screen"></div>
<div id="screenStormTransition" class="screen canvas-screen"></div>
<div id="screenWitchIntro" class="screen canvas-screen"></div>
<div id="screenGame2" class="screen"></div>
<div id="screenClearSkies" class="screen canvas-screen"></div>
<div id="screenGame3" class="screen canvas-screen"></div>
<div id="screenFinale" class="screen"></div>
</div>

<script>
'use strict';
// ===== GLOBALS =====
const C = document.getElementById('gameCanvas');
const ctx = C.getContext('2d');
const app = document.getElementById('app');
let W, H, scale;
const PINK='#F4A7BB',GOLD='#D4AF37',CREAM='#FFF8E7',SAGE='#8FA67A',SKY='#A8C4D4',CHOCO='#4A4238',WHITE='#FFFDF7';
const DPINK='#c4788a',DGOLD='#a48a2a';

let currentScreen = 'welcome';
let playerName = 'Guest';
let avatar = {hair:0,top:0,bottom:0,shoes:0,acc:0};
let scores = {game1:0,game2:0,game2combo:0,game3:0};
let animId = null;
let gameState = null;

function resize(){
  const r = window.devicePixelRatio||1;
  const aw = app.clientWidth, ah = app.clientHeight;
  C.width = aw * r; C.height = ah * r;
  C.style.width = aw+'px'; C.style.height = ah+'px';
  ctx.setTransform(r,0,0,r,0,0);
  W = aw; H = ah;
  scale = W/500;
}
window.addEventListener('resize',resize);
resize();

// ===== DRAWING HELPERS =====
function drawRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawPixelRect(x,y,w,h,c,s=1){ctx.fillStyle=c;ctx.fillRect(x,y,w*s,h*s);}
function drawCircle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function drawText(txt,x,y,size,color,font='Press Start 2P',align='center'){
  ctx.fillStyle=color;ctx.font=size+'px '+font;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(txt,x,y);
}
function drawPixelHeart(cx,cy,s,c){
  ctx.fillStyle=c;
  const p=[[0,-2],[1,-3],[2,-3],[3,-2],[3,-1],[0,2],[-3,-1],[-3,-2],[-2,-3],[-1,-3]];
  const f=[[-2,-2],[-1,-2],[1,-2],[2,-2],[-3,-1],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],[3,-1],
    [-2,0],[-1,0],[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]];
  f.forEach(([px,py])=>ctx.fillRect(cx+px*s,cy+py*s,s,s));
}
function drawStar(cx,cy,r,c){
  ctx.fillStyle=c;ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(cx+r*Math.cos(i*4*Math.PI/5-Math.PI/2),cy+r*Math.sin(i*4*Math.PI/5-Math.PI/2));
    ctx.lineTo(cx+r*.4*Math.cos(i*4*Math.PI/5-Math.PI/2+2*Math.PI/5),cy+r*.4*Math.sin(i*4*Math.PI/5-Math.PI/2+2*Math.PI/5));
  }
  ctx.closePath();ctx.fill();
}

// ===== PARTICLE SYSTEM =====
class Particle{
  constructor(x,y,vx,vy,life,color,size=3,gravity=0){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=life;this.maxLife=life;this.color=color;this.size=size;this.gravity=gravity;this.dead=false;
  }
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=this.gravity*dt;this.life-=dt;
    if(this.life<=0)this.dead=true;
  }
  draw(){
    const a=Math.max(0,this.life/this.maxLife);
    ctx.globalAlpha=a;
    ctx.fillStyle=this.color;
    ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    ctx.globalAlpha=1;
  }
}
let particles=[];
function addParticle(x,y,vx,vy,life,color,size=3,gravity=0){
  particles.push(new Particle(x,y,vx,vy,life,color,size,gravity));
}
function updateParticles(dt){
  particles.forEach(p=>p.update(dt));
  particles=particles.filter(p=>!p.dead);
}
function drawParticles(){particles.forEach(p=>p.draw());}
function burstParticles(x,y,count,colors,spread=100,life=1,size=3,gravity=0){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*spread;
    addParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,life+Math.random()*.5,colors[i%colors.length],size,gravity);
  }
}

// ===== AVATAR DRAWING =====
const HAIR_COLORS=['#4A3728','#8B6914','#2C1810','#C94C4C','#1A1A2E','#E8B960','#D2691E','#FF69B4'];
const SKIN='#FDBCB4';
const HAIR_NAMES=['Short','Long','Curly','Bun','Mohawk','Bob','Wavy','Pixie'];
const TOP_NAMES=['Suit Jacket','Bridesmaid','Hawaiian','Tux Vest','Floral','Hoodie','Crop Top'];
const TOP_COLORS=[CHOCO,'#E8A0BF','#FF6B35',CHOCO,'#C9E4CA','#7B8794',PINK];
const BOT_NAMES=['Dress Pants','Long Skirt','Shorts','Gown','Jeans','Mini Skirt'];
const BOT_COLORS=[CHOCO,'#E8A0BF','#C9B896','#F0E6D3','#4A6FA5',PINK];
const SHOE_NAMES=['Dress Shoes','Heels','Sneakers','Boots','Sandals','Cowboy'];
const SHOE_COLORS=[CHOCO,'#C94C4C','#FFFFFF','#5C3A21','#D4A574','#8B4513'];
const ACC_NAMES=['None','Bow Tie','Necklace','Sunglasses','Flower Crown','Top Hat','Tiara','Party Hat'];

function drawAvatar(cx,cy,s,av,flip=false){
  // s = pixel size (e.g., 4 for 4x scale)
  const ps=s;
  ctx.save();
  if(flip){ctx.translate(cx,cy);ctx.scale(-1,1);cx=0;cy=0;}
  
  // Body base - skin
  // Head (8x8 pixels)
  const hx=cx-4*ps, hy=cy-28*ps;
  drawRect(hx+ps,hy,6*ps,7*ps,SKIN);
  drawRect(hx,hy+ps,8*ps,5*ps,SKIN);
  
  // Eyes
  drawRect(hx+2*ps,hy+3*ps,ps,ps,CHOCO);
  drawRect(hx+5*ps,hy+3*ps,ps,ps,CHOCO);
  // Mouth
  drawRect(hx+3*ps,hy+5*ps,2*ps,ps,'#E88B8B');
  
  // Hair
  const hc=HAIR_COLORS[av.hair%HAIR_COLORS.length];
  switch(av.hair%8){
    case 0: // Short
      drawRect(hx,hy-ps,8*ps,3*ps,hc);
      drawRect(hx-ps,hy,ps,3*ps,hc);
      drawRect(hx+8*ps,hy,ps,3*ps,hc);
      break;
    case 1: // Long
      drawRect(hx,hy-ps,8*ps,3*ps,hc);
      drawRect(hx-ps,hy-ps,ps,12*ps,hc);
      drawRect(hx+8*ps,hy-ps,ps,12*ps,hc);
      break;
    case 2: // Curly
      drawRect(hx-ps,hy-ps,10*ps,3*ps,hc);
      drawRect(hx-2*ps,hy,2*ps,8*ps,hc);
      drawRect(hx+8*ps,hy,2*ps,8*ps,hc);
      drawRect(hx,hy-2*ps,8*ps,ps,hc);
      break;
    case 3: // Bun
      drawRect(hx+ps,hy-ps,6*ps,2*ps,hc);
      drawRect(hx+2*ps,hy-3*ps,4*ps,3*ps,hc);
      break;
    case 4: // Mohawk
      drawRect(hx+3*ps,hy-4*ps,2*ps,5*ps,hc);
      drawRect(hx+2*ps,hy-2*ps,4*ps,3*ps,hc);
      break;
    case 5: // Bob
      drawRect(hx,hy-ps,8*ps,3*ps,hc);
      drawRect(hx-ps,hy,ps,6*ps,hc);
      drawRect(hx+8*ps,hy,ps,6*ps,hc);
      break;
    case 6: // Wavy
      drawRect(hx,hy-ps,8*ps,2*ps,hc);
      drawRect(hx-ps,hy-ps,ps,10*ps,hc);
      drawRect(hx+8*ps,hy-ps,ps,10*ps,hc);
      drawRect(hx-2*ps,hy+4*ps,ps,3*ps,hc);
      drawRect(hx+9*ps,hy+4*ps,ps,3*ps,hc);
      break;
    case 7: // Pixie
      drawRect(hx+ps,hy-ps,6*ps,2*ps,hc);
      drawRect(hx-ps,hy,2*ps,3*ps,hc);
      break;
  }
  
  // Torso (6x6)
  const tx=cx-3*ps, ty=cy-20*ps;
  const tc=TOP_COLORS[av.top%TOP_COLORS.length];
  switch(av.top%7){
    case 0: // Suit jacket
      drawRect(tx-ps,ty,8*ps,7*ps,tc);
      drawRect(tx+2*ps,ty,2*ps,7*ps,'#FFFFFF');
      break;
    case 1: // Bridesmaid dress top
      drawRect(tx,ty,6*ps,7*ps,tc);
      drawRect(tx+ps,ty-ps,4*ps,ps,tc);
      break;
    case 2: // Hawaiian
      drawRect(tx-ps,ty,8*ps,7*ps,tc);
      drawRect(tx+ps,ty+2*ps,ps,ps,'#FFE066');
      drawRect(tx+4*ps,ty+ps,ps,ps,'#90EE90');
      drawRect(tx+2*ps,ty+4*ps,ps,ps,'#FFE066');
      break;
    case 3: // Tux vest
      drawRect(tx-ps,ty,8*ps,7*ps,'#FFFFFF');
      drawRect(tx+ps,ty,4*ps,7*ps,tc);
      break;
    case 4: // Floral blouse
      drawRect(tx,ty,6*ps,7*ps,tc);
      drawRect(tx+ps,ty+ps,ps,ps,PINK);
      drawRect(tx+4*ps,ty+3*ps,ps,ps,PINK);
      drawRect(tx+2*ps,ty+5*ps,ps,ps,'#FFB6C1');
      break;
    case 5: // Hoodie
      drawRect(tx-ps,ty,8*ps,7*ps,tc);
      drawRect(tx+ps,ty+3*ps,4*ps,3*ps,'#6B7A8D');
      break;
    case 6: // Crop top
      drawRect(tx,ty,6*ps,5*ps,tc);
      drawRect(tx,ty+5*ps,6*ps,2*ps,SKIN);
      break;
  }
  // Arms
  drawRect(tx-2*ps,ty+ps,ps,5*ps,SKIN);
  drawRect(tx+7*ps,ty+ps,ps,5*ps,SKIN);
  
  // Bottom (6x6)
  const bx=cx-3*ps, by=cy-13*ps;
  const bc=BOT_COLORS[av.bottom%BOT_COLORS.length];
  switch(av.bottom%6){
    case 0: // Dress pants
      drawRect(bx,by,6*ps,7*ps,bc);
      drawRect(bx+3*ps,by+2*ps,ps,5*ps,CREAM);
      break;
    case 1: // Long skirt
      drawRect(bx-ps,by,8*ps,8*ps,bc);
      drawRect(bx-2*ps,by+5*ps,10*ps,3*ps,bc);
      break;
    case 2: // Shorts
      drawRect(bx,by,6*ps,4*ps,bc);
      drawRect(bx,by+4*ps,6*ps,3*ps,SKIN);
      break;
    case 3: // Gown
      drawRect(bx-2*ps,by,10*ps,9*ps,bc);
      drawRect(bx-3*ps,by+6*ps,12*ps,3*ps,bc);
      break;
    case 4: // Jeans
      drawRect(bx,by,6*ps,7*ps,bc);
      drawRect(bx+3*ps,by+2*ps,ps,5*ps,'#5A7FBF');
      break;
    case 5: // Mini skirt
      drawRect(bx,by,6*ps,4*ps,bc);
      drawRect(bx,by+4*ps,6*ps,3*ps,SKIN);
      break;
  }
  
  // Shoes (6x2)
  const sx=cx-3*ps, sy=cy-5*ps;
  const sc=SHOE_COLORS[av.shoes%SHOE_COLORS.length];
  switch(av.shoes%6){
    case 0: // Dress shoes
      drawRect(sx-ps,sy,3*ps,2*ps,sc);
      drawRect(sx+4*ps,sy,3*ps,2*ps,sc);
      break;
    case 1: // Heels
      drawRect(sx-ps,sy,3*ps,ps,sc);
      drawRect(sx+4*ps,sy,3*ps,ps,sc);
      drawRect(sx,sy+ps,ps,ps,sc);
      drawRect(sx+5*ps,sy+ps,ps,ps,sc);
      break;
    case 2: // Sneakers
      drawRect(sx-ps,sy,3*ps,2*ps,sc);
      drawRect(sx+4*ps,sy,3*ps,2*ps,sc);
      drawRect(sx-ps,sy,ps,ps,'#FF0000');
      drawRect(sx+6*ps,sy,ps,ps,'#FF0000');
      break;
    case 3: // Boots
      drawRect(sx-ps,sy-ps,3*ps,3*ps,sc);
      drawRect(sx+4*ps,sy-ps,3*ps,3*ps,sc);
      break;
    case 4: // Sandals
      drawRect(sx,sy+ps,2*ps,ps,sc);
      drawRect(sx+4*ps,sy+ps,2*ps,ps,sc);
      break;
    case 5: // Cowboy boots
      drawRect(sx-ps,sy-2*ps,3*ps,4*ps,sc);
      drawRect(sx+4*ps,sy-2*ps,3*ps,4*ps,sc);
      drawRect(sx-2*ps,sy+ps,ps,ps,sc);
      drawRect(sx+7*ps,sy+ps,ps,ps,sc);
      break;
  }
  
  // Accessories
  switch(av.acc%8){
    case 0: break; // None
    case 1: // Bow tie
      drawRect(cx-2*ps,ty-ps,4*ps,2*ps,'#C94C4C');
      drawRect(cx-ps,ty-ps+Math.floor(ps/2),2*ps,ps,CHOCO);
      break;
    case 2: // Necklace
      drawRect(cx-2*ps,ty+ps,4*ps,ps,GOLD);
      drawRect(cx-ps,ty+2*ps,2*ps,ps,GOLD);
      break;
    case 3: // Sunglasses
      drawRect(hx+ps,hy+2*ps,2*ps,2*ps,'#1a1a2e');
      drawRect(hx+5*ps,hy+2*ps,2*ps,2*ps,'#1a1a2e');
      drawRect(hx+3*ps,hy+3*ps,2*ps,ps,'#1a1a2e');
      break;
    case 4: // Flower crown
      drawRect(hx,hy-2*ps,8*ps,ps,SAGE);
      drawRect(hx+ps,hy-3*ps,ps,ps,PINK);
      drawRect(hx+3*ps,hy-3*ps,ps,ps,'#FFE066');
      drawRect(hx+5*ps,hy-3*ps,ps,ps,PINK);
      drawRect(hx+7*ps,hy-3*ps,ps,ps,'#FFE066');
      break;
    case 5: // Top hat
      drawRect(hx,hy-2*ps,8*ps,ps,CHOCO);
      drawRect(hx+ps,hy-6*ps,6*ps,4*ps,CHOCO);
      drawRect(hx+ps,hy-3*ps,6*ps,ps,GOLD);
      break;
    case 6: // Tiara
      drawRect(hx+ps,hy-2*ps,6*ps,ps,GOLD);
      drawRect(hx+3*ps,hy-4*ps,2*ps,2*ps,GOLD);
      drawRect(hx+2*ps,hy-3*ps,ps,ps,SKY);
      drawRect(hx+5*ps,hy-3*ps,ps,ps,SKY);
      break;
    case 7: // Party hat
      drawRect(hx+2*ps,hy-5*ps,4*ps,ps,'#FF6B6B');
      drawRect(hx+3*ps,hy-7*ps,2*ps,2*ps,'#FF6B6B');
      drawRect(hx+3.5*ps,hy-8*ps,ps,ps,'#FFE066');
      drawRect(hx+ps,hy-ps,6*ps,ps,'#4ECDC4');
      break;
  }
  
  ctx.restore();
}

function drawMiniAvatar(cx,cy,s,av){drawAvatar(cx,cy,s,av);}

// ===== SCREEN MANAGEMENT =====
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');});
  const el=document.getElementById('screen'+name.charAt(0).toUpperCase()+name.slice(1));
  if(el)el.classList.add('active');
  currentScreen=name;
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

// ===== SCREEN: WELCOME =====
function initWelcome(){
  const scr=document.getElementById('screenWelcome');
  scr.innerHTML='';
  // Canvas will draw the welcome animation
  showScreen('welcome');
  let t=0;
  function loop(){
    if(currentScreen!=='welcome')return;
    t+=0.016;
    ctx.clearRect(0,0,W,H);
    // Gradient background
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,CREAM);grd.addColorStop(1,'#FFE8EE');
    drawRect(0,0,W,H,grd);
    
    // Stars
    for(let i=0;i<12;i++){
      const sx=((i*73+t*20)%W);
      const sy=50+((i*47)%150);
      const ss=2+Math.sin(t*2+i)*1;
      drawStar(sx,sy,ss*scale,GOLD);
    }
    
    // Pixel art venue outline
    const vy=H*0.45;
    drawRect(W*0.2,vy,W*0.6,H*0.3,WHITE);
    drawRect(W*0.2,vy,W*0.6,4,CHOCO);
    drawRect(W*0.2,vy,4,H*0.3,CHOCO);
    drawRect(W*0.8-4,vy,4,H*0.3,CHOCO);
    // Roof
    ctx.fillStyle=PINK;
    ctx.beginPath();ctx.moveTo(W*0.15,vy);ctx.lineTo(W*0.5,vy-60*scale);ctx.lineTo(W*0.85,vy);ctx.closePath();ctx.fill();
    // Door
    drawRect(W*0.43,vy+H*0.15,W*0.14,H*0.15,CHOCO);
    drawRect(W*0.45,vy+H*0.17,W*0.1,H*0.13,'#8B6914');
    // Windows
    drawRect(W*0.26,vy+H*0.08,W*0.1,H*0.08,SKY);
    drawRect(W*0.64,vy+H*0.08,W*0.1,H*0.08,SKY);
    // Cross on top
    drawRect(W*0.49,vy-65*scale,W*0.02,15*scale,GOLD);
    drawRect(W*0.46,vy-58*scale,W*0.08,4*scale,GOLD);
    
    // Animated hearts
    for(let i=0;i<6;i++){
      const hx=W*0.15+i*(W*0.7/5);
      const hy=H*0.15+Math.sin(t*1.5+i*1.2)*15;
      drawPixelHeart(hx,hy,3*scale,i%2===0?PINK:GOLD);
    }
    
    // Title
    const ts=Math.min(16*scale,20);
    drawText("Max & Julie's",W/2,H*0.08,ts,CHOCO,'Press Start 2P');
    drawText("Wedding Arcade",W/2,H*0.08+ts*1.8,ts,PINK,'Press Start 2P');
    
    // Tap to start (pulsing)
    const pa=0.7+Math.sin(t*3)*0.3;
    ctx.globalAlpha=pa;
    drawText("Tap to Start",W/2,H*0.85,12*scale,CHOCO,'Press Start 2P');
    ctx.globalAlpha=1;

    drawPixelHeart(W*0.25,H*0.85,2*scale,PINK);
    drawPixelHeart(W*0.75,H*0.85,2*scale,PINK);
    
    animId=requestAnimationFrame(loop);
  }
  loop();
  
  const clickHandler=()=>{
    C.removeEventListener('click',clickHandler);
    C.removeEventListener('touchstart',touchHandler);

  };

}

      render();
    });
    document.getElementById('nextBtn').addEventListener('click',()=>{
      avatar[cats[cat].key]=(avatar[cats[cat].key]+1)%cats[cat].opts.length;
      render();
    });

function drawAvatarOnCanvas(canvas,c,cx,cy,s,av){
  // Replicate avatar drawing on a specific canvas context
  const ps=s;
  // Head
  const hx=cx-4*ps, hy=cy-28*ps;
  c.fillStyle=SKIN;c.fillRect(hx+ps,hy,6*ps,7*ps);c.fillRect(hx,hy+ps,8*ps,5*ps);
  c.fillStyle=CHOCO;c.fillRect(hx+2*ps,hy+3*ps,ps,ps);c.fillRect(hx+5*ps,hy+3*ps,ps,ps);
  c.fillStyle='#E88B8B';c.fillRect(hx+3*ps,hy+5*ps,2*ps,ps);
  
  const hc=HAIR_COLORS[av.hair%HAIR_COLORS.length];
  c.fillStyle=hc;
  switch(av.hair%8){
    case 0:c.fillRect(hx,hy-ps,8*ps,3*ps);c.fillRect(hx-ps,hy,ps,3*ps);c.fillRect(hx+8*ps,hy,ps,3*ps);break;
    case 1:c.fillRect(hx,hy-ps,8*ps,3*ps);c.fillRect(hx-ps,hy-ps,ps,12*ps);c.fillRect(hx+8*ps,hy-ps,ps,12*ps);break;
    case 2:c.fillRect(hx-ps,hy-ps,10*ps,3*ps);c.fillRect(hx-2*ps,hy,2*ps,8*ps);c.fillRect(hx+8*ps,hy,2*ps,8*ps);c.fillRect(hx,hy-2*ps,8*ps,ps);break;
    case 3:c.fillRect(hx+ps,hy-ps,6*ps,2*ps);c.fillRect(hx+2*ps,hy-3*ps,4*ps,3*ps);break;
    case 4:c.fillRect(hx+3*ps,hy-4*ps,2*ps,5*ps);c.fillRect(hx+2*ps,hy-2*ps,4*ps,3*ps);break;
    case 5:c.fillRect(hx,hy-ps,8*ps,3*ps);c.fillRect(hx-ps,hy,ps,6*ps);c.fillRect(hx+8*ps,hy,ps,6*ps);break;
    case 6:c.fillRect(hx,hy-ps,8*ps,2*ps);c.fillRect(hx-ps,hy-ps,ps,10*ps);c.fillRect(hx+8*ps,hy-ps,ps,10*ps);break;
    case 7:c.fillRect(hx+ps,hy-ps,6*ps,2*ps);c.fillRect(hx-ps,hy,2*ps,3*ps);break;
  }
  
  const tx=cx-3*ps, ty=cy-20*ps;
  const tc=TOP_COLORS[av.top%TOP_COLORS.length];
  c.fillStyle=tc;
  switch(av.top%7){
    case 0:c.fillRect(tx-ps,ty,8*ps,7*ps);c.fillStyle='#FFF';c.fillRect(tx+2*ps,ty,2*ps,7*ps);break;
    case 1:c.fillRect(tx,ty,6*ps,7*ps);c.fillRect(tx+ps,ty-ps,4*ps,ps);break;
    case 2:c.fillRect(tx-ps,ty,8*ps,7*ps);c.fillStyle='#FFE066';c.fillRect(tx+ps,ty+2*ps,ps,ps);c.fillStyle='#90EE90';c.fillRect(tx+4*ps,ty+ps,ps,ps);break;
    case 3:c.fillStyle='#FFF';c.fillRect(tx-ps,ty,8*ps,7*ps);c.fillStyle=tc;c.fillRect(tx+ps,ty,4*ps,7*ps);break;
    case 4:c.fillRect(tx,ty,6*ps,7*ps);c.fillStyle=PINK;c.fillRect(tx+ps,ty+ps,ps,ps);c.fillRect(tx+4*ps,ty+3*ps,ps,ps);break;
    case 5:c.fillRect(tx-ps,ty,8*ps,7*ps);c.fillStyle='#6B7A8D';c.fillRect(tx+ps,ty+3*ps,4*ps,3*ps);break;
    case 6:c.fillRect(tx,ty,6*ps,5*ps);c.fillStyle=SKIN;c.fillRect(tx,ty+5*ps,6*ps,2*ps);break;
  }
  c.fillStyle=SKIN;c.fillRect(tx-2*ps,ty+ps,ps,5*ps);c.fillRect(tx+7*ps,ty+ps,ps,5*ps);
  
  const bx=cx-3*ps, by=cy-13*ps;
  const bc=BOT_COLORS[av.bottom%BOT_COLORS.length];
  c.fillStyle=bc;
  switch(av.bottom%6){
    case 0:c.fillRect(bx,by,6*ps,7*ps);c.fillStyle=CREAM;c.fillRect(bx+3*ps,by+2*ps,ps,5*ps);break;
    case 1:c.fillRect(bx-ps,by,8*ps,8*ps);c.fillRect(bx-2*ps,by+5*ps,10*ps,3*ps);break;
    case 2:c.fillRect(bx,by,6*ps,4*ps);c.fillStyle=SKIN;c.fillRect(bx,by+4*ps,6*ps,3*ps);break;
    case 3:c.fillRect(bx-2*ps,by,10*ps,9*ps);c.fillRect(bx-3*ps,by+6*ps,12*ps,3*ps);break;
    case 4:c.fillRect(bx,by,6*ps,7*ps);break;
    case 5:c.fillRect(bx,by,6*ps,4*ps);c.fillStyle=SKIN;c.fillRect(bx,by+4*ps,6*ps,3*ps);break;
  }
  
  const sx=cx-3*ps, sy=cy-5*ps;
  const sc=SHOE_COLORS[av.shoes%SHOE_COLORS.length];
  c.fillStyle=sc;
  c.fillRect(sx-ps,sy,3*ps,2*ps);c.fillRect(sx+4*ps,sy,3*ps,2*ps);
  
  // Accessory
  switch(av.acc%8){
    case 1:c.fillStyle='#C94C4C';c.fillRect(cx-2*ps,ty-ps,4*ps,2*ps);break;
    case 2:c.fillStyle=GOLD;c.fillRect(cx-2*ps,ty+ps,4*ps,ps);break;
    case 3:c.fillStyle='#1a1a2e';c.fillRect(hx+ps,hy+2*ps,2*ps,2*ps);c.fillRect(hx+5*ps,hy+2*ps,2*ps,2*ps);c.fillRect(hx+3*ps,hy+3*ps,2*ps,ps);break;
    case 4:c.fillStyle=SAGE;c.fillRect(hx,hy-2*ps,8*ps,ps);c.fillStyle=PINK;c.fillRect(hx+ps,hy-3*ps,ps,ps);c.fillRect(hx+5*ps,hy-3*ps,ps,ps);c.fillStyle='#FFE066';c.fillRect(hx+3*ps,hy-3*ps,ps,ps);break;
    case 5:c.fillStyle=CHOCO;c.fillRect(hx,hy-2*ps,8*ps,ps);c.fillRect(hx+ps,hy-6*ps,6*ps,4*ps);c.fillStyle=GOLD;c.fillRect(hx+ps,hy-3*ps,6*ps,ps);break;
    case 6:c.fillStyle=GOLD;c.fillRect(hx+ps,hy-2*ps,6*ps,ps);c.fillRect(hx+3*ps,hy-4*ps,2*ps,2*ps);break;
    case 7:c.fillStyle='#FF6B6B';c.fillRect(hx+2*ps,hy-5*ps,4*ps,ps);c.fillRect(hx+3*ps,hy-7*ps,2*ps,2*ps);break;
  }
}

function wrapText(c,text,x,y,maxW,lineH){
  const words=text.split(' ');
  let line='';
  let cy=y;
  for(let w of words){
    const test=line+w+' ';
    if(c.measureText(test).width>maxW&&line!==''){
      c.fillText(line.trim(),x,cy);
      line=w+' ';cy+=lineH;
    }else{line=test;}
  }
  c.fillText(line.trim(),x,cy);
}

// ===== GAME 1: Quest to the Altar =====
function initGame1(){
  showScreen('game1');
  document.getElementById('screenGame1').innerHTML='';
  
  const gs={
    playerX:60,playerY:0,velY:0,grounded:true,
    scrollX:0,speed:3,score:0,distance:0,maxDist:1500,
    jumping:false,jumpHeld:false,jumpStart:0,
    stumble:0,speedBoost:0,
    collectibles:[],obstacles:[],
    groundY:H*0.72,
    done:false,finishing:false,finishTimer:0,
    spawnTimer:0,obstacleTimer:0,
    lastTime:0,cloudAlpha:0
  };
  gs.playerY=gs.groundY;
  gameState=gs;
  particles=[];
  
  let holdStart=0;
  const onDown=(e)=>{
    e.preventDefault();
    if(gs.done)return;
    if(gs.grounded){
      gs.jumping=true;gs.jumpHeld=true;gs.jumpStart=performance.now();
      gs.velY=-8;gs.grounded=false;
      holdStart=performance.now();
    }
  };
  const onUp=(e)=>{
    e.preventDefault();
    gs.jumpHeld=false;
  };
  
  C.addEventListener('touchstart',onDown,{passive:false});
  C.addEventListener('touchend',onUp,{passive:false});
  C.addEventListener('mousedown',onDown);
  C.addEventListener('mouseup',onUp);
  
  let lastT=performance.now();
  function loop(now){
    if(currentScreen!=='game1')return;
    const dt=Math.min((now-lastT)/16.67,3);
    lastT=now;
    
    if(!gs.done){
      // Variable jump
      if(gs.jumpHeld&&!gs.grounded){
        const held=now-gs.jumpStart;
        if(held<200)gs.velY-=0.3*dt;
      }
      
      // Physics
      gs.velY+=0.5*dt;
      gs.playerY+=gs.velY*dt;
      if(gs.playerY>=gs.groundY){gs.playerY=gs.groundY;gs.velY=0;gs.grounded=true;}
      
      // Speed
      let spd=gs.speed*(gs.stumble>0?0.5:1)*(gs.speedBoost>0?1.5:1);
      gs.distance+=spd*dt;
      gs.scrollX+=spd*dt;
      
      if(gs.stumble>0)gs.stumble-=dt;
      if(gs.speedBoost>0)gs.speedBoost-=dt;
      
      // Spawn collectibles
      gs.spawnTimer+=dt;
      if(gs.spawnTimer>30){
        gs.spawnTimer=0;
        if(Math.random()<0.4){
          gs.collectibles.push({x:W+20,y:gs.groundY-30-Math.random()*60,type:Math.random()<0.8?'petal':'ring',collected:false});
        }
      }
      
      // Spawn obstacles
      gs.obstacleTimer+=dt;
      const freq=Math.max(60-gs.distance/30,25);
      if(gs.obstacleTimer>freq){
        gs.obstacleTimer=0;
        const r=Math.random();
        if(r<0.4){
          gs.obstacles.push({x:W+20,y:gs.groundY-20,type:'chair',w:24,h:28});
        }else if(r<0.7){
          gs.obstacles.push({x:W+20,y:gs.groundY-80-Math.random()*40,type:'cork',vy:1+Math.random(),vx:-1-Math.random()});
        }else{
          gs.obstacles.push({x:W+30,y:-20,type:'program',vy:1.5,vx:-0.8-Math.random()*0.5});
        }
      }
      
      // Update collectibles
      gs.collectibles.forEach(c=>{
        c.x-=spd*dt;
        if(!c.collected&&Math.abs(c.x-gs.playerX)<25&&Math.abs(c.y-gs.playerY+20)<30){
          c.collected=true;
          if(c.type==='petal'){
            gs.score+=10;
            burstParticles(c.x,c.y,5,[PINK,'#FFB6C1'],30,0.5,3);
          }else{
            gs.score+=50;gs.speedBoost=120;
            burstParticles(c.x,c.y,12,[GOLD,'#FFE066'],50,0.8,4);
          }
        }
      });
      
      // Update obstacles
      gs.obstacles.forEach(o=>{
        if(o.type==='chair')o.x-=spd*dt;
        else{o.x+=o.vx*dt;o.y+=o.vy*dt;}
        if(!o.hit&&Math.abs(o.x-gs.playerX)<20&&Math.abs(o.y-gs.playerY+15)<25){
          o.hit=true;gs.stumble=60;
          burstParticles(gs.playerX,gs.playerY-20,8,['#888','#aaa'],40,0.4,2);
        }
      });
      
      // Cleanup
      gs.collectibles=gs.collectibles.filter(c=>c.x>-30&&!c.collected);
      gs.obstacles=gs.obstacles.filter(o=>o.x>-30&&o.y<H+30);
      
      // Storm clouds in last 20%
      if(gs.distance>gs.maxDist*0.8){
        gs.cloudAlpha=Math.min(1,(gs.distance-gs.maxDist*0.8)/(gs.maxDist*0.2));
      }
      
      // Check finish
      if(gs.distance>=gs.maxDist){
        gs.finishing=true;
        gs.done=true;
        gs.finishTimer=0;
      }
    }
    
    // === RENDER ===
    ctx.clearRect(0,0,W,H);
    
    // Sky
    drawRect(0,0,W,gs.groundY,'#D4E8F0');
    
    // Parallax pews
    const pewColor='#8B7355';
    for(let i=0;i<8;i++){
      const px=((i*120-gs.scrollX*0.3)%960+960)%960-120;
      // Back pews
      drawRect(px,gs.groundY-100,30,70,pewColor);
      drawRect(px-5,gs.groundY-100,40,6,pewColor);
      // Front pews (other side)
      drawRect(px+60,gs.groundY-60,30,40,'#9B8365');
      drawRect(px+55,gs.groundY-60,40,6,'#9B8365');
    }
    
    // Ground/carpet
    drawRect(0,gs.groundY,W,H-gs.groundY,'#C94C4C');
    drawRect(0,gs.groundY,W,4,'#A03030');
    // Carpet pattern
    for(let i=0;i<20;i++){
      const lx=((i*60-gs.scrollX)%(W+60)+W+60)%(W+60)-30;
      drawRect(lx,gs.groundY+2,20,2,GOLD);
    }
    
    // Storm clouds
    if(gs.cloudAlpha>0){
      ctx.globalAlpha=gs.cloudAlpha*0.6;
      for(let i=0;i<5;i++){
        drawRect(i*W/5-10,0,W/4+20,60+i*10,'#555');
        drawRect(i*W/5,10,W/4,40+i*8,'#444');
      }
      ctx.globalAlpha=1;
    }
    
    // Progress bar
    const prog=Math.min(1,gs.distance/gs.maxDist);
    drawRect(20,15,W-40,12,'#ddd');
    drawRect(20,15,(W-40)*prog,12,SAGE);
    drawRect(20,15,W-40,12,'transparent');
    ctx.strokeStyle=CHOCO;ctx.lineWidth=2;ctx.strokeRect(20,15,W-40,12);
    drawText("🏛️",W-30,21,10,CHOCO,'DM Sans');
    
    // Score
    drawText(""+gs.score,W-30,42,10,GOLD,'Press Start 2P','right');
    
    // Collectibles
    gs.collectibles.forEach(c=>{
      if(c.collected)return;
      if(c.type==='petal'){
        drawRect(c.x-4,c.y-3,8,6,PINK);
        drawRect(c.x-2,c.y-5,4,2,'#FFB6C1');
      }else{
        drawCircle(c.x,c.y,7,GOLD);
        drawCircle(c.x,c.y,4,CREAM);
        // Sparkle
        const st=performance.now()/200;
        drawRect(c.x+Math.cos(st)*8,c.y+Math.sin(st)*8,3,3,'#FFE066');
      }
    });
    
    // Obstacles
    gs.obstacles.forEach(o=>{
      if(o.type==='chair'){
        drawRect(o.x-8,o.y-8,20,28,'#8B7355');
        drawRect(o.x-10,o.y+6,24,4,'#6B5335');
        drawRect(o.x-6,o.y+10,4,12,'#6B5335');
        drawRect(o.x+8,o.y+10,4,12,'#6B5335');
      }else if(o.type==='cork'){
        drawRect(o.x-3,o.y-6,6,12,'#8B6914');
        drawRect(o.x-4,o.y-8,8,3,'#A0845C');
      }else{
        drawRect(o.x-8,o.y-5,16,10,WHITE);
        drawRect(o.x-6,o.y-3,12,2,'#ddd');
        drawRect(o.x-6,o.y+1,8,2,'#ddd');
      }
    });
    
    // Player avatar
    const bobY=gs.grounded?Math.sin(performance.now()/150)*2:0;
    const stumbleShake=gs.stumble>0?Math.sin(performance.now()/50)*3:0;
    drawAvatar(gs.playerX+stumbleShake,gs.playerY+bobY,2.5*scale,avatar);
    
    // Speed boost indicator
    if(gs.speedBoost>0){
      ctx.globalAlpha=0.5;
      for(let i=0;i<3;i++){
        drawRect(gs.playerX-30-i*8,gs.playerY-10+i*5-Math.random()*4,6,2,GOLD);
      }
      ctx.globalAlpha=1;
    }
    
    // Particles
    updateParticles(dt);
    drawParticles();
    
    // Petal trail from collected petals
    if(Math.random()<0.1&&gs.distance>0){
      addParticle(gs.playerX-10+Math.random()*10,gs.playerY+Math.random()*5,
        -1-Math.random(),Math.random()-0.5,1,PINK,2+Math.random()*2);
    }
    
    // Finish
    if(gs.finishing){
      gs.finishTimer+=dt;
      if(gs.finishTimer<120){
        // Celebration
        if(gs.finishTimer%5<1)burstParticles(W/2,H/2,5,[GOLD,'#FFE066',PINK],80,1,4,50);
        // Altar at right
        drawRect(W-80,gs.groundY-80,60,80,WHITE);
        drawRect(W-85,gs.groundY-82,70,6,GOLD);
        drawCircle(W-50,gs.groundY-60,8,GOLD);
        drawCircle(W-50,gs.groundY-60,5,CREAM);
      }else{
        // Show score overlay
        drawRect(0,0,W,H,'rgba(0,0,0,0.7)');
        drawRect(W*0.1,H*0.3,W*0.8,H*0.35,CREAM);
        ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.strokeRect(W*0.1,H*0.3,W*0.8,H*0.35);
        drawText("Game 1 Complete!",W/2,H*0.38,12*scale,CHOCO,'Press Start 2P');
        drawText("Score: "+gs.score,W/2,H*0.46,16*scale,GOLD,'Press Start 2P');
        drawPixelHeart(W*0.2,H*0.42,3*scale,PINK);
        drawPixelHeart(W*0.8,H*0.42,3*scale,PINK);
        
        drawRect(W*0.25,H*0.54,W*0.5,40,PINK);
        drawText("Continue ▶",W/2,H*0.54+20,10*scale,WHITE,'Press Start 2P');
        
        if(!gs.clickBound){
          gs.clickBound=true;
          const cont=(e)=>{
            e.preventDefault();
            C.removeEventListener('click',cont);
            C.removeEventListener('touchstart',contT);
            C.removeEventListener('touchstart',onDown);
            C.removeEventListener('touchend',onUp);
            C.removeEventListener('mousedown',onDown);
            C.removeEventListener('mouseup',onUp);
            scores.game1=gs.score;
            initStormTransition();
          };
          const contT=(e)=>{e.preventDefault();cont(e);};
          setTimeout(()=>{
            C.addEventListener('click',cont);
            C.addEventListener('touchstart',contT,{passive:false});
          },300);
        }
      }
    }
    
    animId=requestAnimationFrame(loop);
  }
  animId=requestAnimationFrame(loop);
}

// ===== STORM TRANSITION =====
function initStormTransition(){
  showScreen('stormTransition');
  let t=0;
  function loop(){
    if(currentScreen!=='stormTransition')return;
    t+=0.016;
    ctx.clearRect(0,0,W,H);
    
    // Dark sky
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#2C2C3A');grd.addColorStop(1,'#4A4A5A');
    drawRect(0,0,W,H,grd);
    
    // Rolling clouds
    for(let i=0;i<8;i++){
      const cx=(i*100+t*30)%(W+200)-100;
      const cy=30+i*25+Math.sin(t+i)*10;
      drawRect(cx-40,cy,100,30+i*5,'#3A3A4A');
      drawRect(cx-20,cy-10,60,20,'#444');
    }
    
    // Lightning flashes
    if(Math.sin(t*5)>0.95){
      ctx.globalAlpha=0.3;drawRect(0,0,W,H,'#FFE');ctx.globalAlpha=1;
    }
    
    // Rain
    for(let i=0;i<30;i++){
      const rx=(i*37+t*200)%W;
      const ry=(i*53+t*400)%H;
      drawRect(rx,ry,1,8,'#8899BB');
    }
    
    // Text
    drawRect(W*0.08,H*0.4,W*0.84,H*0.2,WHITE);
    ctx.strokeStyle=CHOCO;ctx.lineWidth=3;ctx.strokeRect(W*0.08,H*0.4,W*0.84,H*0.2);
    ctx.fillStyle=CHOCO;ctx.font='13px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText("The rings are safe! But wait...",W/2,H*0.46);
    ctx.fillText("Dark storm clouds are gathering",W/2,H*0.50);
    ctx.fillText("over the venue!",W/2,H*0.54);
    
    // Button
    const ba=0.8+Math.sin(t*3)*0.2;
    ctx.globalAlpha=ba;
    drawRect(W*0.25,H*0.68,W*0.5,44,PINK);
    drawText("Continue ▶",W/2,H*0.68+22,10,WHITE,'Press Start 2P');
    ctx.globalAlpha=1;
    
    animId=requestAnimationFrame(loop);
  }
  loop();
  
  const h=(e)=>{e.preventDefault();C.removeEventListener('click',h);C.removeEventListener('touchstart',ht);initWitchIntro();};
  const ht=(e)=>{e.preventDefault();h(e);};
  setTimeout(()=>{C.addEventListener('click',h);C.addEventListener('touchstart',ht,{passive:false});},500);
}

// ===== WITCH INTRO =====
function initWitchIntro(){
  showScreen('witchIntro');
  let t=0;
  const msg="It's going to pour! Quick, I need you as my assistant witch to cast a weather spell and clear these skies!";
  let charIdx=0;
  let witchX=-60;
  
  function drawWitch(x,y,s){
    // Broomstick
    drawRect(x-20*s,y+10*s,50*s,3*s,'#8B6914');
    drawRect(x-25*s,y+6*s,10*s,10*s,'#DAA520');
    // Body/shawl
    drawRect(x-6*s,y-4*s,12*s,16*s,'#6B3FA0');
    // Sparkles on shawl
    drawRect(x-3*s,y+2*s,2*s,2*s,'#FFE066');
    drawRect(x+4*s,y+6*s,2*s,2*s,'#FFE066');
    drawRect(x-5*s,y+8*s,2*s,2*s,GOLD);
    // Head
    drawCircle(x,y-8*s,7*s,SKIN);
    // Eyes
    drawRect(x-4*s,y-9*s,2*s,2*s,CHOCO);
    drawRect(x+2*s,y-9*s,2*s,2*s,CHOCO);
    // Smile
    drawRect(x-2*s,y-5*s,4*s,2*s,'#E88B8B');
    // Witch hat
    drawRect(x-10*s,y-16*s,20*s,3*s,CHOCO);
    drawRect(x-6*s,y-28*s,12*s,12*s,CHOCO);
    drawRect(x-3*s,y-32*s,6*s,5*s,CHOCO);
    // Hat band
    drawRect(x-6*s,y-18*s,12*s,2*s,GOLD);
    // Hat tip star
    drawStar(x,y-34*s,3*s,'#FFE066');
  }
  
  function loop(){
    if(currentScreen!=='witchIntro')return;
    t+=0.016;
    ctx.clearRect(0,0,W,H);
    
    // Storm background
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#3A3A4A');grd.addColorStop(1,'#5A5A6A');
    drawRect(0,0,W,H,grd);
    
    // Clouds
    for(let i=0;i<6;i++){
      const cx=(i*110+Math.sin(t*0.5+i)*20)%(W+100)-50;
      drawRect(cx-30,20+i*18,80,25,'#4A4A5A');
    }
    
    // Venue silhouette
    drawRect(W*0.2,H*0.5,W*0.6,H*0.3,'#3A3A3A');
    ctx.beginPath();ctx.moveTo(W*0.15,H*0.5);ctx.lineTo(W*0.5,H*0.35);ctx.lineTo(W*0.85,H*0.5);ctx.closePath();
    ctx.fillStyle='#333';ctx.fill();
    
    // Ground
    drawRect(0,H*0.8,W,H*0.2,'#2A3A2A');
    
    // Witch flying in
    witchX=Math.min(W*0.5,witchX+2);
    const wy=H*0.3+Math.sin(t*2)*10;
    drawWitch(witchX,wy,1.5);
    
    // Sparkle trail
    if(witchX<W*0.5){
      for(let i=0;i<3;i++){
        drawStar(witchX-20-i*15+Math.random()*5,wy+Math.random()*10-5,2+Math.random()*2,'#FFE066');
      }
    }
    
    // Dialog
    if(witchX>=W*0.5){
      if(charIdx<msg.length)charIdx+=0.6;
      const shown=msg.substring(0,Math.floor(charIdx));
      drawRect(W*0.05,H*0.6,W*0.9,H*0.18,WHITE);
      ctx.strokeStyle=CHOCO;ctx.lineWidth=3;ctx.strokeRect(W*0.05,H*0.6,W*0.9,H*0.18);
      ctx.fillStyle=CHOCO;ctx.font='12px DM Sans';ctx.textAlign='left';ctx.textBaseline='top';
      wrapText(ctx,shown,W*0.09,H*0.62,W*0.82,16);
    }
    
    // Button
    if(charIdx>=msg.length){
      const ba=0.8+Math.sin(t*3)*0.2;
      ctx.globalAlpha=ba;
      drawRect(W*0.15,H*0.85,W*0.7,44,SAGE);
      drawText("Cast the Spell! 🧙‍♀️",W/2,H*0.85+22,9,WHITE,'Press Start 2P');
      ctx.globalAlpha=1;
    }
    
    animId=requestAnimationFrame(loop);
  }
  loop();
  
  const h=(e)=>{
    e.preventDefault();
    if(charIdx<msg.length){charIdx=msg.length;return;}
    C.removeEventListener('click',h);C.removeEventListener('touchstart',ht);
    initGame2();
  };
  const ht=(e)=>{e.preventDefault();h(e);};
  C.addEventListener('click',h);
  C.addEventListener('touchstart',ht,{passive:false});
}

// ===== GAME 2: DDR / RHYTHM GAME =====
function initGame2(){
  showScreen('game2');
  const scr=document.getElementById('screenGame2');
  scr.innerHTML='';
  
  // DDR controls (DOM buttons for instant response)
  const ctrlDiv=document.createElement('div');
  ctrlDiv.className='ddr-controls';
  const dirs=['←','↓','↑','→'];
  const dirColors=[PINK,'#6B9BD2',SAGE,GOLD];
  const dirKeys=['left','down','up','right'];
  const btns=[];
  dirs.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='ddr-btn';
    b.style.background=dirColors[i]+'99';
    b.style.color=WHITE;
    b.textContent=d;
    b.dataset.dir=dirKeys[i];
    ctrlDiv.appendChild(b);
    btns.push(b);
  });
  scr.appendChild(ctrlDiv);
  scr.style.pointerEvents='auto';
  
  // Generate arrow pattern (~90 arrows over ~60 seconds)
  // BPM starts at 120, so 500ms between beats
  const pattern=[];
  let beatTime=0;
  const bpm=120;
  let interval=60000/bpm; // 500ms
  
  // Phase 1: Simple singles (0-20s)
  for(let i=0;i<20;i++){
    beatTime+=interval+(i<5?200:0); // slower start
    pattern.push({time:beatTime,dir:dirKeys[i%4]});
  }
  // Phase 2: Faster singles (20-40s)
  interval=450;
  for(let i=0;i<30;i++){
    beatTime+=interval;
    const r=Math.floor(Math.random()*4);
    pattern.push({time:beatTime,dir:dirKeys[r]});
    // Occasional quick follow
    if(i%5===3){
      beatTime+=interval/2;
      pattern.push({time:beatTime,dir:dirKeys[(r+1)%4]});
    }
  }
  // Phase 3: Fast with doubles (40-60s)
  interval=400;
  for(let i=0;i<25;i++){
    beatTime+=interval;
    const r=Math.floor(Math.random()*4);
    pattern.push({time:beatTime,dir:dirKeys[r]});
    if(i%4===2){
      // Double arrow
      const r2=(r+2)%4;
      pattern.push({time:beatTime,dir:dirKeys[r2]});
    }
    if(i>15)interval=350;
  }
  // Final burst
  for(let i=0;i<8;i++){
    beatTime+=300;
    pattern.push({time:beatTime,dir:dirKeys[i%4]});
  }
  
  const totalArrows=pattern.length;
  
  const gs={
    arrows:pattern.map((p,i)=>({...p,id:i,hit:false,missed:false,y:0,active:true})),
    score:0,combo:0,maxCombo:0,
    targetY:120*scale, // Where arrows should be hit (near top)
    scrollSpeed:0.25, // pixels per ms
    startTime:0,started:false,
    feedbacks:[],// {text,x,y,timer,color}
    cloudClear:0,// 0-1
    done:false,
    witchX:W*0.5,witchY:50,
    shakeAmount:0,
    hitArrows:0,totalArrows:totalArrows,
    raindrops:[],
    lastTime:0
  };
  gameState=gs;
  particles=[];
  
  // Pre-fill raindrops
  for(let i=0;i<40;i++){
    gs.raindrops.push({x:Math.random()*W,y:Math.random()*H,speed:2+Math.random()*3});
  }
  
  // Button handling
  const pressed={};
  function handleDir(dir){
    if(gs.done)return;
    if(!gs.started){gs.started=true;gs.startTime=performance.now();}
    
    // Find closest arrow of this direction
    const now=performance.now()-gs.startTime;
    let best=null,bestDiff=Infinity;
    gs.arrows.forEach(a=>{
      if(a.dir===dir&&a.active&&!a.hit&&!a.missed){
        const diff=Math.abs(a.time-now);
        if(diff<bestDiff){bestDiff=diff;best=a;}
      }
    });
    
    if(best&&bestDiff<200){
      best.hit=true;best.active=false;
      gs.hitArrows++;
      let pts=0,txt='',col=CHOCO;
      if(bestDiff<=40){pts=100;txt='PERFECT!';col=GOLD;
        burstParticles(W/2,gs.targetY,12,[GOLD,'#FFE066','#FFF'],60,0.6,4);
        gs.shakeAmount=3;
      }
      else if(bestDiff<=100){pts=50;txt='GREAT!';col=SAGE;
        burstParticles(W/2,gs.targetY,6,[SAGE,'#B5D6A7'],40,0.4,3);
        gs.shakeAmount=1;
      }
      else if(bestDiff<=170){pts=25;txt='GOOD!';col=SKY;
        burstParticles(W/2,gs.targetY,3,[SKY],20,0.3,2);
      }
      else{pts=0;txt='MISS...';col='#888';gs.combo=0;}
      
      if(pts>0){
        gs.combo++;
        if(gs.combo>gs.maxCombo)gs.maxCombo=gs.combo;
        let mult=1;
        if(gs.combo>=50)mult=3;
        else if(gs.combo>=25)mult=2;
        else if(gs.combo>=10)mult=1.5;
        pts=Math.floor(pts*mult);
      }else{gs.combo=0;}
      
      gs.score+=pts;
      gs.cloudClear=gs.hitArrows/gs.totalArrows;
      
      // Column x position
      const colIdx=dirKeys.indexOf(dir);
      const colX=W*0.2+colIdx*(W*0.6/3);
      gs.feedbacks.push({text:txt+(gs.combo>5?' x'+gs.combo:''),x:colX,y:gs.targetY-30,timer:40,color:col,size:pts>=100?16:12});
    }else{
      // No arrow nearby - miss
      const colIdx=dirKeys.indexOf(dir);
      const colX=W*0.2+colIdx*(W*0.6/3);
      gs.feedbacks.push({text:'MISS...',x:colX,y:gs.targetY-30,timer:30,color:'#888',size:10});
      gs.combo=0;
    }
  }
  
  btns.forEach(b=>{
    const onDown=(e)=>{
      e.preventDefault();e.stopPropagation();
      b.style.transform='scale(0.9)';
      b.style.background=dirColors[dirKeys.indexOf(b.dataset.dir)];
      handleDir(b.dataset.dir);
    };
    const onUp=(e)=>{
      e.preventDefault();
      b.style.transform='scale(1)';
      b.style.background=dirColors[dirKeys.indexOf(b.dataset.dir)]+'99';
    };
    b.addEventListener('touchstart',onDown,{passive:false});
    b.addEventListener('touchend',onUp,{passive:false});
    b.addEventListener('mousedown',onDown);
    b.addEventListener('mouseup',onUp);
  });
  
  // Keyboard support
  const keyMap={ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up',ArrowRight:'right'};
  const keyHandler=(e)=>{
    if(keyMap[e.key]){e.preventDefault();handleDir(keyMap[e.key]);}
  };
  window.addEventListener('keydown',keyHandler);
  
  let lastT=performance.now();
  function loop(now){
    if(currentScreen!=='game2'){window.removeEventListener('keydown',keyHandler);return;}
    const rawDt=now-lastT;lastT=now;
    const dt=Math.min(rawDt/16.67,3);
    
    const elapsed=gs.started?now-gs.startTime:0;
    
    // Mark missed arrows
    gs.arrows.forEach(a=>{
      if(a.active&&!a.hit&&!a.missed&&elapsed>a.time+200){
        a.missed=true;a.active=false;
        gs.combo=0;
        // Rain effect
        for(let i=0;i<3;i++){
          addParticle(Math.random()*W,0,0,3+Math.random()*2,0.5,'#6688AA',2);
        }
      }
    });
    
    // Check done
    const allDone=gs.arrows.every(a=>a.hit||a.missed);
    if(allDone&&gs.started&&!gs.done){
      gs.done=true;
      gs.doneTimer=0;
    }
    if(gs.done)gs.doneTimer=(gs.doneTimer||0)+dt;
    
    // Shake
    if(gs.shakeAmount>0)gs.shakeAmount*=0.9;
    
    // === RENDER ===
    ctx.save();
    if(gs.shakeAmount>0.1){
      ctx.translate(Math.sin(now/30)*gs.shakeAmount,Math.cos(now/40)*gs.shakeAmount);
    }
    ctx.clearRect(-10,-10,W+20,H+20);
    
    // Sky gradient based on cloudClear
    const skyR=Math.floor(42+gs.cloudClear*126);
    const skyG=Math.floor(42+gs.cloudClear*154);
    const skyB=Math.floor(58+gs.cloudClear*154);
    drawRect(0,0,W,H,`rgb(${skyR},${skyG},${skyB})`);
    
    // Sun (appears as clouds clear)
    if(gs.cloudClear>0.5){
      ctx.globalAlpha=(gs.cloudClear-0.5)*2;
      drawCircle(W*0.8,60,30,'#FFE066');
      drawCircle(W*0.8,60,25,'#FFD700');
      // Rays
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4+now/2000;
        drawRect(W*0.8+Math.cos(a)*35-2,60+Math.sin(a)*35-1,15,3,'#FFE066');
      }
      ctx.globalAlpha=1;
    }
    
    // Rainbow (appears at 75%+)
    if(gs.cloudClear>0.75){
      ctx.globalAlpha=(gs.cloudClear-0.75)*4;
      const rainbow=['#FF0000','#FF7700','#FFFF00','#00FF00','#0000FF','#8B00FF'];
      rainbow.forEach((c,i)=>{
        ctx.strokeStyle=c;ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(W*0.5,H*0.4,80+i*6,-Math.PI,-0);ctx.stroke();
      });
      ctx.globalAlpha=1;
    }
    
    // Clouds (disappear as cloudClear increases)
    ctx.globalAlpha=1-gs.cloudClear;
    for(let i=0;i<8;i++){
      const cx=(i*80+Math.sin(now/3000+i)*15)%(W+80)-40;
      const cy=10+i*12;
      drawRect(cx-30,cy,80,20,'#555');
      drawRect(cx-15,cy-8,50,15,'#4A4A4A');
    }
    ctx.globalAlpha=1;
    
    // Rain (inversely proportional to cloudClear)
    if(gs.cloudClear<0.8){
      ctx.globalAlpha=1-gs.cloudClear;
      gs.raindrops.forEach(r=>{
        r.y+=r.speed*dt;
        if(r.y>H){r.y=0;r.x=Math.random()*W;}
        drawRect(r.x,r.y,1,6,'#8899BB');
      });
      ctx.globalAlpha=1;
    }
    
    // Witch auntie (flies around top)
    gs.witchX=W*0.3+Math.sin(now/2000)*W*0.2;
    gs.witchY=40+Math.sin(now/1500)*15;
    // Mini witch

    drawRect(gs.witchX-4,gs.witchY-2,8,10,'#6B3FA0'); // body
    drawCircle(gs.witchX,gs.witchY-6,5,SKIN); // head
    drawRect(gs.witchX-5,gs.witchY-14,10,2,CHOCO); // hat brim
    drawRect(gs.witchX-3,gs.witchY-20,6,6,CHOCO); // hat
    drawStar(gs.witchX,gs.witchY-22,2,'#FFE066');
    
    // Game area background
    const gameTop=gs.targetY-20;

    ctx.globalAlpha=0.2;
    drawRect(0,gameTop,W,gameBot-gameTop,'#000');
    ctx.globalAlpha=1;
    
    // Target line
    drawRect(0,gs.targetY-2,W,4,'rgba(255,255,255,0.5)');
    
    // Target zones (4 columns)
    const colW=W*0.6/3;

    dirKeys.forEach((dir,i)=>{
      const cx=startX+i*colW;
      // Target arrow outline
      drawArrow(cx,gs.targetY,20,dir,'rgba(255,255,255,0.3)',true);
    });
    
    // Scrolling arrows
    gs.arrows.forEach(a=>{
      if(a.hit||a.missed)return;
      const timeDiff=a.time-elapsed;
      const y=gs.targetY+timeDiff*gs.scrollSpeed;
      a.y=y;
      
      // Only draw if on screen
      if(y>gameTop-30&&y<gameBot+30){
        const colIdx=dirKeys.indexOf(a.dir);
        const x=startX+colIdx*colW;
        const col=dirColors[colIdx];
        drawArrow(x,y,20,a.dir,col,false);
      }
    });
    
    // Feedbacks
    gs.feedbacks.forEach(f=>{
      f.timer-=dt;f.y-=dt*1.5;
      ctx.globalAlpha=Math.max(0,f.timer/20);
      drawText(f.text,f.x,f.y,f.size*scale,f.color,'Press Start 2P');
      ctx.globalAlpha=1;
    });
    gs.feedbacks=gs.feedbacks.filter(f=>f.timer>0);
    
    // Score & Combo display
    drawText("Score: "+gs.score,W-10,gameTop+20,9*scale,WHITE,'Press Start 2P','right');
    if(gs.combo>2){
      const comboSize=Math.min(20,10+gs.combo*0.15);
      drawText(gs.combo+"x COMBO",W/2,gameTop+45,comboSize*scale,
        gs.combo>=50?GOLD:gs.combo>=25?'#FFE066':gs.combo>=10?SAGE:WHITE,'Press Start 2P');
    }
    
    // Progress
    const prog=gs.started?Math.min(1,elapsed/((pattern[pattern.length-1]?.time||60000)+500)):0;
    drawRect(10,gameTop+5,100,8,'#333');
    drawRect(10,gameTop+5,100*prog,8,SAGE);
    
    updateParticles(dt);
    drawParticles();
    
    ctx.restore();
    
    // Done overlay
    if(gs.done&&gs.doneTimer>90){
      drawRect(0,0,W,H,'rgba(0,0,0,0.75)');
      drawRect(W*0.08,H*0.25,W*0.84,H*0.4,CREAM);
      ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.strokeRect(W*0.08,H*0.25,W*0.84,H*0.4);
      drawText("Game 2 Complete!",W/2,H*0.32,12*scale,CHOCO,'Press Start 2P');
      drawText("Score: "+gs.score,W/2,H*0.40,16*scale,GOLD,'Press Start 2P');
      drawText("Max Combo: "+gs.maxCombo,W/2,H*0.47,10*scale,SAGE,'Press Start 2P');
      drawPixelHeart(W*0.15,H*0.40,3*scale,PINK);
      drawPixelHeart(W*0.85,H*0.40,3*scale,PINK);
      
      drawRect(W*0.2,H*0.53,W*0.6,42,PINK);
      drawText("Continue ▶",W/2,H*0.53+21,10*scale,WHITE,'Press Start 2P');
      
      if(!gs.clickBound){
        gs.clickBound=true;
        const cont=()=>{
          window.removeEventListener('keydown',keyHandler);
          scr.innerHTML='';
          scores.game2=gs.score;
          scores.game2combo=gs.maxCombo;
          initClearSkies();
        };
        setTimeout(()=>{
          C.addEventListener('click',cont,{once:true});
          C.addEventListener('touchstart',(e)=>{e.preventDefault();cont();},{once:true,passive:false});
        },500);
      }
    }
    
    animId=requestAnimationFrame(loop);
  }
  
  // Start with a tap prompt
  gs.started=false;
  animId=requestAnimationFrame(loop);
  // Auto-start after first button tap (handled in handleDir)
}

function drawArrow(x,y,size,dir,color,outline){
  ctx.save();
  ctx.translate(x,y);
  switch(dir){
    case'left':ctx.rotate(-Math.PI/2);break;
    case'right':ctx.rotate(Math.PI/2);break;
    case'down':ctx.rotate(Math.PI);break;
    case'up':break;
  }
  
  if(outline){
    ctx.strokeStyle=color;ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-size);
    ctx.lineTo(size*0.7,size*0.3);
    ctx.lineTo(size*0.3,size*0.3);
    ctx.lineTo(size*0.3,size);
    ctx.lineTo(-size*0.3,size);
    ctx.lineTo(-size*0.3,size*0.3);
    ctx.lineTo(-size*0.7,size*0.3);
    ctx.closePath();
    ctx.stroke();
  }else{
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(0,-size);
    ctx.lineTo(size*0.7,size*0.3);
    ctx.lineTo(size*0.3,size*0.3);
    ctx.lineTo(size*0.3,size);
    ctx.lineTo(-size*0.3,size);
    ctx.lineTo(-size*0.3,size*0.3);
    ctx.lineTo(-size*0.7,size*0.3);
    ctx.closePath();
    ctx.fill();
    // Highlight
    ctx.globalAlpha=0.3;
    ctx.fillStyle='#FFF';
    ctx.beginPath();
    ctx.moveTo(0,-size);
    ctx.lineTo(-size*0.7,size*0.3);
    ctx.lineTo(0,size*0.1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ===== GAME 3: Precision First Kiss Cannons =====
function initGame3(){
  showScreen('game3');
  document.getElementById('screenGame3').innerHTML='';
  
  const gs={
    round:0, // 0-3
    totalRounds:4,
    needlePos:0, // 0-1
    needleDir:1,
    needleSpeed:1,
    speeds:[1,1.3,1.6,2],
    phase:'ready', // ready, sweep, result, done
    phaseTimer:0,
    scores:[],
    totalScore:0,
    cannonsFired:[false,false,false,false],
    cannonResults:['','','',''],
    celebrations:[],
    done:false,doneTimer:0
  };
  gameState=gs;
  particles=[];
  
  const cannonPositions=[
    {x:W*0.08,y:H*0.45,dir:1},
    {x:W*0.18,y:H*0.55,dir:1},
    {x:W*0.82,y:H*0.55,dir:-1},
    {x:W*0.92,y:H*0.45,dir:-1}
  ];
  
  function fireCannonFx(idx,quality){
    const cp=cannonPositions[idx];
    const colors=quality==='PERFECT'?[GOLD,'#FFE066',PINK,'#FF69B4','#87CEEB']:
                  quality==='GREAT'?[PINK,'#FFB6C1',GOLD]:
                  quality==='GOOD'?[SKY,'#B0E0E6']:['#888','#999'];
    const count=quality==='PERFECT'?40:quality==='GREAT'?25:quality==='GOOD'?12:5;
    const spread=quality==='PERFECT'?200:quality==='GREAT'?150:quality==='GOOD'?100:30;
    burstParticles(cp.x,cp.y-20,count,colors,spread,1.5,4,80);
  }
  
  const tapHandler=(e)=>{
    e.preventDefault();
    if(gs.phase==='sweep'){
      // Determine accuracy
      const pos=gs.needlePos; // 0-1, center=0.5
      const dist=Math.abs(pos-0.5); // 0=perfect, 0.5=edge
      let pts=0,result='';
      if(dist<=0.04){pts=100;result='PERFECT';}
      else if(dist<=0.10){pts=60;result='GREAT';}
      else if(dist<=0.20){pts=30;result='GOOD';}
      else{pts=0;result='MISS';}
      
      gs.scores.push(pts);
      gs.cannonsFired[gs.round]=true;
      gs.cannonResults[gs.round]=result;
      gs.totalScore+=pts;
      
      fireCannonFx(gs.round,result);
      
      gs.phase='result';
      gs.phaseTimer=0;
    }else if(gs.phase==='ready'&&gs.phaseTimer>40){
      gs.phase='sweep';
      gs.needlePos=0;gs.needleDir=1;
      gs.needleSpeed=gs.speeds[gs.round];
    }else if(gs.phase==='done'&&gs.doneTimer>60){
      // Next screen
      C.removeEventListener('click',tapHandler);
      C.removeEventListener('touchstart',touchTap);
      scores.game3=gs.totalScore;
      initFinale();
    }
  };
  const touchTap=(e)=>{e.preventDefault();tapHandler(e);};
  C.addEventListener('click',tapHandler);
  C.addEventListener('touchstart',touchTap,{passive:false});
  
  gs.phase='ready';gs.phaseTimer=0;
  
  let lastT=performance.now();
  function loop(now){
    if(currentScreen!=='game3')return;
    const dt=Math.min((now-lastT)/16.67,3);
    lastT=now;
    
    gs.phaseTimer+=dt;
    
    if(gs.phase==='sweep'){
      gs.needlePos+=gs.needleDir*0.012*gs.needleSpeed*dt;
      if(gs.needlePos>=1){gs.needlePos=1;gs.needleDir=-1;}
      if(gs.needlePos<=0){gs.needlePos=0;gs.needleDir=1;}
    }
    
    if(gs.phase==='result'&&gs.phaseTimer>80){
      gs.round++;
      if(gs.round>=gs.totalRounds){
        gs.phase='done';gs.doneTimer=0;
        // Celebration based on total
        if(gs.totalScore>=250){
          // MASSIVE
          for(let i=0;i<5;i++){
            setTimeout(()=>burstParticles(Math.random()*W,Math.random()*H*0.5,30,[GOLD,PINK,'#FF69B4','#FFE066','#87CEEB'],150,2,5,60),i*200);
          }
        }
      }else{
        gs.phase='ready';gs.phaseTimer=0;
      }
    }
    if(gs.phase==='done')gs.doneTimer+=dt;
    
    // === RENDER ===
    ctx.clearRect(0,0,W,H);
    
    // Sky background
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#87CEEB');grd.addColorStop(1,'#B0E0E6');
    drawRect(0,0,W,H,grd);
    
    // Venue/altar scene
    drawRect(0,H*0.7,W,H*0.3,'#C9967A');
    
    // Altar
    drawRect(W*0.35,H*0.45,W*0.3,H*0.25,WHITE);
    drawRect(W*0.33,H*0.44,W*0.34,6,GOLD);
    
    // Couple at altar
    // Groom (left)
    const gx=W*0.43,gy=H*0.42;
    drawRect(gx-5,gy,10,18,CHOCO);
    drawCircle(gx,gy-5,6,SKIN);
    drawRect(gx-6,gy-12,12,4,'#4A3728');
    drawRect(gx-2,gy+2,4,2,WHITE);
    
    // Bride (right)
    const bx=W*0.57,by=H*0.42;
    drawRect(bx-7,by,14,20,WHITE);
    drawRect(bx-10,by+10,20,12,WHITE);
    drawCircle(bx,by-5,6,SKIN);
    drawRect(bx-7,by-12,14,5,'#8B6914');
    // Veil
    ctx.globalAlpha=0.4;drawRect(bx-8,by-12,16,25,WHITE);ctx.globalAlpha=1;
    
    // Confetti cannons
    cannonPositions.forEach((cp,i)=>{
      const fired=gs.cannonsFired[i];
      // Cannon body
      drawRect(cp.x-8,cp.y-5,16,25,'#666');
      drawRect(cp.x-10,cp.y+20,20,8,'#888');
      // Fuse/top
      if(!fired){
        drawRect(cp.x-6,cp.y-8,12,5,GOLD);
      }else{
        // Result indicator
        const r=gs.cannonResults[i];
        const c=r==='PERFECT'?GOLD:r==='GREAT'?SAGE:r==='GOOD'?SKY:'#888';
        drawCircle(cp.x,cp.y-12,6,c);
        drawText(r==='PERFECT'?'★':r==='GREAT'?'✓':r==='GOOD'?'~':'✗',cp.x,cp.y-12,8,WHITE,'Press Start 2P');
      }
    });
    
    // Mazel Tov Meter (bottom area)
    const meterY=H*0.82;
    const meterX=W*0.1;
    const meterW=W*0.8;
    const meterH=30;
    
    if(gs.phase==='sweep'||gs.phase==='ready'){

    // Meter background
    drawRect(meterX,meterY,meterW,meterH,'#C94C4C');
    
    // GOOD zone (center 40%)
    drawRect(meterX+meterW*0.3,meterY,meterW*0.4,meterH,'#E8A030');
    // GREAT zone (center 20%)
    drawRect(meterX+meterW*0.4,meterY,meterW*0.2,meterH,'#E8E030');

    drawRect(meterX+meterW*0.46,meterY,meterW*0.08,meterH,SAGE);

    ctx.globalAlpha=0.3+Math.sin(now/200)*0.2;
    drawRect(meterX+meterW*0.46-2,meterY-2,meterW*0.08+4,meterH+4,'#00FF00');
    ctx.globalAlpha=1;
    
    // Meter border
    ctx.strokeStyle=CHOCO;ctx.lineWidth=3;ctx.strokeRect(meterX,meterY,meterW,meterH);
    
    // Needle
    if(gs.phase==='sweep'){

      drawRect(nx-6,meterY-10,12,4,'#FF0000');
      drawRect(nx-6,meterY+meterH+6,12,4,'#FF0000');
    }
    
    // Result display
    if(gs.phase==='result'){
      const r=gs.cannonResults[gs.round];
      const c=r==='PERFECT'?GOLD:r==='GREAT'?SAGE:r==='GOOD'?SKY:'#888';

      <div style="text-align:center;"><div style="color:${PINK};font-size:11px;">Game 1</div><div class="pixel-font" style="font-size:10px;color:${WHITE};">${scores.game1}</div></div>
      <div style="text-align:center;"><div style="color:${SAGE};font-size:11px;">Game 2</div><div class="pixel-font" style="font-size:10px;color:${WHITE};">${scores.game2}</div></div>
      <div style="text-align:center;"><div style="color:${GOLD};font-size:11px;">Game 3</div><div class="pixel-font" style="font-size:10px;color:${WHITE};">${scores.game3}</div></div>
    </div>
    <div style="width:90%;max-width:360px;margin:12px auto;">
      <div class="pixel-font" style="font-size:10px;color:${GOLD};text-align:center;margin-bottom:8px;">🏆 Guest Leaderboard</div>
      ${lb.slice(0,10).map((e,i)=>{
        const isMe=e.name===playerName&&e.score===totalScore&&i===playerRank-1;
        return `<div class="lb-row ${isMe?'highlight':'normal'}" style="color:${isMe?CHOCO:WHITE};">
          <span>#${i+1} ${e.name}</span><span>${e.score}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="btn btn-gold" id="copyBtn" style="margin:8px 0;font-size:9px;">📋 Copy Score</button>
    <a href="#" class="btn btn-pink" style="text-decoration:none;margin:4px 0;font-size:9px;">📸 Photo Album</a>
    <button class="btn btn-sage" id="replayBtn" style="margin:4px 0;font-size:9px;">🎮 Play Again</button>
    <div style="color:#888;font-size:11px;margin:16px 0;">Made with ❤️ for Max & Julie's Wedding</div>
  `;
  
  // Draw avatar
  const ac=document.getElementById('finaleAvatar');
  if(ac){
    const actx=ac.getContext('2d');
    drawAvatarOnCanvas(ac,actx,60,130,3,avatar);
  }
  
  // Animated score count-up
  const countEl=document.getElementById('scoreCountup');
  let counted=0;
  const countInterval=setInterval(()=>{
    counted+=Math.ceil(totalScore/60);
    if(counted>=totalScore){counted=totalScore;clearInterval(countInterval);}
    if(countEl)countEl.textContent=counted;
  },30);
  
  // Copy button
  document.getElementById('copyBtn')?.addEventListener('click',()=>{
    const txt=`I scored ${totalScore} at Max & Julie's Wedding Arcade! 🎮💒`;
    navigator.clipboard?.writeText(txt).then(()=>{
      document.getElementById('copyBtn').textContent='✅ Copied!';
      setTimeout(()=>{document.getElementById('copyBtn').textContent='📋 Copy Score';},2000);
    }).catch(()=>{});
  });
  
  // Replay
  document.getElementById('replayBtn')?.addEventListener('click',()=>{
    scores={game1:0,game2:0,game2combo:0,game3:0};
    particles=[];
    initWelcome();
  });
  
  // Fireworks on canvas (behind the DOM)
  let ft=0;
  function fireworkLoop(){
    if(currentScreen!=='finale')return;
    ft+=0.016;
    ctx.clearRect(0,0,W,H);
    drawRect(0,0,W,H,'#1a1a2e');
    
    // Pixel fireworks
    if(Math.random()<0.08){
      const fx=W*0.1+Math.random()*W*0.8;
      const fy=H*0.05+Math.random()*H*0.3;
      const colors=[[GOLD,'#FFE066'],[PINK,'#FFB6C1'],['#FF6B6B','#FF9999'],[SKY,'#B0E0E6'],['#90EE90','#B5D6A7']];
      const c=colors[Math.floor(Math.random()*colors.length)];
      burstParticles(fx,fy,15,c,60,1.2,3,30);
    }
    
    updateParticles(0.016*60);
    drawParticles();
    
    animId=requestAnimationFrame(fireworkLoop);
  }
  animId=requestAnimationFrame(fireworkLoop);
}

// ===== INIT =====
// Load saved data
try{
  const sa=localStorage.getItem('wg_avatar');
  if(sa)avatar=JSON.parse(sa);
  const sn=localStorage.getItem('wg_name');
  if(sn)playerName=sn;
}catch(e){}

initWelcome();
</script>
</body>
</html>
