      }

      const tabs = document.querySelectorAll('.cc-tab');
      for (let i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener('click', function() {
          activeTab = this.dataset.tab;
          renderCreator();
        });
      }

      const leftBtn = document.getElementById('ccLeft');
      const rightBtn = document.getElementById('ccRight');
      const colorBtn = document.getElementById('ccColor');
      if (leftBtn) leftBtn.addEventListener('click', function() {
        const key = activeTab;
        avatar[key] = (avatar[key] - 1 + maxOpts[key]) % maxOpts[key];
        renderCreator();
      });
      if (rightBtn) rightBtn.addEventListener('click', function() {
        const key = activeTab;
        avatar[key] = (avatar[key] + 1) % maxOpts[key];
        renderCreator();
      });
      if (colorBtn) colorBtn.addEventListener('click', function() {
        avatar.hairColor = (avatar.hairColor + 1) % hairColorNames.length;
        renderCreator();
      });

      const saveBtn = document.getElementById('ccSave');
      if (saveBtn) saveBtn.addEventListener('click', function() {
        playerName = (document.getElementById('ccName') ? document.getElementById('ccName').value : '') || 'Guest';
        try {
          localStorage.setItem('wg_avatar', JSON.stringify(avatar));
          localStorage.setItem('wg_name', playerName);
        } catch(e) {}
        initStoryIntro();
      });
    }, 20);
  }

  function buildTabs() {
    const names = ['hair','top','bottom','shoes','acc'];
    const labels = ['Hair','Top','Bottom','Shoes','Acc'];
    let html = '';
    for (let i = 0; i < names.length; i++) {
      const isActive = activeTab === names[i];
      html += '<button class="cc-tab" data-tab="' + names[i] + '" style="font-size:13px;padding:5px 10px;' +
        'border:2px solid ' + (isActive ? '#ffd700' : '#555') + ';border-radius:8px;' +
        'background:' + (isActive ? '#d4af37' : '#2a2a5e') + ';color:' + (isActive ? '#1a1a3e' : '#ccc') + ';' +
        'cursor:pointer;font-weight:' + (isActive ? 'bold' : 'normal') + ';">' + labels[i] + '</button>';
    }
    return html;
  }

  function buildControls() {
    const key = activeTab;
    const val = avatar[key];
    const mx = maxOpts[key];
    let html = '<button id="ccLeft" style="font-size:24px;width:44px;height:44px;border:none;border-radius:50%;' +
      'background:#d4af37;color:#1a1a3e;cursor:pointer;font-weight:bold;">◀</button>' +
      '<span style="font-size:16px;min-width:60px;display:inline-block;">' +
        activeTab.charAt(0).toUpperCase() + activeTab.slice(1) + ' ' + (val + 1) + '/' + mx +
      '</span>' +
      '<button id="ccRight" style="font-size:24px;width:44px;height:44px;border:none;border-radius:50%;' +
      'background:#d4af37;color:#1a1a3e;cursor:pointer;font-weight:bold;">▶</button>';
    if (key === 'hair') {
      html += '<button id="ccColor" style="font-size:12px;padding:5px 8px;border:none;border-radius:8px;' +
        'background:#6b3a8a;color:#fff;cursor:pointer;margin-left:4px;">' +
        hairColorNames[avatar.hairColor] + '</button>';
    }
    return html;
  }

  function drawPreview() {
    const pc = document.getElementById('ccPreview');
    if (!pc) return;
    const pCtx = pc.getContext('2d');
    pCtx.clearRect(0, 0, 200, 240);
    drawChibiSprite(pCtx, 100, 120, 6, {
      hair: avatar.hair,
      hairColor: avatar.hairColor,
      top: avatar.top,
      bottom: avatar.bottom,
      shoes: avatar.shoes,
      acc: avatar.acc,
      frame: 0
    });
  }

  renderCreator();
}

/* ═══════════════════════════════════════════
   3. STORY INTRO
   ═══════════════════════════════════════════ */
function initStoryIntro() {
  showScreen('storyIntro');
  const dialogLines = [
    'Oh no! The wedding is about to start...',
    'But the flower petals are scattered!',
    'The rings are missing!',
    'Can you help get everything ready?'
  ];
  let charIdx = 0;
  let lineIdx = 0;
  let displayText = '';
  let t = 0;
  let showButton = false;
  const btnX = W/2, btnY = H * 0.88, btnW = 160 * scale, btnH = 44 * scale;

  function loop() {
    if (currentScreen !== 'storyIntro') return;
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    // Sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    skyGrad.addColorStop(0, '#f5cc60');
    skyGrad.addColorStop(1, '#e8a040');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.5);

    // Lawn
    ctx.fillStyle = '#4a8c3f';
    ctx.fillRect(0, H * 0.42, W, H * 0.58);

    // Path
    ctx.fillStyle = '#c4a86a';
    ctx.beginPath();
    ctx.moveTo(W * 0.35, H * 0.5);
    ctx.lineTo(W * 0.65, H * 0.5);
    ctx.lineTo(W * 0.7, H);
    ctx.lineTo(W * 0.3, H);
    ctx.fill();

    // Mansion (smaller, background)
    drawMansion(ctx, W * 0.5, H * 0.44, scale * 0.5, 'golden', W, H);

    // Cherry blossom tree
    drawCherryBlossomTree(ctx, W * 0.15, H * 0.44, scale * 0.6);

    // Characters on path
    const bounce = Math.sin(t * 3) * 3;
    drawFlowerGirl(ctx, W * 0.35, H * 0.62 + bounce, scale * 2.5);
    drawRingBearer(ctx, W * 0.5, H * 0.65 + bounce, scale * 2.5);
    drawDogWithBowtie(ctx, W * 0.65, H * 0.64 + bounce, scale * 2.5);

    // Typewriter
    if (lineIdx < dialogLines.length) {
      const line = dialogLines[lineIdx];
      if (charIdx < line.length) {
        charIdx += 0.6;
        displayText = line.substring(0, Math.floor(charIdx));
      } else if (t % 3 < 0.02 && lineIdx < dialogLines.length - 1) {
        lineIdx++;
        charIdx = 0;
        displayText = '';
      } else if (lineIdx === dialogLines.length - 1 && charIdx >= line.length) {
        showButton = true;
      }
    }

    // Dialog box
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    const dbY = H * 0.72;
    const dbH = H * 0.12;
    ctx.beginPath();
    const dbR = 12;
    ctx.moveTo(20 + dbR, dbY);
    ctx.lineTo(W - 20 - dbR, dbY);
    ctx.quadraticCurveTo(W - 20, dbY, W - 20, dbY + dbR);
    ctx.lineTo(W - 20, dbY + dbH - dbR);
    ctx.quadraticCurveTo(W - 20, dbY + dbH, W - 20 - dbR, dbY + dbH);
    ctx.lineTo(20 + dbR, dbY + dbH);
    ctx.quadraticCurveTo(20, dbY + dbH, 20, dbY + dbH - dbR);
    ctx.lineTo(20, dbY + dbR);
    ctx.quadraticCurveTo(20, dbY, 20 + dbR, dbY);
    ctx.fill();
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = (14 * scale) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(displayText, W/2, dbY + dbH/2);

    if (showButton) {
      drawButton('Help Them!', btnX, btnY, btnW, btnH, '#d4af37', '#1a1a3e');
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (!showButton) {
      // Advance text quickly
      if (lineIdx < dialogLines.length) {
        charIdx = dialogLines[lineIdx].length;
        if (lineIdx < dialogLines.length - 1) {
          lineIdx++;
          charIdx = 0;
          displayText = '';
        } else {
          showButton = true;
        }
      }
      return;
    }
    const p = getCanvasXY(e);
    if (hitBtn(p.x, p.y, btnX, btnY, btnW, btnH)) {
      initGame1();
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   4. GAME 1 — AISLE RUNNER
   ═══════════════════════════════════════════ */
function initGame1() {
  showScreen('game1');

  let dist = 0;
  const maxDist = 1500;
  let speed = 2.5;
  let score = 0;
  let t = 0;

  // Player
  const py = { y: H * 0.7, vy: 0, jumping: false, frame: 0, jumpHeld: false, jumpStart: 0 };
  const groundY = H * 0.72;
  const gravity = 0.6;

  // Collectibles & obstacles
  const items = [];
  let nextSpawn = 50;

  // Particles
  const particles = [];

  // State
  let finished = false;
  let jumpHeld = false;
  let jumpStartTime = 0;

  function spawnItem() {
    const r = Math.random();
    if (r < 0.35) {
      // Petal
      items.push({type:'petal', x: W + 20, y: groundY - rand(20, 80), w:16, h:16, collected:false});
    } else if (r < 0.5) {
      // Ring
      items.push({type:'ring', x: W + 20, y: groundY - rand(40, 100), w:18, h:18, collected:false});
    } else if (r < 0.7) {
      // Chair
      items.push({type:'chair', x: W + 20, y: groundY, w:24, h:28, collected:false});
    } else if (r < 0.85) {
      // Cork (arc)
      items.push({type:'cork', x: W + 20, y: groundY - 60, w:12, h:12, collected:false, vy:-2, vx:-1});
    } else {
      // Program (falling)
      items.push({type:'program', x: W * 0.3 + rand(0, W * 0.5), y: -20, w:16, h:20, collected:false, vy:1.5});
    }
  }

  // Touch/click for jump
  function onDown(e) {
    e.preventDefault();
    if (finished) {
      const p = getCanvasXY(e);
      if (hitBtn(p.x, p.y, W/2, H * 0.65, 160 * scale, 44 * scale)) {
        initStormTransition();
      }
      return;
    }
    if (!py.jumping) {
      py.jumping = true;
      py.vy = -10;
      jumpHeld = true;
      jumpStartTime = performance.now();
    }
  }
  function onUp() {
    jumpHeld = false;
  }

  setCanvasHandler(onDown);
  C.addEventListener('touchend', onUp);
  C.addEventListener('mouseup', onUp);

  function loop() {
    if (currentScreen !== 'game1') return;
    t += 0.016;

    if (!finished) {
      dist += speed;
      speed = 2.5 + (dist / maxDist) * 2;
      py.frame = (py.frame + 0.15) % 2;

      // Jump physics
      if (py.jumping) {
        // Variable jump: hold for more height (max 200ms)
        if (jumpHeld && performance.now() - jumpStartTime < 200) {
          py.vy -= 0.3;
        }
        py.vy += gravity;
        py.y += py.vy;
        if (py.y >= groundY) {
          py.y = groundY;
          py.vy = 0;
          py.jumping = false;
        }
      }

      // Spawn items
      nextSpawn -= speed;
      if (nextSpawn <= 0) {
        spawnItem();
        nextSpawn = rand(40, 90);
      }

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        if (it.type === 'cork') {
          it.x += (it.vx || 0) * speed * 0.5 - speed;
          it.y += it.vy;
          it.vy += 0.08;
        } else if (it.type === 'program') {
          it.vy += 0.02;
          it.y += it.vy;
          it.x -= speed * 0.2;
        } else {
          it.x -= speed;
        }

        // Remove off-screen
        if (it.x < -40 || it.y > H + 40) {
          items.splice(i, 1);
          continue;
        }

        if (it.collected) continue;

        // Collision with player
        const px = W * 0.2;
        const pW = 20, pH = 30;
        if (it.x < px + pW && it.x + it.w > px - pW &&
            it.y < py.y && it.y + it.h > py.y - pH) {
          if (it.type === 'petal') {
            score += 10;
            it.collected = true;
            for (let j = 0; j < 5; j++) {
              particles.push({x: it.x, y: it.y, vx: rand(-2, 2), vy: rand(-3, 0),
                life: 30, color: '#ffb7c5', size: rand(2, 4)});
            }
          } else if (it.type === 'ring') {
            score += 50;
            it.collected = true;
            speed += 0.5;
            for (let j = 0; j < 8; j++) {
              particles.push({x: it.x, y: it.y, vx: rand(-2, 2), vy: rand(-3, 0),
                life: 40, color: '#ffd700', size: rand(2, 5)});
            }
          } else if (it.type === 'chair' || it.type === 'cork' || it.type === 'program') {
            // Hit obstacle — stumble (brief slowdown)
            speed = Math.max(1.5, speed - 1);
            it.collected = true;
            for (let j = 0; j < 4; j++) {
              particles.push({x: px, y: py.y, vx: rand(-2, 2), vy: rand(-2, 0),
                life: 20, color: '#ff4444', size: rand(2, 4)});
            }
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (dist >= maxDist) {
        finished = true;
        scores.game1 = score;
      }
    }

    // DRAW
    ctx.clearRect(0, 0, W, H);

    // Parallax sky/walls
    const stormAlpha = dist > maxDist * 0.8 ? (dist - maxDist * 0.8) / (maxDist * 0.2) : 0;
    const skyBase = ctx.createLinearGradient(0, 0, 0, H * 0.3);
    skyBase.addColorStop(0, '#3a2040');
    skyBase.addColorStop(1, '#6a4070');
    ctx.fillStyle = skyBase;
    ctx.fillRect(0, 0, W, H * 0.3);

    // Windows in background
    for (let i = 0; i < 3; i++) {
      const wx = ((i * W/3 + 50 - dist * 0.2) % (W + 100)) - 50;
      drawGothicWindow(ctx, wx, H * 0.05, 40 * scale, 70 * scale,
        stormAlpha > 0 ? 'rgba(60,60,80,0.8)' : 'rgba(200,180,255,0.3)', '#8b7355');
    }

    // Storm clouds in windows
    if (stormAlpha > 0) {
      ctx.globalAlpha = stormAlpha * 0.5;
      ctx.fillStyle = '#2a2a3a';
      for (let i = 0; i < 4; i++) {
        const cx = ((i * 100 + t * 30) % (W + 60)) - 30;
        ctx.beginPath();
        ctx.ellipse(cx, H * 0.1, 40, 15, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Walls
    ctx.fillStyle = '#5a4a60';
    ctx.fillRect(0, H * 0.28, W, H * 0.15);

    // Columns
    for (let i = 0; i < 5; i++) {
      const cx = ((i * W/4 + 30 - dist * 0.5) % (W + 80)) - 40;
      ctx.fillStyle = '#8b7355';
      ctx.fillRect(cx, H * 0.25, 14 * scale, H * 0.2);
      // Column cap
      ctx.fillStyle = '#a08a60';
      ctx.fillRect(cx - 3, H * 0.25, 20 * scale, 6);
    }

    // Tapestries
    for (let i = 0; i < 3; i++) {
      const tx = ((i * W/2.5 + 80 - dist * 0.5) % (W + 100)) - 50;
      ctx.fillStyle = '#8b2252';
      ctx.fillRect(tx, H * 0.3, 20 * scale, 30 * scale);
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(tx + 2, H * 0.3 + 2, 16 * scale, 2);
    }

    // Pews
    for (let i = 0; i < 6; i++) {
      const px = ((i * W/5 + 20 - dist * 1.2) % (W + 80)) - 40;
      ctx.fillStyle = '#6b4226';
      ctx.fillRect(px, groundY - 5, 30 * scale, 20 * scale);
      ctx.fillStyle = '#8b5a3a';
      ctx.fillRect(px, groundY - 10, 30 * scale, 8);
    }

    // Carpet
    ctx.fillStyle = '#8b2232';
    ctx.fillRect(0, groundY, W, H * 0.08);
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(0, groundY, W, 2);
    ctx.fillRect(0, groundY + H * 0.08 - 2, W, 2);

    // Floor
    ctx.fillStyle = '#4a3a30';
    ctx.fillRect(0, groundY + H * 0.08, W, H);

    // Items
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.collected) continue;
      ctx.save();
      if (it.type === 'petal') {
        ctx.fillStyle = '#ffb7c5';
        ctx.beginPath();
        ctx.ellipse(it.x + it.w/2, it.y + it.h/2, it.w/2, it.h/3, t * 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.type === 'ring') {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(it.x + it.w/2, it.y + it.h/2, it.w/2, 0, Math.PI * 2);
        ctx.stroke();
        // Sparkle
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.5 + Math.sin(t * 8) * 0.5;
        ctx.beginPath();
        ctx.arc(it.x + it.w/2 + 4, it.y + it.h/2 - 4, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.type === 'chair') {
        ctx.fillStyle = '#6b4226';
        ctx.fillRect(it.x, it.y - it.h, it.w, it.h);
        ctx.fillStyle = '#8b5a3a';
        ctx.fillRect(it.x + 2, it.y - it.h, it.w - 4, 6);
      } else if (it.type === 'cork') {
        ctx.fillStyle = '#c4a86a';
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.w/2, 0, Math.PI * 2);
        ctx.fill();
      } else if (it.type === 'program') {
        ctx.fillStyle = '#f5f5dc';
        ctx.fillRect(it.x, it.y, it.w, it.h);
        ctx.fillStyle = '#333';
        ctx.font = '6px sans-serif';
        ctx.fillText('♥', it.x + 4, it.y + 12);
      }
      ctx.restore();
    }

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life / 40;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Player
    const playerX = W * 0.2;
    drawChibiSprite(ctx, playerX, py.y, scale * 3, {
      hair: avatar.hair, hairColor: avatar.hairColor,
      top: avatar.top, bottom: avatar.bottom,
      shoes: avatar.shoes, acc: avatar.acc,
      frame: Math.floor(py.frame)
    });

    // HUD — progress bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(20, 10, W - 40, 14);
    const prog = clamp(dist / maxDist, 0, 1);
    const progGrad = ctx.createLinearGradient(20, 0, W - 40, 0);
    progGrad.addColorStop(0, '#ff6b8a');
    progGrad.addColorStop(1, '#ffd700');
    ctx.fillStyle = progGrad;
    ctx.fillRect(20, 10, (W - 40) * prog, 14);
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1;
    ctx.strokeRect(20, 10, W - 40, 14);

    // Score
    drawTextOutline('Score: ' + score, W - 60, 38, 14 * scale, '#ffd700', '#333', 'center');

    // Finish overlay
    if (finished) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, H * 0.3, W, H * 0.45);
      drawTextOutline('Aisle Complete!', W/2, H * 0.4, 24 * scale, '#ffd700', '#333', 'center');
      drawTextOutline('Score: ' + score, W/2, H * 0.5, 20 * scale, '#fff', '#333', 'center');
      drawButton('Continue', W/2, H * 0.65, 160 * scale, 44 * scale, '#d4af37', '#1a1a3e');
    }

    animId = requestAnimationFrame(loop);
  }

  loop();
}

/* ═══════════════════════════════════════════
   5. STORM TRANSITION
   ═══════════════════════════════════════════ */
function initStormTransition() {
  showScreen('stormTransition');
  let t = 0;
  const rain = [];
  for (let i = 0; i < 80; i++) {
    rain.push({x: rand(0, W), y: rand(-H, H), speed: rand(8, 15), len: rand(10, 25)});
  }
  let lightningTimer = 0;
  let lightningAlpha = 0;
  let showBtn = false;
  const btnX = W/2, btnY = H * 0.85, btnW = 160 * scale, btnH = 44 * scale;

  function loop() {
    if (currentScreen !== 'stormTransition') return;
    t += 0.016;
    if (t > 2) showBtn = true;
    ctx.clearRect(0, 0, W, H);

    // Storm sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    skyGrad.addColorStop(0, '#1a1a2e');
    skyGrad.addColorStop(1, '#2a2a4e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.6);

    // Storm clouds
    ctx.fillStyle = '#2a2a3e';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * W/5 + t * 15) % (W + 80)) - 40;
      ctx.beginPath();
      ctx.ellipse(cx, H * 0.08 + (i % 3) * 15, 60 * scale, 22 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ground
    ctx.fillStyle = '#2d4a2e';
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    // Mansion
    drawMansion(ctx, W * 0.5, H * 0.57, scale * 0.7, 'storm', W, H);

    // Lightning
    lightningTimer += 0.016;
    if (lightningTimer > rand(2, 4)) {
      lightningAlpha = 0.8;
      lightningTimer = 0;
    }
    if (lightningAlpha > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + lightningAlpha + ')';
      ctx.fillRect(0, 0, W, H);
      lightningAlpha -= 0.05;
    }

    // Rain
    ctx.strokeStyle = 'rgba(180,200,255,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < rain.length; i++) {
      const r = rain[i];
      r.y += r.speed;
      if (r.y > H) { r.y = -20; r.x = rand(0, W); }
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - 1, r.y + r.len);
      ctx.stroke();
    }

    // Text
    drawTextOutline('A Storm Approaches!', W/2, H * 0.25, 20 * scale, '#aaa', '#000', 'center');
    drawTextOutline('Lyndhurst Mansion', W/2, H * 0.32, 14 * scale, '#888', '#000', 'center');

    if (showBtn) {
      drawButton('Continue', btnX, btnY, btnW, btnH, '#6a5acd', '#fff');
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (!showBtn) return;
    const p = getCanvasXY(e);
    if (hitBtn(p.x, p.y, btnX, btnY, btnW, btnH)) {
      initWitchIntro();
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   6. WITCH INTRO
   ═══════════════════════════════════════════ */
function initWitchIntro() {
  showScreen('witchIntro');
  let t = 0;
  let witchX = W + 60;
  const witchTargetX = W * 0.5;
  const witchY = H * 0.3;
  const sparkles = [];
  const rain = [];
  for (let i = 0; i < 50; i++) {
    rain.push({x: rand(0, W), y: rand(-H, H), speed: rand(8, 14), len: rand(10, 20)});
  }

  const dialogText = 'I am the Wedding Witch! Let me cast a spell to clear these skies!';
  let charIdx = 0;
  let showBtn = false;
  const btnX = W/2, btnY = H * 0.88, btnW = 180 * scale, btnH = 44 * scale;

  function loop() {
    if (currentScreen !== 'witchIntro') return;
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    // Storm sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    skyGrad.addColorStop(0, '#1a1a2e');
    skyGrad.addColorStop(1, '#2a2a4e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.6);

    ctx.fillStyle = '#2d4a2e';
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    drawMansion(ctx, W * 0.5, H * 0.57, scale * 0.6, 'storm', W, H);

    // Rain
    ctx.strokeStyle = 'rgba(180,200,255,0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < rain.length; i++) {
      const r = rain[i];
      r.y += r.speed;
      if (r.y > H) { r.y = -20; r.x = rand(0, W); }
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - 1, r.y + r.len);
      ctx.stroke();
    }

    // Witch flies in
    if (witchX > witchTargetX) {
      witchX -= 2.5;
    }
    const witchBob = Math.sin(t * 2) * 8;
    drawWitch(ctx, witchX, witchY + witchBob, scale * 3);

    // Sparkle trail
    if (witchX > witchTargetX - 10) {
      sparkles.push({
        x: witchX + rand(-10, 10), y: witchY + witchBob + rand(-5, 15),
        vx: rand(-1, 1), vy: rand(-1, 1),
        life: 30, color: ['#ffd700','#ff69b4','#7fffd4','#fff'][randInt(0,3)],
        size: rand(2, 5)
      });
    }
    // Always add some sparkles when witch has arrived
    if (Math.random() < 0.3) {
      sparkles.push({
        x: witchX + rand(-20, 20), y: witchY + witchBob + rand(-10, 20),
        vx: rand(-1.5, 1.5), vy: rand(-2, 0.5),
        life: 25, color: ['#ffd700','#ff69b4','#7fffd4'][randInt(0,2)],
        size: rand(1.5, 4)
      });
    }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.life--;
      if (s.life <= 0) { sparkles.splice(i, 1); continue; }
      ctx.globalAlpha = s.life / 30;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Typewriter
    if (charIdx < dialogText.length) charIdx += 0.5;
    const displayText = dialogText.substring(0, Math.floor(charIdx));
    if (charIdx >= dialogText.length) showBtn = true;

    // Dialog box
    const dbY = H * 0.68;
    const dbH = H * 0.14;
    ctx.fillStyle = 'rgba(40,0,60,0.85)';
    ctx.beginPath();
    const r2 = 12;
    ctx.moveTo(20 + r2, dbY);
    ctx.lineTo(W - 20 - r2, dbY);
    ctx.quadraticCurveTo(W - 20, dbY, W - 20, dbY + r2);
    ctx.lineTo(W - 20, dbY + dbH - r2);
    ctx.quadraticCurveTo(W - 20, dbY + dbH, W - 20 - r2, dbY + dbH);
    ctx.lineTo(20 + r2, dbY + dbH);
    ctx.quadraticCurveTo(20, dbY + dbH, 20, dbY + dbH - r2);
    ctx.lineTo(20, dbY + r2);
    ctx.quadraticCurveTo(20, dbY, 20 + r2, dbY);
    ctx.fill();
    ctx.strokeStyle = '#9b59b6';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#e0d0ff';
    ctx.font = (13 * scale) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Wrap text
    const words = displayText.split(' ');
    let line1 = '', line2 = '';
    for (let i = 0; i < words.length; i++) {
      const test = line1 + (line1 ? ' ' : '') + words[i];
      if (ctx.measureText(test).width < W - 60) {
        line1 = test;
      } else {
        line2 += (line2 ? ' ' : '') + words[i];
      }
    }
    ctx.fillText(line1, W/2, dbY + dbH * 0.35);
    if (line2) ctx.fillText(line2, W/2, dbY + dbH * 0.65);

    if (showBtn) {
      drawButton('Cast the Spell!', btnX, btnY, btnW, btnH, '#9b59b6', '#fff');
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (!showBtn) {
      charIdx = dialogText.length;
      showBtn = true;
      return;
    }
    const p = getCanvasXY(e);
    if (hitBtn(p.x, p.y, btnX, btnY, btnW, btnH)) {
      initGame2();
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   7. GAME 2 — DDR RHYTHM GAME
   ═══════════════════════════════════════════ */
function initGame2() {
  showScreen('game2');
  const g2Canvas = document.getElementById('screenGame2');
  // We use the main canvas but show DOM buttons

  // Actually, let's use canvas screen + overlay buttons
  showScreen('game2');

  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let t = 0;
  const gameDuration = 60; // seconds
  let gameTime = 0;
  let finished = false;

  // Arrow pattern
  const dirs = ['left','down','up','right'];
  const dirColors = {left:'#ff6b8a', down:'#6bcaff', up:'#6bff8a', right:'#ffcf6b'};
  const dirSymbols = {left:'◀', down:'▼', up:'▲', right:'▶'};

  const pattern = [];
  let pTime = 1000; // ms
  // Build pattern: start simple, get faster
  for (let i = 0; i < 90; i++) {
    const progress = i / 90;
    const gap = progress < 0.3 ? rand(500, 700) : (progress < 0.7 ? rand(350, 550) : rand(280, 420));
    pattern.push({time: pTime, dir: dirs[randInt(0, 3)], hit: false, missed: false});
    pTime += gap;
    // Doubles near end
    if (progress > 0.8 && Math.random() < 0.3) {
      const otherDir = dirs[randInt(0, 3)];
      if (otherDir !== pattern[pattern.length - 1].dir) {
        pattern.push({time: pTime - gap + 20, dir: otherDir, hit: false, missed: false});
      }
    }
  }
  const maxPossible = pattern.length * 100; // If all PERFECT

  // Arrow rendering
  const laneW = W / 6;
  const laneX = {left: W/2 - laneW * 1.5, down: W/2 - laneW * 0.5, up: W/2 + laneW * 0.5, right: W/2 + laneW * 1.5};
  const targetY = H * 0.15;
  const spawnY = H * 0.85;
  const arrowSpeed = (spawnY - targetY) / 2000; // pixels per ms — 2 sec travel

  // Feedback popups
  const feedbacks = [];

  // Witch
  let witchX = W * 0.5;
  let witchDir = 1;

  // Create DOM buttons
  const btnContainer = document.createElement('div');
  btnContainer.id = 'g2buttons';
  btnContainer.style.cssText = 'position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10;';
  const btnSize = Math.min(72, W / 6);

  dirs.forEach(function(dir) {
    const btn = document.createElement('button');
    btn.textContent = dirSymbols[dir];
    btn.dataset.dir = dir;
    btn.style.cssText = 'width:' + btnSize + 'px;height:' + btnSize + 'px;border-radius:50%;border:3px solid ' +
      dirColors[dir] + ';background:rgba(0,0,0,0.7);color:' + dirColors[dir] + ';font-size:' + (btnSize * 0.5) + 'px;' +
      'cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;';
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); handleHit(dir); });
    btn.addEventListener('mousedown', function() { handleHit(dir); });
    btnContainer.appendChild(btn);
  });
  app.appendChild(btnContainer);

  function handleHit(dir) {
    if (finished) return;
    const now = gameTime * 1000;
    let bestDiff = 9999;
    let bestIdx = -1;
    for (let i = 0; i < pattern.length; i++) {
      const a = pattern[i];
      if (a.hit || a.missed || a.dir !== dir) continue;
      const diff = Math.abs(a.time - now);
      if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
    }

    if (bestIdx >= 0 && bestDiff <= 200) {
      const a = pattern[bestIdx];
      a.hit = true;
      let pts = 0;
      let label = '';
      let color = '';
      if (bestDiff <= 30) { pts = 100; label = 'PERFECT!'; color = '#ffd700'; }
      else if (bestDiff <= 80) { pts = 50; label = 'GREAT!'; color = '#6bff8a'; }
      else if (bestDiff <= 130) { pts = 25; label = 'GOOD'; color = '#6bcaff'; }
      else { pts = 10; label = 'OK'; color = '#aaa'; }

      // Combo multiplier
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      let mult = 1;
      if (combo >= 50) mult = 3;
      else if (combo >= 25) mult = 2;
      else if (combo >= 10) mult = 1.5;

      pts = Math.floor(pts * mult);
      score += pts;

      feedbacks.push({text: label + (mult > 1 ? ' x' + mult : ''), x: laneX[dir], y: targetY, life: 40, color: color});

      // Witch sparkle on PERFECT
      if (bestDiff <= 30) {
        for (let j = 0; j < 5; j++) {
          feedbacks.push({text: '✨', x: witchX + rand(-30, 30), y: H * 0.06 + rand(-10, 10), life: 25, color: '#ffd700'});
        }
      }
    }
  }

  function loop() {
    if (currentScreen !== 'game2') {
      const btns = document.getElementById('g2buttons');
      if (btns) btns.remove();
      return;
    }
    t += 0.016;
    if (!finished) gameTime += 0.016;

    const now = gameTime * 1000;

    // Auto-miss
    if (!finished) {
      for (let i = 0; i < pattern.length; i++) {
        const a = pattern[i];
        if (!a.hit && !a.missed && now - a.time > 200) {
          a.missed = true;
          combo = 0;
          feedbacks.push({text: 'MISS', x: laneX[a.dir], y: targetY, life: 30, color: '#ff4444'});
        }
      }
    }

    // Check finish
    if (gameTime >= gameDuration && !finished) {
      finished = true;
      scores.game2 = score;
      scores.game2combo = maxCombo;
    }

    ctx.clearRect(0, 0, W, H);

    // Background — storm clearing
    const clearProgress = clamp(score / (maxPossible * 0.6), 0, 1);
    const skyR = Math.floor(lerp(26, 100, clearProgress));
    const skyG = Math.floor(lerp(26, 150, clearProgress));
    const skyB = Math.floor(lerp(46, 220, clearProgress));
    ctx.fillStyle = 'rgb(' + skyR + ',' + skyG + ',' + skyB + ')';
    ctx.fillRect(0, 0, W, H * 0.3);

    // Clouds
    ctx.fillStyle = 'rgba(60,60,80,' + (1 - clearProgress) * 0.6 + ')';
    for (let i = 0; i < 5; i++) {
      const cx = ((i * W/4 + t * 10) % (W + 80)) - 40;
      ctx.beginPath();
      ctx.ellipse(cx, H * 0.06 + (i % 3) * 12, 50 * scale, 18 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Rainbow at 75%+
    if (clearProgress > 0.75) {
      const ra = (clearProgress - 0.75) / 0.25;
      ctx.globalAlpha = ra * 0.5;
      const rbColors = ['#ff0000','#ff7700','#ffff00','#00ff00','#0000ff','#8b00ff'];
      for (let i = 0; i < rbColors.length; i++) {
        ctx.strokeStyle = rbColors[i];
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(W * 0.5, H * 0.35, (80 + i * 8) * scale, Math.PI, 0);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Mansion small
    drawMansion(ctx, W * 0.5, H * 0.25, scale * 0.35, clearProgress > 0.5 ? 'clear' : 'storm', W, H);

    // Lane backgrounds
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    for (let d = 0; d < dirs.length; d++) {
      const x = laneX[dirs[d]];
      ctx.fillRect(x - laneW/2 + 4, targetY - 20, laneW - 8, spawnY - targetY + 20);
    }

    // Target zones
    for (let d = 0; d < dirs.length; d++) {
      const dir = dirs[d];
      const x = laneX[dir];
      ctx.strokeStyle = dirColors[dir];
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.2;
      ctx.strokeRect(x - 18, targetY - 18, 36, 36);
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = dirColors[dir];
      ctx.fillRect(x - 18, targetY - 18, 36, 36);
      ctx.globalAlpha = 1;
    }

    // Arrows
    for (let i = 0; i < pattern.length; i++) {
      const a = pattern[i];
      if (a.hit || a.missed) continue;
      const elapsed = now - a.time;
      // Arrow position: at time=0 arrow is at spawnY, at time reaches 0 it should be at targetY
      // y = spawnY - (elapsed + 2000) * arrowSpeed
      // Actually: arrow spawns 2000ms before its time
      const arrowY = spawnY - (elapsed + 2000) * arrowSpeed;
      if (arrowY < -40 || arrowY > H + 40) continue;

      const x = laneX[a.dir];
      ctx.fillStyle = dirColors[a.dir];
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(dirSymbols[a.dir], x, arrowY);
    }

    // Feedbacks
    for (let i = feedbacks.length - 1; i >= 0; i--) {
      const f = feedbacks[i];
      f.y -= 1.5;
      f.life--;
      if (f.life <= 0) { feedbacks.splice(i, 1); continue; }
      ctx.globalAlpha = f.life / 40;
      ctx.fillStyle = f.color;
      ctx.font = 'bold ' + (14 * scale) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // Witch
    witchX += witchDir * 0.8;
    if (witchX > W - 30) witchDir = -1;
    if (witchX < 30) witchDir = 1;
    drawWitch(ctx, witchX, H * 0.04 + Math.sin(t * 2) * 5, scale * 2);

    // HUD
    drawTextOutline('Score: ' + score, W/2, H * 0.05 - 12, 12 * scale, '#ffd700', '#000', 'center');
    const comboText = combo > 1 ? 'Combo: ' + combo + 'x' : '';
    if (comboText) drawTextOutline(comboText, W/2, H * 0.05, 10 * scale, '#ff69b4', '#000', 'center');

    // Timer
    const remaining = Math.max(0, Math.ceil(gameDuration - gameTime));
    drawTextOutline(remaining + 's', W - 30, 14, 12 * scale, '#fff', '#000', 'center');

    // Finish overlay
    if (finished) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, H * 0.25, W, H * 0.5);
      drawTextOutline('Spell Complete!', W/2, H * 0.35, 24 * scale, '#9b59b6', '#000', 'center');
      drawTextOutline('Score: ' + score, W/2, H * 0.45, 20 * scale, '#ffd700', '#000', 'center');
      drawTextOutline('Max Combo: ' + maxCombo + 'x', W/2, H * 0.53, 16 * scale, '#ff69b4', '#000', 'center');
      drawButton('Continue', W/2, H * 0.65, 160 * scale, 44 * scale, '#9b59b6', '#fff');

      // Remove DOM buttons
      const btns = document.getElementById('g2buttons');
      if (btns) btns.remove();
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (!finished) return;
    const p = getCanvasXY(e);
    if (hitBtn(p.x, p.y, W/2, H * 0.65, 160 * scale, 44 * scale)) {
      const btns = document.getElementById('g2buttons');
      if (btns) btns.remove();
      initClearSkies();
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   8. CLEAR SKIES
   ═══════════════════════════════════════════ */
function initClearSkies() {
  showScreen('clearSkies');
  let t = 0;
  const petals = [];
  for (let i = 0; i < 20; i++) {
    petals.push({x: rand(0, W), y: rand(0, H), vx: rand(-0.5, 0.5), vy: rand(0.2, 1), size: rand(2, 5) * scale, alpha: rand(0.3, 0.7)});
  }
  const birds = [];
  for (let i = 0; i < 6; i++) {
    birds.push({ox: W * 0.3 + i * 15 * scale, oy: H * 0.12 + Math.abs(i - 3) * 8 * scale, phase: rand(0, 6)});
  }
  let showBtn = false;
  const btnX = W/2, btnY = H * 0.88, btnW = 160 * scale, btnH = 44 * scale;

  function loop() {
    if (currentScreen !== 'clearSkies') return;
    t += 0.016;
    if (t > 1.5) showBtn = true;
    ctx.clearRect(0, 0, W, H);

    // Bright sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    skyGrad.addColorStop(0, '#4da6ff');
    skyGrad.addColorStop(1, '#87ceeb');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.6);

    // Sun
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.1, 30 * scale, 0, Math.PI * 2);
    ctx.fill();
    // Sun rays
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.1, 50 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Rainbow
    const rbColors = ['#ff0000','#ff7700','#ffff00','#00ff00','#0000ff','#4b0082','#8b00ff'];
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < rbColors.length; i++) {
      ctx.strokeStyle = rbColors[i];
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(W * 0.5, H * 0.45, (100 + i * 8) * scale, Math.PI, 0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // White clouds
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 3; i++) {
      const cx = ((i * W/3 + t * 12) % (W + 80)) - 40;
      ctx.beginPath();
      ctx.ellipse(cx, H * 0.08 + i * 20, 40 * scale, 14 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Lawn
    ctx.fillStyle = '#4a8c3f';
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    // Mansion
    drawMansion(ctx, W * 0.5, H * 0.57, scale * 0.7, 'clear', W, H);

    // Birds
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      const bx = b.ox + Math.sin(t * 0.3 + b.phase) * 20;
      const by = b.oy + Math.sin(t * 3 + b.phase) * 3;
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx - 4 * scale, by + Math.sin(t * 4 + b.phase) * 2);
      ctx.lineTo(bx, by);
      ctx.lineTo(bx + 4 * scale, by + Math.sin(t * 4 + b.phase + 1) * 2);
      ctx.stroke();
    }

    // Witch waves
    drawWitch(ctx, W * 0.75, H * 0.35 + Math.sin(t * 2) * 5, scale * 2.5);

    // Petals
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.x += p.vx + Math.sin(t + i) * 0.3;
      p.y += p.vy;
      if (p.y > H) { p.y = -5; p.x = rand(0, W); }
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = '#ffb7c5';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, t + i, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawTextOutline('The Skies Are Clear!', W/2, H * 0.22, 20 * scale, '#ffd700', '#333', 'center');
    drawTextOutline('Time for the ceremony!', W/2, H * 0.28, 14 * scale, '#fff', '#333', 'center');

    if (showBtn) {
      drawButton('Continue', btnX, btnY, btnW, btnH, '#d4af37', '#1a1a3e');
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (!showBtn) return;
    const p = getCanvasXY(e);
    if (hitBtn(p.x, p.y, btnX, btnY, btnW, btnH)) {
      initGame3();
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   9. GAME 3 — MAZEL TOV METER
   ═══════════════════════════════════════════ */
function initGame3() {
  showScreen('game3');

  let t = 0;
  let round = 0;
  const totalRounds = 4;
  const speeds = [1, 1.3, 1.6, 2.0];
  let needlePos = 0; // -1 to 1
  let needleDir = 1;
  let score = 0;
  let roundScores = [];
  let waiting = false; // waiting for tap
  let roundResult = '';
  let roundResultTimer = 0;
  let finished = false;
  let confetti = [];
  let showFinalBtn = false;

  // Cannon positions
  const cannons = [
    {x: W * 0.08, y: H * 0.45, dir: 1},
    {x: W * 0.18, y: H * 0.5, dir: 1},
    {x: W * 0.82, y: H * 0.5, dir: -1},
    {x: W * 0.92, y: H * 0.45, dir: -1}
  ];

  waiting = true; // Start with tap prompt

  function fireCannon(idx, intensity) {
    const c = cannons[idx];
    const count = intensity >= 80 ? 30 : (intensity >= 40 ? 18 : 8);
    const colors = ['#ff6b8a','#ffd700','#6bcaff','#ff69b4','#6bff8a','#ff7700','#fff'];
    for (let i = 0; i < count; i++) {
      confetti.push({
        x: c.x, y: c.y,
        vx: c.dir * rand(2, 8) + rand(-1, 1),
        vy: rand(-10, -3),
        life: rand(50, 100),
        color: colors[randInt(0, colors.length - 1)],
        size: rand(2, 6),
        rot: rand(0, Math.PI * 2),
        rotV: rand(-0.1, 0.1)
      });
    }
  }

  function loop() {
    if (currentScreen !== 'game3') return;
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    // Interior scene
    // Gothic arch ceiling
    const ceilGrad = ctx.createLinearGradient(0, 0, 0, H * 0.3);
    ceilGrad.addColorStop(0, '#2a1a30');
    ceilGrad.addColorStop(1, '#4a3050');
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0, 0, W, H * 0.3);

    // Arch
    ctx.strokeStyle = '#8b7355';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(W * 0.1, H * 0.4);
    ctx.quadraticCurveTo(W * 0.5, -H * 0.05, W * 0.9, H * 0.4);
    ctx.stroke();

    // Walls
    ctx.fillStyle = '#5a4a60';
    ctx.fillRect(0, H * 0.3, W, H * 0.15);

    // Stained glass window
    drawGothicWindow(ctx, W * 0.5 - 25 * scale, H * 0.05, 50 * scale, 80 * scale, 'rgba(200,150,255,0.3)', '#8b7355');

    // Floor
    ctx.fillStyle = '#4a3a30';
    ctx.fillRect(0, H * 0.45, W, H * 0.55);
    // Carpet
    ctx.fillStyle = '#8b2232';
    ctx.fillRect(W * 0.3, H * 0.45, W * 0.4, H * 0.55);

    // Altar
    ctx.fillStyle = '#f5f5dc';
    ctx.fillRect(W * 0.4, H * 0.42, W * 0.2, H * 0.05);

    // Couple at altar
    drawChibiSprite(ctx, W * 0.45, H * 0.43, scale * 2.5, {hair:2, hairColor:0, top:3, bottom:2, shoes:0, acc:0, frame:0});
    drawChibiSprite(ctx, W * 0.55, H * 0.43, scale * 2.5, {hair:4, hairColor:3, top:5, bottom:4, shoes:1, acc:2, frame:0});

    // Confetti cannons
    for (let i = 0; i < cannons.length; i++) {
      const c = cannons[i];
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(c.x - 6, c.y - 15, 12, 20);
      ctx.fillStyle = '#8b7355';
      ctx.beginPath();
      ctx.arc(c.x, c.y - 15, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Confetti particles
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.15;
      c.vx *= 0.99;
      c.rot += c.rotV;
      c.life--;
      if (c.life <= 0 || c.y > H + 10) { confetti.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.globalAlpha = Math.min(1, c.life / 20);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.6);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (!finished) {
      // Mazel Tov Meter
      const meterX = W * 0.1;
      const meterW = W * 0.8;
      const meterY = H * 0.6;
      const meterH = 30 * scale;

      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(meterX, meterY, meterW, meterH);

      // Zones (symmetric from center)
      const centerX = meterX + meterW / 2;
      // Red zone (full width)
      ctx.fillStyle = '#cc3333';
      ctx.fillRect(meterX, meterY, meterW, meterH);
      // Orange (40% = 20% each side from center)
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(centerX - meterW * 0.2, meterY, meterW * 0.4, meterH);
      // Yellow (20% = 10% each side)
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(centerX - meterW * 0.1, meterY, meterW * 0.2, meterH);
      // Green (8% = 4% each side)
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(centerX - meterW * 0.04, meterY, meterW * 0.08, meterH);

      // Border
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.strokeRect(meterX, meterY, meterW, meterH);

      // Labels
      ctx.font = (9 * scale) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('PERFECT', centerX, meterY + meterH + 14 * scale);

      // Needle
      if (waiting && !roundResult) {
        // Move needle
        const spd = speeds[Math.min(round, speeds.length - 1)];
        needlePos += needleDir * 0.025 * spd;
        if (needlePos > 1) { needlePos = 1; needleDir = -1; }
        if (needlePos < -1) { needlePos = -1; needleDir = 1; }
      }

      const needleX = centerX + needlePos * (meterW / 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(needleX, meterY - 5);
      ctx.lineTo(needleX, meterY + meterH + 5);
      ctx.stroke();
      // Needle head
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(needleX - 6, meterY - 5);
      ctx.lineTo(needleX + 6, meterY - 5);
      ctx.lineTo(needleX, meterY + 3);
      ctx.fill();

      // Round indicator
      drawTextOutline('Round ' + (round + 1) + '/' + totalRounds, W/2, H * 0.55, 16 * scale, '#ffd700', '#000', 'center');

      // Instruction
      if (!roundResult) {
        const pulse = 0.5 + Math.sin(t * 4) * 0.5;
        ctx.globalAlpha = 0.6 + pulse * 0.4;
        drawTextOutline('TAP!', W/2, H * 0.78, 22 * scale, '#fff', '#333', 'center');
        ctx.globalAlpha = 1;
      }

      // Round result
      if (roundResult) {
        drawTextOutline(roundResult, W/2, H * 0.78, 20 * scale, roundResult === 'PERFECT!' ? '#2ecc71' : (roundResult === 'GREAT!' ? '#f1c40f' : (roundResult === 'GOOD!' ? '#e67e22' : '#cc3333')), '#000', 'center');
        roundResultTimer -= 0.016;
        if (roundResultTimer <= 0) {
          roundResult = '';
          round++;
          if (round >= totalRounds) {
            finished = true;
            scores.game3 = score;
            showFinalBtn = true;
            // Big celebration
            if (score >= 250) {
              for (let c = 0; c < cannons.length; c++) fireCannon(c, 100);
            } else if (score >= 150) {
              for (let c = 0; c < cannons.length; c++) fireCannon(c, 50);
            } else {
              fireCannon(0, 20);
              fireCannon(3, 20);
            }
          } else {
            waiting = true;
            needleDir = (Math.random() < 0.5) ? 1 : -1;
          }
        }
      }

      // Score
      drawTextOutline('Score: ' + score, W/2, H * 0.92, 14 * scale, '#ffd700', '#000', 'center');
    } else {
      // Finished
      drawTextOutline('Mazel Tov!', W/2, H * 0.55, 26 * scale, '#ffd700', '#333', 'center');
      drawTextOutline('Score: ' + score + '/' + (totalRounds * 100), W/2, H * 0.62, 16 * scale, '#fff', '#333', 'center');
      if (showFinalBtn) {
        drawButton('See Final Score!', W/2, H * 0.75, 200 * scale, 48 * scale, '#d4af37', '#1a1a3e');
      }
    }

    animId = requestAnimationFrame(loop);
  }

  setCanvasHandler(function(e) {
    if (finished) {
      const p = getCanvasXY(e);
      if (hitBtn(p.x, p.y, W/2, H * 0.75, 200 * scale, 48 * scale)) {
        initFinale();
      }
      return;
    }

    if (waiting && !roundResult) {
      // Stop needle, evaluate
      const absPos = Math.abs(needlePos);
      let pts = 0;
      let label = '';
      if (absPos <= 0.04) { pts = 100; label = 'PERFECT!'; }
      else if (absPos <= 0.1) { pts = 60; label = 'GREAT!'; }
      else if (absPos <= 0.2) { pts = 30; label = 'GOOD!'; }
      else { pts = 0; label = 'MISS!'; }

      score += pts;
      roundScores.push(pts);
      roundResult = label;
      roundResultTimer = 1.5;
      waiting = false;

      // Fire cannon for this round
      fireCannon(round % cannons.length, pts);
    }
  });

  loop();
}

/* ═══════════════════════════════════════════
   10. FINALE
   ═══════════════════════════════════════════ */
function initFinale() {
  showScreen('finale');
  const el = document.getElementById('screenFinale');
  if (!el) return;

  const totalScore = scores.game1 + scores.game2 + scores.game3;

  // Save to leaderboard
  let leaderboard = [];
  try {
    const lb = localStorage.getItem('wg_leaderboard');
    if (lb) leaderboard = JSON.parse(lb);
  } catch(e) {}
  const entry = {name: playerName, score: totalScore, date: new Date().toLocaleDateString()};
  leaderboard.push(entry);
  leaderboard.sort(function(a, b) { return b.score - a.score; });
  leaderboard = leaderboard.slice(0, 10);
  try { localStorage.setItem('wg_leaderboard', JSON.stringify(leaderboard)); } catch(e) {}

  const currentRank = leaderboard.findIndex(function(e) { return e.name === playerName && e.score === totalScore; });

  // Build leaderboard HTML
  let lbHtml = '';
  for (let i = 0; i < leaderboard.length; i++) {
    const e = leaderboard[i];
    const isCurrent = i === currentRank;
    lbHtml += '<div style="padding:4px 8px;border-radius:6px;margin:2px 0;' +
      'background:' + (isCurrent ? 'rgba(212,175,55,0.3)' : 'rgba(255,255,255,0.05)') + ';' +
      'border:' + (isCurrent ? '1px solid #d4af37' : '1px solid transparent') + ';' +
      'display:flex;justify-content:space-between;font-size:14px;">' +
      '<span>' + (i === 0 ? '👑' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : (i + 1) + '.'))) +
      ' ' + e.name + '</span>' +
      '<span style="color:#ffd700;">' + e.score + '</span></div>';
  }

  // Firework keyframes
  const fwStyle = document.createElement('style');
  fwStyle.textContent = '@keyframes fwRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-200px);opacity:0}}' +
    '@keyframes fwBurst{0%{transform:scale(0);opacity:1}50%{opacity:1}100%{transform:scale(1.5);opacity:0}}';
  document.head.appendChild(fwStyle);

  el.innerHTML =
    '<div style="padding:16px;max-width:400px;margin:0 auto;color:#fff;text-align:center;position:relative;overflow:hidden;min-height:100%;">' +
      '<div id="fireworks" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;"></div>' +
      '<h1 style="color:#ffd700;font-size:28px;margin:12px 0 4px;text-shadow:0 0 20px rgba(212,175,55,0.5);">🎉 MAZEL TOV! 🎉</h1>' +
      '<canvas id="finaleAvatar" width="80" height="100" style="display:block;margin:8px auto;border-radius:12px;' +
        'background:rgba(0,0,0,0.3);border:2px solid #d4af37;"></canvas>' +
      '<p style="margin:4px 0;font-size:14px;color:#ccc;">' + playerName + '</p>' +
      '<div style="margin:12px 0;">' +
        '<div style="font-size:14px;color:#aaa;margin-bottom:4px;">Total Score</div>' +
        '<div id="scoreCount" style="font-size:42px;font-weight:bold;color:#ffd700;text-shadow:0 0 20px rgba(212,175,55,0.4);">0</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-around;margin:8px 0;font-size:12px;color:#aaa;">' +
        '<div>🌸 Aisle: ' + scores.game1 + '</div>' +
        '<div>🎵 Rhythm: ' + scores.game2 + '</div>' +
        '<div>🎯 Timing: ' + scores.game3 + '</div>' +
      '</div>' +
      '<div style="margin:12px 0;">' +
        '<div style="font-size:16px;color:#d4af37;margin-bottom:6px;">🏆 Leaderboard</div>' +
        lbHtml +
      '</div>' +
      '<div style="margin:16px 0;display:flex;flex-direction:column;gap:8px;align-items:center;">' +
        '<button id="copyBtn" style="padding:10px 20px;border:none;border-radius:10px;' +
          'background:linear-gradient(135deg,#d4af37,#f0d060);color:#1a1a3e;font-weight:bold;font-size:14px;cursor:pointer;' +
          'width:80%;max-width:280px;">📋 Copy Score</button>' +
        '<a href="#" style="color:#6bcaff;font-size:14px;">📸 Photo Album</a>' +
        '<button id="replayBtn" style="padding:10px 20px;border:none;border-radius:10px;' +
          'background:#4a3060;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;border:2px solid #9b59b6;' +
          'width:80%;max-width:280px;">🎮 Play Again</button>' +
      '</div>' +
      '<p style="font-size:11px;color:#666;margin-top:16px;">Made with ❤️ for Max & Julie\'s Wedding at Lyndhurst</p>' +
    '</div>';

  // Draw avatar
  setTimeout(function() {
    const fc = document.getElementById('finaleAvatar');
    if (fc) {
      const fCtx = fc.getContext('2d');
      drawChibiSprite(fCtx, 40, 65, 3, {
        hair: avatar.hair, hairColor: avatar.hairColor,
        top: avatar.top, bottom: avatar.bottom,
        shoes: avatar.shoes, acc: avatar.acc, frame: 0
      });
    }
  }, 50);

  // Score count-up animation
  let countStart = performance.now();
  function countUp() {
    const elapsed = performance.now() - countStart;
    const progress = Math.min(1, elapsed / 2000);
    const eased = 1 - Math.pow(1 - progress, 3); // ease out cubic
    const displayScore = Math.floor(eased * totalScore);
    const el2 = document.getElementById('scoreCount');
    if (el2) el2.textContent = displayScore;
    if (progress < 1) requestAnimationFrame(countUp);
  }
  requestAnimationFrame(countUp);

  // Firework spawner
  const fwContainer = document.getElementById('fireworks');
  function spawnFirework() {
    if (currentScreen !== 'finale') return;
    const colors = ['#ff6b8a','#ffd700','#6bcaff','#ff69b4','#6bff8a','#ff7700','#9b59b6'];
    const x = rand(10, 90);
    const y = rand(10, 60);
    for (let i = 0; i < 8; i++) {
      const dot = document.createElement('div');
      const angle = (i / 8) * Math.PI * 2;
      const dist = rand(15, 35);
      dot.style.cssText = 'position:absolute;width:4px;height:4px;border-radius:50%;' +
        'left:' + x + '%;top:' + y + '%;' +
        'background:' + colors[randInt(0, colors.length - 1)] + ';' +
        'animation:fwBurst 1s ease-out forwards;' +
        'transform-origin:' + (Math.cos(angle) * dist) + 'px ' + (Math.sin(angle) * dist) + 'px;';
      if (fwContainer) fwContainer.appendChild(dot);
      setTimeout(function() { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 1200);
    }
    setTimeout(spawnFirework, rand(400, 1200));
  }
  setTimeout(spawnFirework, 300);

  // Event listeners
  setTimeout(function() {
    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) copyBtn.addEventListener('click', function() {
      const text = 'I scored ' + totalScore + ' at Max & Julie\'s Wedding Arcade! 🎮🏰';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() {
          copyBtn.textContent = '✅ Copied!';
          setTimeout(function() { copyBtn.textContent = '📋 Copy Score'; }, 2000);
        });
      } else {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); copyBtn.textContent = '✅ Copied!'; } catch(e2) {}
        document.body.removeChild(ta);
        setTimeout(function() { copyBtn.textContent = '📋 Copy Score'; }, 2000);
      }
    });

    const replayBtn = document.getElementById('replayBtn');
    if (replayBtn) replayBtn.addEventListener('click', function() {
      initWelcome();
    });
  }, 50);
}

/* ═══════════════════════════════════════════
   INIT / LOAD
   ═══════════════════════════════════════════ */
try {
  const sa = localStorage.getItem('wg_avatar');
  if (sa) {
    const parsed = JSON.parse(sa);
    avatar = {hair:0, hairColor:0, top:0, bottom:0, shoes:0, acc:0};
    for (var k in parsed) { if (parsed.hasOwnProperty(k)) avatar[k] = parsed[k]; }
  }
  const sn = localStorage.getItem('wg_name');
  if (sn) playerName = sn;
} catch(e) {}
initWelcome();

</script>
